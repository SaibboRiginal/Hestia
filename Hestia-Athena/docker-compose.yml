services:
  athena:
    build: .
    container_name: hestia_athena
    restart: unless-stopped
    ports:
      - "19009:19009"
    env_file:
      - ./app/.env
    # Tunables are central settings athena.* (Themis); env = infrastructure only.
    environment:
      - HUB_API_URL=http://hestia_hub:19001/api
      - SERVICE_BASE_URL=http://hestia_athena:19009
      - SERVICE_TOPOLOGY_TAGS=layer:cognition,domain:strategy,status:beta
      - ATHENA_ORACLE_HINT_ROUTE=api/athena/hints
      - PYTHONUNBUFFERED=1
    networks:
      - hestia_net

networks:
  hestia_net:
    external: true
