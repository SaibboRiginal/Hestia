# Standalone run (the global stack is docker-compose.global.yml at repo root).
services:
  hestia_metis:
    build:
      context: ..
      dockerfile: Hestia-Metis/Dockerfile
    container_name: hestia_metis
    ports:
      - "${METIS_PORT:-19014}:19014"
    environment:
      # Tunables (dataset cap/dedup/labels, log level) are central settings (Themis → WebUI Impostazioni);
      # the training window is an agenda window (Chronos). Env = infrastructure only.
      - SERVICE_NAME=metis
      - SERVICE_BASE_URL=http://hestia_metis:19014
      - SERVICE_VERSION=1.0.0
      - SERVICE_TYPE=core
      - SERVICE_TAGS=core,improvement
      - SERVICE_TOPOLOGY_TAGS=layer:cognition,domain:improvement,status:alpha
      - HUB_API_URL=http://hestia_hub:19001/api
      - LOG_LEVEL=INFO          # boot level only; then setting metis.log.level wins
      - METIS_DATA_DIR=/code/data
    volumes:
      - ./data:/code/data
    networks:
      - hestia_net
    restart: unless-stopped

networks:
  hestia_net:
    external: true
