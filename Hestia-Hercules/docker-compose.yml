# Standalone run (the global stack is docker-compose.global.yml at repo root).
services:
  hestia_hercules:
    build:
      context: ..
      dockerfile: Hestia-Hercules/Dockerfile
    container_name: hestia_hercules
    ports:
      - "${HERCULES_PORT:-19019}:19019"
    environment:
      - SERVICE_NAME=hercules
      - SERVICE_BASE_URL=http://hestia_hercules:19019
      - HUB_API_URL=http://hestia_hub:19001/api
      - TZ=${TZ:-Europe/Rome}
    networks:
      - hestia_net
    restart: unless-stopped

networks:
  hestia_net:
    external: true
