services:
  hecate:
    build: .
    container_name: hestia_hecate
    restart: always
    environment:
      - PYTHONUNBUFFERED=1               # flush stdout/stderr immediately (required for Docker log streaming)
      - TZ=Europe/Rome                   # Timezone — must match OAuth token issuance context
      - HUB_API_URL=http://hestia_hub:19001/api          # Hub base URL for routing and service registration
      - HECATE_SERVICE_BASE_URL=http://hestia_hecate:19003  # Hecate service URL advertised to Hub
      - HECATE_SERVICE_VERSION=1.0.0                        # Reported version in Hub registry
      - LOG_LEVEL=INFO                                      # Boot log level; runtime level = central setting hecate.log.level
      # Tunables (calendar backfill, Archive timeouts, auth re-check, notify cooldown) are central
      # settings (Themis, keys hecate.*) — not env vars.
    ports:
      - "19003:19003"  # Hecate API port
    env_file:
      - ./app/.env
    volumes:
      - ./data:/code/data
      - /etc/localtime:/etc/localtime:ro   # Sync container clock with Docker host (critical for OAuth token refresh)
    networks:
      - hestia_net

networks:
  hestia_net:
    external: true