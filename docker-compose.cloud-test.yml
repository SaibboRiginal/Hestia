# Cloud test bench override — use ONLY with tools/cloud_test.py (Claude cloud session, GitHub Codespaces).
#   python tools/cloud_test.py up      → docker compose -f docker-compose.global.yml -f docker-compose.cloud-test.yml …
# The normal local run (up-all.bat) never reads this file. Dossier: docs/work/2026-10-19-banco-prova-cloud/
#
# - fake_llm: deterministic stand-in for Ollama (no GPU in the cloud); every answer starts with "[LLM finto]".
#   With GEMINI_API_KEY in the environment the script points Oracle's chat use cases at a Gemini chain instead.
# - Oracle: Ollama URL → fake_llm, Claude Code CLI not installed (no subscription token in a test bench).

services:
  fake_llm:
    image: python:3.12-slim
    container_name: hestia_fake_llm
    restart: unless-stopped
    command: ["python", "/fake/fake_ollama.py"]
    environment:
      - FAKE_LLM_PORT=11434
      - ORACLE_EMBED_DIM=${ORACLE_EMBED_DIM:-768}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./tools/cloud_test:/fake:ro
    networks:
      - hestia_net

  oracle:
    build:
      args:
        INSTALL_CLAUDE_CODE: "0"
    environment:
      - OLLAMA_URL=http://hestia_fake_llm:11434/api/generate
      - ORACLE_KEY_GEMINI=${GEMINI_API_KEY:-}   # provider «gemini» key (Oracle a blocchi)
    depends_on:
      fake_llm:
        condition: service_started

  # Test credentials come from the environment (Codespaces secrets), never from the repo. Empty = not used:
  # without TELEGRAM_BOT_TOKEN the script does not start Telegram; without GOOGLE_CLIENT_ID Google stays off.
  telegram:
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}   # a TEST bot from @BotFather
      - ALLOWED_USER_ID=${ALLOWED_USER_ID:-}         # your numeric Telegram id (who the test bot answers)

  hecate:
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}           # temporary Google OAuth client, type "Desktop app"
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - HECATE_ENABLE_PROVIDER_GOOGLE=${HESTIA_BENCH_GOOGLE:-false}   # set by tools/cloud_test.py when the id is there
