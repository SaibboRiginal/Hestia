        - url: http://localhost:19003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, source]
              properties:
                domain:
                  type: string
                  example: real_estate
                source:
                  type: string
                  example: immobiliare_it
                filter_query:
                  type: string
      responses:
        "200":
          description: "{status, fetched}"

  /api/ingest/calendar/trigger:
    post:
