  # ══════════════════════════════════════════════════════════════════════════
  #  MCP — 19013  (docs/work/2026-10-18-moduli-core-e-mcp-esterno §B2)
  # ══════════════════════════════════════════════════════════════════════════

  /mcp:
    post:
      tags: [MCP]
      summary: MCP over Streamable HTTP (JSON answers) — initialize · tools/list · tools/call · ping
      description: |
        JSON-RPC 2.0, one message or a batch. Notifications (no id) → 202. Internal clients call it through Hub
        (`POST /api/route/mcp/mcp`) and name themselves with header `X-Hestia-Client` (oracle, telegram, webui).
        Hestia details travel in `_meta.hestia`:
        - tools/list → each tool has `name, title, description, inputSchema, annotations.readOnlyHint` and
          `_meta.hestia {service, method, path, response_mode, response_prompt, clients, telegram_*…}`;
          `params._meta.hestia.services` narrows the list. A client sees tools whose `clients` is empty, `*` or its own.
        - tools/call → `params {name, arguments, _meta.hestia {session_id, notify_target, trace_id, client, service,
          timeout_seconds}}`; answer `{content: [{type: text}], structuredContent, isError, _meta.hestia {status_code,
          service, wrapped}}` (`wrapped` = a non-object module answer is in `structuredContent.result`).
          `_meta.hestia.client` is forwarded to the module as `X-Hestia-Client` (the client the user talks from).

        **Public door for external AIs** (server 19015 = WebUI, the only service behind the tunnel): the same path
        `POST /mcp` on the WebUI needs `Authorization: Bearer <token>` (an access from *Accessi AI*) and is forwarded
        through Hub to `/mcp/external` below; no WebUI login there, always a token. GET/DELETE → 405.
      servers:
        - url: http://localhost:19013
        - url: http://localhost:19015
          description: WebUI public door (external AIs, bearer token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc: {type: string, enum: ["2.0"]}
                id: {oneOf: [{type: string}, {type: integer}]}
                method: {type: string, enum: [initialize, tools/list, tools/call, ping]}
                params: {type: object}
      responses:
        "200":
          description: JSON-RPC result or error (-32600 invalid, -32601 unknown method, -32602 unknown tool)
        "202":
          description: Notification accepted
    get:
      tags: [MCP]
      summary: No server stream (405, Allow POST)
      servers:
        - url: http://localhost:19013
      responses:
        "405":
          description: Not supported

  /mcp/external:
    post:
      tags: [MCP]
      summary: The same MCP for external AIs, behind an access token (reached only through the WebUI door)
      description: |
        Only tools whose module wrote `"external"` in `clients`, limited by the access (scope, tool list). Towards the
        module the call carries only `X-Hestia-Access: <access name>`. Every call logged `event=mcp_external_call`;
        a write leaves a silent Hermes inbox entry. Rate limit: Themis `mcp.external.max_calls_per_min` per access.
      servers:
        - url: http://localhost:19013
      parameters:
        - {name: Authorization, in: header, required: true, schema: {type: string, example: "Bearer hst_…"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: "JSON-RPC 2.0 message or batch, as /mcp"}
      responses:
        "200": {description: JSON-RPC result or error}
        "202": {description: Notification accepted}
        "401": {description: "Wrong, revoked or expired token (WWW-Authenticate: Bearer error=\"invalid_token\", resource_metadata=\"<base>/.well-known/oauth-protected-resource/mcp\")"}
        "403": {description: A read-only access called a write tool}
        "429": {description: "Over the per-minute limit (Retry-After: 60)"}

  /api/mcp/ui/tools:
    get:
      tags: [MCP]
      summary: Comandi page — the tools the WebUI sees (same list as /mcp tools/list for client webui), as commands
      servers:
        - url: http://localhost:19013
      responses:
        "200": {description: "{commands: [{command, title, description, service, method, path, response_mode, response_prompt, writes, arguments_schema (JSON schema)}], count, services}"}

  /api/mcp/ui/tools/call:
    post:
      tags: [MCP]
      summary: Comandi page — run one tool as client webui (same rules as /mcp tools/call, X-Hestia-Client webui, 20 s)
      servers:
        - url: http://localhost:19013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command: {type: string}
                args: {type: object, additionalProperties: true}
      responses:
        "200": {description: "{ok, result, error?, status_code, response_mode}"}
        "400": {description: Missing command}
        "404": {description: Unknown tool or not visible to the WebUI}

  /api/mcp/ui/tools/format:
    post:
      tags: [MCP]
      summary: Comandi page — readable text of a tool result (Oracle /api/format via Hub, plain text)
      servers:
        - url: http://localhost:19013
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command: {type: string}
                result: {description: Raw result of the call}
                response_prompt: {type: string}
      responses:
        "200": {description: "{ok, text} (ok=false, text='' when Oracle cannot format)"}

  /api/mcp/accesses:
    get:
      tags: [MCP]
      summary: External AI accesses (Accessi AI page) — never tokens or hashes
      servers:
        - url: http://localhost:19013
      responses:
        "200": {description: "{accesses[{access_id, name, kind, scope, tools, expires_at, revoked_at, last_used_at, calls_today, calls_total, created_at}]}"}
    post:
      tags: [MCP]
      summary: New access; the token is in this answer only (stored as sha256)
      servers:
        - url: http://localhost:19013
      parameters:
        - {name: base_url, in: query, required: false, schema: {type: string}, description: "address for the ready setup lines (e.g. the tunnel URL)"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, example: Claude Code PC}
                scope: {type: string, enum: [read, write], default: read}
                tools: {type: array, items: {type: string}, description: "[] = every tool open to external AIs"}
                expires_days: {type: integer, default: 90, description: "0 / null = no expiry"}
      responses:
        "200": {description: "{access, token, setup{url, header, claude_code, json}}"}
        "400": {description: Missing name or unknown scope}

  /api/mcp/accesses/tools:
    get:
      tags: [MCP]
      summary: Tools open to external AIs (what an access can be limited to)
      servers:
        - url: http://localhost:19013
      responses:
        "200": {description: "{tools[{name, title, description, service, writes}]}"}

  /api/mcp/accesses/{access_id}:
    patch:
      tags: [MCP]
      summary: Change name, scope, tools, expiry (expires_days 0 = never)
      servers:
        - url: http://localhost:19013
      parameters:
        - {name: access_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{access}"}
        "404": {description: Access not found}
    delete:
      tags: [MCP]
      summary: Remove an access
      servers:
        - url: http://localhost:19013
      parameters:
        - {name: access_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status: deleted|absent}"}

  /api/mcp/accesses/{access_id}/revoke:
    post:
      tags: [MCP]
      summary: Stop an access at once
      servers:
        - url: http://localhost:19013
      parameters:
        - {name: access_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{access}"}

  /api/mcp/accesses/{access_id}/renew:
    post:
      tags: [MCP]
      summary: New token for the access (the old one stops at once; a revoked access comes back)
      servers:
        - url: http://localhost:19013
      parameters:
        - {name: access_id, in: path, required: true, schema: {type: string}}
        - {name: base_url, in: query, required: false, schema: {type: string}}
      responses:
        "200": {description: "{access, token, setup}"}

  /api/mcp/outbound:
    get:
      tags: [MCP]
      summary: Servizi esterni — third-party MCP servers Hestia may use (from Hecate; names and status only)
      servers:
        - url: http://localhost:19013
      responses:
        "200": {description: "{servers: [{name, host, auth: key|none, status: configured|invalid_url}], how_to}"}
        "503": {description: Hecate unreachable}

  /.well-known/oauth-protected-resource/mcp:
    get:
      tags: [MCP]
      summary: OAuth protected resource metadata (RFC 9728); also without /mcp. Public via the WebUI door
      description: Base address = header `X-Hestia-Public-Base` (set by the WebUI for a tunnel or local host), else http://localhost:19015.
      servers:
        - url: http://localhost:19013
      responses:
        "200": {description: "{resource: <base>/mcp, authorization_servers: [<base>], scopes_supported: [read, write]}"}

  /.well-known/oauth-authorization-server:
    get:
      tags: [MCP]
      summary: OAuth authorization server metadata (RFC 8414) — issuer, endpoints, S256 only, grants code + refresh
      servers:
        - url: http://localhost:19013
      responses:
        "200": {description: Metadata}

  /oauth/register:
    post:
      tags: [MCP]
      summary: Dynamic client registration (RFC 7591) — redirect URIs https or http on loopback; 10 per minute
      servers:
        - url: http://localhost:19013
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, properties: {client_name: {type: string}, redirect_uris: {type: array, items: {type: string}},
                     token_endpoint_auth_method: {type: string, enum: [none, client_secret_post, client_secret_basic]}}}
      responses:
        "201": {description: "{client_id: hmc_…, client_secret? (shown once), redirect_uris, …}"}
        "400": {description: "{error: invalid_redirect_uri | invalid_client_metadata}"}
        "429": {description: Too many registrations}

  /oauth/authorize:
    get:
      tags: [MCP]
      summary: Check client, exact redirect_uri and PKCE S256, then park the request for the consent card (no code here)
      servers:
        - url: http://localhost:19013
      parameters:
        - {name: response_type, in: query, required: true, schema: {type: string, enum: [code]}}
        - {name: client_id, in: query, required: true, schema: {type: string}}
        - {name: redirect_uri, in: query, required: false, schema: {type: string}}
        - {name: code_challenge, in: query, required: true, schema: {type: string}}
        - {name: code_challenge_method, in: query, required: true, schema: {type: string, enum: [S256]}}
        - {name: state, in: query, required: false, schema: {type: string}}
        - {name: scope, in: query, required: false, schema: {type: string, example: "read write"}}
      responses:
        "200": {description: "{status: consent, request_id} or {status: error, error, error_description, redirect?} (no redirect for an unknown client or redirect_uri)"}

  /oauth/token:
    post:
      tags: [MCP]
      summary: Token endpoint — authorization_code (PKCE, single-use code) and refresh_token (rotated on every use)
      description: Form-encoded or JSON. A replayed code or old refresh token revokes the access. Access tokens `hso_…` last Themis `mcp.oauth.access_token_minutes`.
      servers:
        - url: http://localhost:19013
      responses:
        "200": {description: "{access_token: hso_…, token_type: Bearer, expires_in, refresh_token: hsr_…, scope}"}
        "400": {description: "{error: invalid_grant | unsupported_grant_type | invalid_request}"}
        "401": {description: "{error: invalid_client}"}

  /oauth/revoke:
    post:
      tags: [MCP]
      summary: Revoke (RFC 7009) — either token of a grant stops the whole access; unknown tokens are not an error
      servers:
        - url: http://localhost:19013
      responses:
        "200": {description: "{}"}

  /api/mcp/oauth/requests/{request_id}:
    get:
      tags: [MCP]
      summary: Consent card (WebUI, behind login) — who asks, redirect host, requested scope, tools open to external AIs
      servers:
        - url: http://localhost:19013
      parameters:
        - {name: request_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{request_id, client_name, redirect_host, scope, expires_in, tools[]}"}
        "404": {description: Expired (15 min) or already used}

  /api/mcp/oauth/requests/{request_id}/approve:
    post:
      tags: [MCP]
      summary: Consenti — issue the code with the scope, tools and expiry picked on the card
      servers:
        - url: http://localhost:19013
      parameters:
        - {name: request_id, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {scope: {type: string, enum: [read, write]}, tools: {type: array, items: {type: string}},
                     expires_days: {type: integer, nullable: true}, name: {type: string}}}
      responses:
        "200": {description: "{redirect} — the client's redirect_uri with code, state, iss"}

  /api/mcp/oauth/requests/{request_id}/deny:
    post:
      tags: [MCP]
      summary: Rifiuta — redirect with error=access_denied
      servers:
        - url: http://localhost:19013
      parameters:
        - {name: request_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{redirect}"}

  /api/mcp/oauth/clients:
    get:
      tags: [MCP]
      summary: Registered OAuth clients (no secrets)
      servers:
        - url: http://localhost:19013
      responses:
        "200": {description: "{clients[]}"}

  # ══════════════════════════════════════════════════════════════════════════
  #  ARGUS — 19008
  # ══════════════════════════════════════════════════════════════════════════

  /argus/health:
    get:
      tags: [Argus]
      summary: Argus health check
      servers:
        - url: http://localhost:19008
      responses:
        "200":
          description: OK

  /api/argus/status:
    get:
      tags: [Argus]
      summary: Health status of all monitored services
      servers:
        - url: http://localhost:19008
      responses:
        "200":
          description: "{healthy_count, unhealthy_count, services: {name: {status, ...}}}"

  /api/argus/logs:
    get:
      tags: [Argus]
      summary: Query collected service logs
      servers:
        - url: http://localhost:19008
      parameters:
        - name: service
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
            default: WARNING
        - name: since
          in: query
          schema:
            type: string
            default: 30m
          description: "e.g. '30m', '2h', '1d'"
      responses:
        "200":
          description: "{count, filters{}, events[]}"

  /api/argus/analyze:
    post:
      tags: [Argus]
      summary: Run an LLM system analysis across all monitored logs
      servers:
        - url: http://localhost:19008
      responses:
        "200":
          description: "SystemReport: {status, summary (LLM text), events[], ...}"

  /api/argus/recheck/{service}:
    post:
      tags: [Argus]
      summary: Repair follow-up for an unhealthy service (agenda task argus.repair.<service>)
      servers:
        - url: http://localhost:19008
      parameters:
        - name: service
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "{status, service, health, message, remediation_requested, next_attempt}"

  /api/argus/overview:
    get:
      tags: [Argus]
      summary: Last monitor cycle in one look (no network) — widget Stato sistema
      servers:
        - url: http://localhost:19008
      responses:
        "200": {description: "{last_cycle_at, last_cycle_ms, cycles, total, healthy, unhealthy, unhealthy_services: [{service, status, error}], open_incidents}"}

  /api/argus/history:
    get:
      tags: [Argus]
      summary: Health per service over time (in memory since Argus started, 24 h kept)
      servers:
        - url: http://localhost:19008
      parameters:
        - name: minutes
          in: query
          schema: {type: integer, default: 360, minimum: 5, maximum: 1440}
        - name: buckets
          in: query
          schema: {type: integer, default: 60, minimum: 1, maximum: 240}
      responses:
        "200": {description: "{minutes, buckets, bucket_seconds, from, to, last_cycle_at, last_cycle_ms, services: {name: {status, error, checked_at, strip ('u' up, 'w' degraded, 'd' down, '-' no data per bucket), uptime_pct, incident_open}}}"}
        "422": {description: Parameter out of range}

  /api/argus/incidents:
    get:
      tags: [Argus]
      summary: Open and recently closed incidents with what Argus did
      servers:
        - url: http://localhost:19008
      parameters:
        - name: limit
          in: query
          schema: {type: integer, default: 20, minimum: 0, maximum: 50}
      responses:
        "200": {description: "{open: [Incident], recent: [Incident], open_count}; Incident = {id, service, status, error, opened_at, closed_at, duration_seconds, actions: [{at, kind: detected|status|alert|remediation|recheck_planned|recheck|recovered, ok, text}]}"}

  /api/argus/recheck-targets:
    get:
      tags: [Argus]
      summary: Quick-action chips «Ricontrolla <servizio>» (services that are not up)
      servers:
        - url: http://localhost:19008
      responses:
        "200": {description: "{items: [{id, label, icon, state, hint}]}"}

  /argus/api/ui/manifest:
    get:
      tags: [Argus]
      summary: WebUI plugin manifest (real path /api/ui/manifest; kind core, api_prefix /api/argus/)
      description: |
        Plugin contract (docs/work/2026-10-17-client-plugins/SPEC.md §4): page `salute` (argus-health, order 110),
        widget `stato` (argus-status-widget, auto), quick action `ricontrolla` (POST /api/argus/recheck/{id}, source
        /api/argus/recheck-targets). Bundle file at /ui/webui/argus.js. Read by Hub through `capabilities.ui_manifest`.
      servers:
        - url: http://localhost:19008
      responses:
        "200": {description: "{module: argus, title, icon, color, description, kind: core, clients.webui{entry, api_prefix, page[], widget[], quick_action[]}, version}"}

  /api/argus/remediate:
    post:
      tags: [Argus]
      summary: Forward remediation intent to Hephaestus through Hub routing
      servers:
        - url: http://localhost:19008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArgusRemediationRequest"
      responses:
        "200":
          description: "{status, forwarded_to, result}"

  # ══════════════════════════════════════════════════════════════════════════
  #  HEPHAESTUS — 19010
  # ══════════════════════════════════════════════════════════════════════════

  /hephaestus/health:
    get:
      tags: [Hephaestus]
      summary: Hephaestus health check
      servers:
        - url: http://localhost:19010
      responses:
        "200":
          description: OK

  /hephaestus/api/ui/manifest:
    get:
      tags: [Hephaestus]
      summary: WebUI plugin manifest (real path /api/ui/manifest; kind core, api_prefix /api/hephaestus/)
      description: |
        Plugin contract (docs/work/2026-10-17-client-plugins/SPEC.md §4): page `riparazioni` (hephaestus-repairs,
        order 170), widget `forge` (hephaestus-forge-widget, auto). Bundle file at /ui/webui/hephaestus.js
        (404 for unknown files). Read by Hub through `capabilities.ui_manifest`.
      servers:
        - url: http://localhost:19010
      responses:
        "200": {description: "{module, title, icon, color, description, kind: core, clients.webui{entry, api_prefix, page[], widget[], quick_action[]}, version}"}

  /api/hephaestus/status:
    get:
      tags: [Hephaestus]
      summary: Hephaestus runtime status
      servers:
        - url: http://localhost:19010
      responses:
        "200":
          description: "{status, mode, self_healing_preview_only, runbook_count}"

  /api/hephaestus/runbooks:
    get:
      tags: [Hephaestus]
      summary: List available Hephaestus runbooks
      servers:
        - url: http://localhost:19010
      responses:
        "200":
          description: "{status, runbooks[]}"

  /api/hephaestus/tasks:
    get:
      tags: [Hephaestus]
      summary: List remediation tasks
      servers:
        - url: http://localhost:19010
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: state
          in: query
          schema:
            type: string
            enum: [pending_approval, running, succeeded, failed, rolled_back]
      responses:
        "200":
          description: "{status, count, tasks[]}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  count:
                    type: integer
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/HephaestusTaskRecord"

  /api/hephaestus/forge/status:
    get:
      tags: [Hephaestus]
      summary: Forge status (enabled, paused, repo, base branch, engines, queue)
      servers:
        - url: http://localhost:19010
      responses:
        "200": {description: OK}

  /api/hephaestus/forge/engine:
    get:
      tags: [Hephaestus]
      summary: Default Forge engine, fallback chain, availability
      servers:
        - url: http://localhost:19010
      responses:
        "200": {description: "{status, default_engine, fallback[], engines{}}"}
    post:
      tags: [Hephaestus]
      summary: Set default Forge engine (persisted)
      servers:
        - url: http://localhost:19010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [engine]
              properties:
                engine: {type: string, enum: [oracle, claude], description: "local/cloud are read as oracle"}
      responses:
        "200": {description: "{status, default_engine, available, detail}"}
        "400": {description: Unknown engine}

  /api/hephaestus/forge/settings:
    get:
      tags: [Hephaestus]
      summary: Forge settings (default engine, fallback, permission modes)
      servers:
        - url: http://localhost:19010
      responses:
        "200": {description: OK}

  /api/hephaestus/forge/pause:
    post:
      tags: [Hephaestus]
      summary: Manual pause of autonomous development (saved as Themis hephaestus.forge.paused)
      description: >
        Paused = nothing starts on its own (module tasks are held as silent proposals, the Claude
        window scheduler starts nothing); user requests and manual approvals still run.
        Resuming restarts nothing held.
      servers:
        - url: http://localhost:19010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paused]
              properties:
                paused: {type: boolean}
                by: {type: string, default: user}
      responses:
        "200": {description: "{status, paused, held: [task ids held during the pause, still proposed]}"}
        "503": {description: Themis did not save the setting}

  /api/hephaestus/forge/settings/mode:
    post:
      tags: [Hephaestus]
      summary: Set Forge permission mode (ask | auto | full_auto) for local/cloud group (persisted)
      servers:
        - url: http://localhost:19010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: {type: string, enum: [ask, auto, full_auto]}
                group: {type: string, enum: [local, cloud, ""], description: empty = both}
      responses:
        "200": {description: Updated settings}
        "400": {description: Unknown mode or group}

  /api/hephaestus/forge/claude-budget:
    get:
      tags: [Hephaestus]
      summary: Claude Pro budget window status (phase, next reset, used tonight)
      servers:
        - url: http://localhost:19010
      responses:
        "200": {description: "{status, phase, allowed, reason, next_reset, hours_to_reset, used_tonight, schedule, blocked_until}"}

  /api/hephaestus/forge/settings/claude-schedule:
    post:
      tags: [Hephaestus]
      summary: Configure the Claude Pro budget window (persisted)
      servers:
        - url: http://localhost:19010
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reset_day: {type: string, description: mon..sun / lun..dom}
                reset_time: {type: string, description: "HH:MM"}
                tz: {type: string}
                window_hours: {type: integer}
                night: {type: string, description: "HH:MM-HH:MM"}
                night_max_tasks: {type: integer}
                final_hours: {type: integer}
      responses:
        "200": {description: Updated budget status}
        "400": {description: Invalid schedule}

  /api/hephaestus/forge/tasks:
    get:
      tags: [Hephaestus]
      summary: List Forge self-development tasks
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: state, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 20}}
      responses:
        "200": {description: "{status, count, tasks[]}"}
    post:
      tags: [Hephaestus]
      summary: Submit a self-development task (isolated branch, tests, approval)
      servers:
        - url: http://localhost:19010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request]
              properties:
                request: {type: string}
                services: {type: array, items: {type: string}}
                engine: {type: string, enum: [auto, local, cloud, claude], description: empty/auto = default + fallback}
                auto_start: {type: boolean, description: "omit = user source starts; athena/argus follow permission mode; false = proposal"}
                auto_merge: {type: boolean}
                context: {type: string}
                source: {type: string}
                requested_by: {type: string}
                notify_target: {type: string}
                workdoc: {type: string, description: "continue docs/work/<workdoc>/ of an earlier task"}
                parent_task: {type: string, description: "follow-up of this task (Sviluppo page): inherits workdoc, services and its outcome as context"}
                agenda_parent: {type: string, description: "agenda key this task serves: its mirror forge.task.<id> is linked to it (cancelling it rejects a proposed/scheduled task; a failed task marks it)"}
      responses:
        "200": {description: "{status, task}"}
        "400": {description: Invalid request}
        "404": {description: parent_task not found}
        "503": {description: Forge disabled or repo not mounted}

  /api/hephaestus/forge/tasks/brief:
    get:
      tags: [Hephaestus]
      summary: Every Forge task in one short line (chat tool forge_tasks)
      description: "Newest first: `<id6> · <state> · <services> · <request>`. The request is clipped so the whole list stays under ~1600 chars (Oracle's tool-result cap); with too many tasks the oldest closed ones are left out and counted in `omitted`."
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: state, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 50}}
      responses:
        "200": {description: "{status, total, by_state{}, tasks[] (strings), omitted?}"}

  /api/hephaestus/forge/counts:
    get:
      tags: [Hephaestus]
      summary: Forge tasks per state (Sviluppo page badge)
      description: "`review` = awaiting_review + proposed (what waits for the owner) — the WebUI plugin page badge field. Over the newest 200 tasks."
      servers:
        - url: http://localhost:19010
      responses:
        "200": {description: "{status, total, by_state{}, awaiting_review, proposed, review, running, open}"}

  /api/hephaestus/forge/tasks/export:
    get:
      tags: [Hephaestus]
      summary: «Copia per AI» — markdown of some Forge tasks for an external AI
      description: "Built from the forge_task (`/tasks/{id}/overview`) and forge_tasks (`/tasks/brief`) views: request, state, origin, error, tests, dossier path `docs/work/<workdoc>/`, notes, recent history and how to hand a fix back via MCP (`forge_task_note`, `forge_submit_branch` when the state accepts a branch). Returned only (clipboard / .md download in the Sviluppo page): nothing is written to the repo."
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: ids, in: query, required: true, description: "comma separated task ids (short ids accepted), max 50", schema: {type: string}}
      responses:
        "200": {description: "{status, count, missing[], markdown, filename}"}
        "400": {description: ids missing}
        "404": {description: none of the tasks found}

  /api/hephaestus/forge/tasks/{task_id}:
    get:
      tags: [Hephaestus]
      summary: Full Forge task record (short ids accepted)
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: OK}
        "404": {description: Not found}

  /api/hephaestus/forge/tasks/{task_id}/diff:
    get:
      tags: [Hephaestus]
      summary: Unified diff of the task (text/plain)
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: diff text}

  /api/hephaestus/forge/tasks/{task_id}/transcript:
    get:
      tags: [Hephaestus]
      summary: "Engine conversation, normalized (Sviluppo page). Live while a Claude run is going"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
        - {name: offset, in: query, schema: {type: integer, default: 0}}
        - {name: limit, in: query, schema: {type: integer, default: 500, maximum: 2000}}
      responses:
        "200": {description: "{status, task_id, state, total, offset, live, events[{i, ts, kind: user|text|thinking|tool_use|tool_result|system|result|error, text?, tool?, id?, input?, is_error?, meta?}]}"}
        "404": {description: Task not found}

  /api/hephaestus/forge/tasks/{task_id}/files:
    get:
      tags: [Hephaestus]
      summary: "Changed files + diff (live worktree incl. uncommitted, or base...commit)"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
        - {name: diff, in: query, schema: {type: boolean, default: true}}
      responses:
        "200": {description: "{status, live, base, head, files[{path, old_path?, added, deleted, binary, status: A|M|D|R|C|?}], diff, truncated, totals}"}
        "404": {description: Task not found}

  /api/hephaestus/forge/tasks/{task_id}/workdoc:
    get:
      tags: [Hephaestus]
      summary: "Dossier docs/work/<workdoc>/*.md + every other .md the task changed"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, workdoc, ref, docs[{path, name, group: dossier|changed, content}]}"}
        "404": {description: Task not found}

  /api/hephaestus/forge/tasks/{task_id}/tests:
    get:
      tags: [Hephaestus]
      summary: "Full pytest output of Forge's own test run"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, ok, ran, output, summary{passed, failed, error, skipped, failed_tests[]}}"}
        "404": {description: Task not found}

  /api/hephaestus/forge/tasks/{task_id}/logs:
    get:
      tags: [Hephaestus]
      summary: "Engine log, deploy output, error"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, engine, deploy, error, hint}"}
        "404": {description: Task not found}

  /api/hephaestus/forge/tasks/{task_id}/events:
    get:
      tags: [Hephaestus]
      summary: "State timeline"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, state, events[{ts, state, note}]}"}
        "404": {description: Task not found}

  /api/hephaestus/forge/tasks/{task_id}/retry:
    post:
      tags: [Hephaestus]
      summary: "Same request again as a new task (failed / no_changes / rejected / rolled_back)"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, task} (the new task)"}
        "404": {description: Task not found}

  /api/hephaestus/forge/tasks/{task_id}/overview:
    get:
      tags: [Hephaestus]
      summary: "Compact task + notes + last 20 state changes + submitted branch (tool forge_task)"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, task}"}
        "404": {description: Task not found}

  /api/hephaestus/forge/tasks/{task_id}/notes:
    post:
      tags: [Hephaestus]
      summary: "Analysis or hint on a task (tool forge_task_note); given to the engine when it runs or is retried"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
        - {name: X-Hestia-Access, in: header, required: false, schema: {type: string}, description: "external AI access name (set by Hestia-MCP) → note author"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string}
                by: {type: string, default: user}
      responses:
        "200": {description: "{status, task_id, notes}"}

  /api/hephaestus/forge/tasks/{task_id}/submit-branch:
    post:
      tags: [Hephaestus]
      summary: "\"Fixed on this branch\": Forge fetches it from origin, runs its tests, asks the owner (tool forge_submit_branch)"
      description: |
        Task in proposed / scheduled / failed / no_changes / awaiting_review. Auto merge is always off for it: after
        the owner's approval, merge + deploy + health check + auto rollback as usual.
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
        - {name: X-Hestia-Access, in: header, required: false, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch]
              properties:
                branch: {type: string, example: claude/fix-calendar-tz}
                summary: {type: string}
      responses:
        "200": {description: "{status, task, next}"}
        "400": {description: Invalid branch name}
        "409": {description: Task in a state that does not accept a branch}

  /api/hephaestus/repo/branches:
    get:
      tags: [Hephaestus]
      summary: "Local branches with ahead/behind vs base; forge worktree branches flagged"
      servers:
        - url: http://localhost:19010
      responses:
        "200": {description: "{status, base, current, branches[{name, sha, date, author, subject, upstream, current, base, forge_task, ahead, behind}]}"}
        "400": {description: Invalid ref or path}
        "503": {description: Repo not mounted}

  /api/hephaestus/repo/tags:
    get:
      tags: [Hephaestus]
      summary: "Tags"
      servers:
        - url: http://localhost:19010
      responses:
        "200": {description: "{status, tags[{name, sha, date, subject}]}"}
        "400": {description: Invalid ref or path}
        "503": {description: Repo not mounted}

  /api/hephaestus/repo/log:
    get:
      tags: [Hephaestus]
      summary: "Commit log (parents included for the graph)"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: ref, in: query, schema: {type: string, default: HEAD}}
        - {name: path, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 100, maximum: 500}}
        - {name: skip, in: query, schema: {type: integer, default: 0}}
        - {name: all, in: query, schema: {type: boolean, default: false}, description: all branches and tags}
      responses:
        "200": {description: "{status, commits[{sha, short, parents[], author, email, date, subject, refs[]}], has_more}"}
        "400": {description: Invalid ref or path}
        "503": {description: Repo not mounted}

  /api/hephaestus/repo/commits/{sha}:
    get:
      tags: [Hephaestus]
      summary: "Commit meta + changed files + diff (merge: vs first parent)"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: sha, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, sha, parents, author, date, subject, body, refs, files[], diff, truncated}"}
        "400": {description: Invalid ref or path}
        "503": {description: Repo not mounted}

  /api/hephaestus/repo/compare:
    get:
      tags: [Hephaestus]
      summary: "base...head: commits, files, diff"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: base, in: query, schema: {type: string}, description: default = base branch}
        - {name: head, in: query, schema: {type: string, default: HEAD}}
      responses:
        "200": {description: "{status, base, head, ahead, behind, commits[], files[], diff, truncated}"}
        "400": {description: Invalid ref or path}
        "503": {description: Repo not mounted}

  /api/hephaestus/repo/tree:
    get:
      tags: [Hephaestus]
      summary: "Directory listing at a ref"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: ref, in: query, schema: {type: string, default: HEAD}}
        - {name: path, in: query, schema: {type: string}}
      responses:
        "200": {description: "{status, ref, path, entries[{name, path, type: blob|tree|commit, sha, size, secret}]}"}
        "400": {description: Invalid ref or path}
        "503": {description: Repo not mounted}

  /api/hephaestus/repo/file:
    get:
      tags: [Hephaestus]
      summary: "File content at a ref (secret files refused with 403, binary flagged, capped)"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: ref, in: query, schema: {type: string, default: HEAD}}
        - {name: path, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, ref, path, size, binary, content, truncated}"}
        "400": {description: Invalid ref or path}
        "503": {description: Repo not mounted}

  /api/hephaestus/repo/dossiers:
    get:
      tags: [Hephaestus]
      summary: "docs/work dossiers with SPEC header (title, version, status, source) and PROGRESS counts"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: ref, in: query, schema: {type: string, default: HEAD}}
      responses:
        "200": {description: "{status, ref, dossiers[{name, path, title, version, status, source, progress{done, total}}]}"}
        "400": {description: Invalid ref or path}
        "503": {description: Repo not mounted}

  /api/hephaestus/repo/dossiers/{name}:
    get:
      tags: [Hephaestus]
      summary: "One dossier: SPEC, PROGRESS, CHANGELOG of docs/work/<name>/ (tool forge_dossier)"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: ref, in: query, schema: {type: string, default: HEAD}}
      responses:
        "200": {description: "{status, ref, name, path, title, version, status, source, files{SPEC.md|PROGRESS.md|CHANGELOG.md: {text, truncated}}}"}
        "404": {description: Dossier not found}

  /api/hephaestus/forge/tasks/{task_id}/approve:
    post:
      tags: [Hephaestus]
      summary: "proposed → start; awaiting_review → merge/deploy (async)"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                by: {type: string, default: user}
                now: {type: boolean, description: skip the Claude budget window}
                engine: {type: string, enum: [oracle, claude, ""], description: "proposed/scheduled: who develops it (explicit choice starts now); empty = as proposed"}
      responses:
        "200": {description: "{status, task}"}
        "400": {description: Unknown engine}
        "409": {description: Repo not on base branch or dirty}

  /api/hephaestus/forge/tasks/{task_id}/reject:
    post:
      tags: [Hephaestus]
      summary: Discard a proposed/awaiting_review task
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, task}"}

  /api/hephaestus/forge/tasks/{task_id}/rollback:
    post:
      tags: [Hephaestus]
      summary: Revert a merged Forge change (git revert -m 1)
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, task}"}

  /metis/api/ui/manifest:
    get:
      tags: [Metis]
      summary: WebUI plugin manifest (real path /api/ui/manifest; kind core, api_prefix /api/metis/)
      description: |
        Plugin contract (docs/work/2026-10-17-client-plugins/SPEC.md §4): page `miglioramento` (metis-improvement,
        order 180), no widgets. Bundle file at /ui/webui/metis.js (404 for unknown files).
      servers:
        - url: http://localhost:19014
      responses:
        "200": {description: "{module, title, icon, color, description, kind: core, clients.webui{entry, api_prefix, page[], widget[], quick_action[]}, version}"}

  /api/metis/lora/jobs:
    get:
      tags: [Metis]
      summary: LoRA training jobs (scheduled in the agenda window metis.training, running, finished)
      servers:
        - url: http://localhost:19014
      responses:
        "200":
          description: "{status, window, count, jobs[{job_id, status, dataset_name, start_at, agenda_key, pid, log}]}"

  /api/metis/insights:
    get:
      tags: [Metis]
      summary: Weak spots from graded feedback
      servers:
        - url: http://localhost:19014
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 500}}
        - {name: since, in: query, schema: {type: string}}
      responses:
        "200": {description: "{status, total_feedback, bad_feedback, bad_ratio, weak_domains[]}"}

  /api/settings/register:
    post:
      tags: [Themis]
      summary: A module declares its settings (hestia_common.settings_client); answer = its stored system values
      servers:
        - url: http://localhost:19016
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [owner, definitions]
              properties:
                owner: {type: string, example: argus}
                definitions:
                  type: array
                  description: "setting(): {key, label, type: enum|bool|int|float|string|text|model|time|duration|list|object, default, group, help, options[{value,label}], min, max, unit, apply: live|restart, scope: system|user, depends_on, oracle: propose|read|none, advanced, order, options_source, fields}"
                  items: {type: object}
                presets:
                  type: array
                  items: {type: object, description: "{id, label, group, values{key: value}, help}"}
                effective: {type: object, description: values the module is using now}
                follows:
                  type: array
                  items: {type: string}
                  description: "other owners' keys the module reads (personal settings themis.personal.*); their changes are pushed to it"
      responses:
        "200": {description: "{owner, values{key: value}, shared{followed key: value}, revision}"}
        "503": {description: Archive unreachable (module keeps defaults and retries)}

  /api/settings/revision:
    get:
      tags: [Themis]
      summary: Change marker — clients refetch when it differs
      servers:
        - url: http://localhost:19016
      responses:
        "200": {description: "{revision}"}

  /api/settings/modules:
    get:
      tags: [Themis]
      summary: Modules with settings + live state from Hub (health, version, pending proposals) for the panel
      servers:
        - url: http://localhost:19016
      responses:
        "200": {description: "{revision, modules[{module, definitions, groups[], health, version, pending_proposals}], other_services[]}"}

  /api/settings:
    get:
      tags: [Themis]
      summary: Settings with value, source (default|stored|profile|client|session) and status (ok|restart_required|offline)
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: module, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}, description: "search in label, help, key, group, module, option labels"}
        - {name: client, in: query, schema: {type: string}, description: "webui | telegram (user-scope resolution)"}
        - {name: session, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: boolean, default: true}, description: "ask modules their effective values"}
      responses:
        "200": {description: "{revision, items[definition + value, source, status, updated_by, updated_at], presets[{module, group, active (preset id | custom), presets[]}]}"}

  /api/settings/search:
    get:
      tags: [Themis]
      summary: Compact search (assistant tool settings_search)
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: query, in: query, schema: {type: string}}
        - {name: module, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 15}}
      responses:
        "200": {description: "{count, settings[{key, label, module, group, value, default, help, assistant}]}"}

  /api/settings/key/{key}:
    get:
      tags: [Themis]
      summary: One setting (assistant tool settings_get)
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
        - {name: client, in: query, schema: {type: string}}
        - {name: session, in: query, schema: {type: string}}
      responses:
        "200": {description: definition + value, source, status}
        "404": {description: unknown setting}
    put:
      tags: [Themis]
      summary: Change a setting (user/clients only — the assistant must propose)
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value: {description: new value (validated against the definition)}
                scope: {type: string, enum: [system, profile, client, session]}
                scope_id: {type: string, description: "client name or session id"}
                actor: {type: string, default: user}
                reason: {type: string}
      responses:
        "200": {description: "{key, scope, scope_id, value, revision} — live settings applied at once, restart ones flagged"}
        "403": {description: actor is the assistant}
        "422": {description: invalid value (Italian message)}
    delete:
      tags: [Themis]
      summary: Reset to default
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
        - {name: scope, in: query, schema: {type: string}}
        - {name: scope_id, in: query, schema: {type: string}}
      responses:
        "200": {description: "{key, scope, value (default), revision}"}

  /api/settings/key/{key}/options:
    get:
      tags: [Themis]
      summary: Choices for a setting (static options, or fetched from the owning module's options_source)
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
        - {name: client, in: query, schema: {type: string}}
        - {name: session, in: query, schema: {type: string}}
      responses:
        "200": {description: "{key, source: static|module|none|offline|error, options: [{value, label}]}"}

  /api/settings/key/{key}/history:
    get:
      tags: [Themis]
      summary: Last changes (max 10)
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{key, history[{old_value, new_value, actor, reason, created_at}]}"}

  /api/settings/history:
    get:
      tags: [Themis]
      summary: Every setting change, all keys, newest first, paged (WebUI plugin page Registro)
      description: |
        Reads the newest 500 changes from Archive (which keeps the last 10 per key). `undoable` = latest change of its
        key/scope (what POST /api/settings/key/{key}/undo restores). Session copies are hidden unless `sessions=true`.
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 50, maximum: 200}}
        - {name: offset, in: query, schema: {type: integer, default: 0}}
        - {name: module, in: query, schema: {type: string}}
        - {name: actor, in: query, schema: {type: string}, description: "comma list (user, webui, telegram, oracle, athena, external = any external:<name>)"}
        - {name: key, in: query, schema: {type: string}}
        - {name: sessions, in: query, schema: {type: boolean, default: false}}
      responses:
        "200": {description: "{items[{id, key, scope, scope_id, old_value, new_value, actor, reason, created_at, label, module, type, kind: change|undo|reset|approved|preset, latest, undoable}], total, offset, next_offset, scanned, keep_per_key}"}

  /themis/api/ui/manifest:
    get:
      tags: [Themis]
      summary: WebUI plugin manifest (real path /api/ui/manifest; kind core, api_prefix /api/settings/)
      description: Page `registro` (themis-log, order 160), no widget. Bundle file at /ui/webui/themis.js.
      servers:
        - url: http://localhost:19016
      responses:
        "200": {description: "{module: themis, title, icon, color, description, kind: core, clients.webui{entry, api_prefix, page[], widget[], quick_action[]}, version}"}

  /api/settings/key/{key}/undo:
    post:
      tags: [Themis]
      summary: Restore the value before the last change (user)
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: like PUT}

  /api/settings/key/{key}/undo-propose:
    post:
      tags: [Themis]
      summary: Assistant undo — proposes the previous value (assistant tool settings_undo)
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: like POST /api/settings/proposals}

  /api/settings/presets/{module}/{preset_id}/apply:
    post:
      tags: [Themis]
      summary: Apply a preset (writes its values; editing one later makes the group "custom")
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: module, in: path, required: true, schema: {type: string}}
        - {name: preset_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{module, preset, applied{}, revision}"}

  /api/settings/sessions/{session}/init:
    post:
      tags: [Themis]
      summary: New chat session starts from the profile (+client) defaults
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: session, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {client: {type: string}}}
      responses:
        "200": {description: "{session, copied[], revision}"}

  /api/settings/proposals:
    get:
      tags: [Themis]
      summary: Proposals (default pending; expired ones closed lazily)
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: status, in: query, schema: {type: string, default: pending}, description: "pending | approved | rejected | expired | all (or empty)"}
      responses:
        "200": {description: "{proposals[]}"}
    post:
      tags: [Themis]
      summary: Assistant proposes a change (assistant tool settings_propose; Athena in autonomy) — never applied without the user
      description: Themis stores it as pending and sends it to the user through Hermes (service.action_required, payload kind settings.proposal, _message, _actions Approva/Rifiuta with service/method/path). Born in a chat (X-Session-Id + X-Hestia-Client, or body origin) → the answer adds `confirm` (card for that chat, Oracle emits it as a question) and the Hermes copy is quiet (inbox only).
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: X-Session-Id, in: header, required: false, schema: {type: string}}
        - {name: X-Hestia-Client, in: header, required: false, schema: {type: string}, description: "client of the chat (webui, telegram)"}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key: {type: string}
                value: {}
                reason: {type: string}
                proposer: {type: string, enum: [oracle, athena]}
                origin: {type: object, description: "{client, session_id} — same as the two headers"}
      responses:
        "200": {description: "{status: pending|already_pending|unchanged, proposal_id, key, value, current, label, confirm?: {question_id, header, prompt, options, actions}}"}
        "403": {description: setting reserved to the user}

  /api/settings/proposals/{proposal_id}/approve:
    post:
      tags: [Themis]
      summary: User approves (from any client) — first answer wins
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: proposal_id, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {by: {type: string, description: client}}}
      responses:
        "200": {description: "{status: approved, proposal_id, key, value, revision}"}
        "409": {description: "{status: already_decided, decision}"}

  /api/settings/proposals/{proposal_id}/reject:
    post:
      tags: [Themis]
      summary: User rejects — first answer wins
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: proposal_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status: rejected, proposal_id}"}
        "409": {description: "{status: already_decided, decision}"}

  /api/settings/effective:
    get:
      tags: [Meta]
      summary: (every module with settings, hestia_common; also WebUI, internal network only) values the module is really using
      responses:
        "200": {description: "{owner, loaded, values{}, shared{} (followed personal values), pending_restart[]}"}

  /api/settings/reload:
    post:
      tags: [Meta]
      summary: (every module with settings) Themis pushes stored values; live ones apply at once
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {values: {type: object}, shared: {type: object, description: "followed themis.personal.* values"}}}
      responses:
        "200": {description: "{owner, applied[], pending_restart[]}"}

  # Export and import (hestia_common.transfer, docs/work/2026-10-20-import-export): every module that advertises the
  # `transfer` capability (Hercules, Hygieia, Wardrobe, Plutus, Scout, Oracle memories, Chronos agenda, Themis settings).
  # Never secrets, tokens, chats or sessions. Errors: 400 {detail} bad mode/section/format, 404 unknown file.
  /api/transfer/describe:
    get:
      tags: [Meta]
      summary: (every module with transfer) sections {id, label, icon, help, count, depends_on, has_files, schema}
      responses:
        "200": {description: "{module, format, sections[]}"}

  /api/transfer/items:
    post:
      tags: [Meta]
      summary: (every module with transfer) items of one section for the picker
      requestBody:
        content:
          application/json:
            schema: {type: object, required: [section], properties: {section: {type: string}, q: {type: string}, limit: {type: integer, default: 200}, offset: {type: integer, default: 0}}}
      responses:
        "200": {description: "{items[{key, title, subtitle, updated_at}], total}"}

  /api/transfer/export:
    post:
      tags: [Meta]
      summary: (every module with transfer) export the chosen sections; dependencies and children are pulled in
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sections: {type: object, nullable: true, description: "{section: {keys?: [..]}}; null = every section"}
                since: {type: string, nullable: true, description: "ISO date: only records changed since (deletions included)"}
                include_files: {type: boolean, default: false}
      responses:
        "200": {description: "{module, format, exported_at, since, sections{id: {schema, label, partial, records[]}}, pulled{section: [keys]}, files[blob ids]}"}

  /api/transfer/files/{blob_id}:
    get:
      tags: [Meta]
      summary: (every module with transfer) one of the module's own files as base64 (blobs of other modules → 404)
      parameters:
        - {name: blob_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{id, mime, sha256, meta, data_b64}"}

  /api/transfer/files:
    post:
      tags: [Meta]
      summary: (every module with transfer) store a file from an export before the import; returns the id map entry
      requestBody:
        content:
          application/json:
            schema: {type: object, required: [id, data_b64], properties: {id: {type: string}, mime: {type: string}, meta: {type: object}, data_b64: {type: string}}}
      responses:
        "200": {description: "{old_id, new_id}"}

  /api/transfer/import:
    post:
      tags: [Meta]
      summary: (every module with transfer) preview (dry_run, default) or import a module export
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: {type: object, description: "the module's block of the .hestia file"}
                mode: {type: string, enum: [append, merge, replace], default: merge}
                modes: {type: object, description: "per-section mode override"}
                dry_run: {type: boolean, default: true}
                sections: {type: object, nullable: true, description: "{section: {keys?: [..]}}; null = everything in the file"}
                files_map: {type: object, description: "old blob id → new blob id from POST /api/transfer/files"}
      responses:
        "200": {description: "{module, dry_run, sections{id: {mode, added, updated, unchanged, skipped, deleted, problems, related, partial, items{added[], updated[], skipped[], deleted[], problems[]}}}, totals{}}"}

  /api/settings-store/values:
    get:
      tags: [Archive — Settings store]
      summary: Stored values (filters key, prefix, scope, scope_id)
      servers:
        - url: http://localhost:19002
      responses:
        "200": {description: "[{key, scope, scope_id, value, updated_by, updated_at}]"}
    put:
      tags: [Archive — Settings store]
      summary: Upsert a value and log old → new (history trimmed to history_keep)
      servers:
        - url: http://localhost:19002
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key: {type: string}
                scope: {type: string}
                scope_id: {type: string}
                value: {}
                actor: {type: string}
                reason: {type: string}
                history_keep: {type: integer, default: 10}
      responses:
        "200": {description: stored row}
    delete:
      tags: [Archive — Settings store]
      summary: Delete a value (logged as old → null)
      servers:
        - url: http://localhost:19002
      responses:
        "200": {description: "{status: deleted|absent}"}

  /api/settings-store/history:
    get:
      tags: [Archive — Settings store]
      summary: Change log (filters key, scope, scope_id, actor, limit)
      servers:
        - url: http://localhost:19002
      responses:
        "200": {description: "[{id, key, scope, scope_id, old_value, new_value, actor, reason, created_at}]"}

  /api/settings-store/proposals:
    get:
      tags: [Archive — Settings store]
      summary: Proposals (filters status, key, proposal_id)
      servers:
        - url: http://localhost:19002
      responses:
        "200": {description: list}
    post:
      tags: [Archive — Settings store]
      summary: Store a pending proposal
      servers:
        - url: http://localhost:19002
      responses:
        "200": {description: stored proposal}
        "409": {description: duplicate proposal_id}

  /api/settings-store/proposals/{proposal_id}:
    patch:
      tags: [Archive — Settings store]
      summary: Close a proposal (only_if_status makes the first answer win)
      servers:
        - url: http://localhost:19002
      parameters:
        - {name: proposal_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: updated proposal}
        "409": {description: already decided}

  /api/hercules/bootstrap:
    get:
