openapi: 3.0.3

info:
  title: Hestia — API Reference
  description: |
    Aggregated API reference for all Hestia services.
    Each path overrides the server URL to route to the correct service.

    | Service   | Port  |
    |-----------|-------|
    | Hub       | 19001 |
    | Archive   | 19002 |
    | Hecate    | 19003 |
    | Oracle    | 19004 |
    | Hermes    | 19005 |
    | Scout     | 19006 |
    | Chronos   | 19007 |
    | Argus     | 19008 |
    | Iris      | 19012 |
    | Hephaestus| 19010 |
    | Dummy     | 19011 |
    | Themis    | 19016 |
    | Hygieia   | 19018 |
    | Hercules  | 19019 |
    | Plutus    | 19020 |
  version: 1.0.0

servers:
  - url: http://localhost:19001
    description: Hub (default)

tags:
  - name: Hub
    description: Service registry and request routing
  - name: Archive — Records
    description: Raw domain records ingested from external sources
  - name: Archive — Entities
    description: Structured persistent entities (real estate listings, etc.)
  - name: Archive — Chat
    description: Conversation history
  - name: Archive — Memory
    description: User preferences and long-term memory
  - name: Archive — Subscriptions
    description: Proactive notification subscriptions
  - name: Archive — Dispatch Logs
    description: Delivery logs for dispatched notifications
  - name: Archive — Outbound Events
    description: Outbound delivery lifecycle and dedupe tracking
  - name: Archive — Feedback
    description: Quality feedback records and JSONL export
  - name: Archive — Calendar
    description: Calendar items (events, tasks, reminders)
  - name: Archive — Documents
    description: Uploaded and indexed documents with embeddings
  - name: Hecate
    description: API gateway and ingestion triggers
  - name: Oracle
    description: LLM chat, document analysis and formatting
  - name: Hermes
    description: Event-driven dispatch and direct messaging
  - name: Scout
    description: Real estate search and module tools
  - name: Chronos
    description: Calendar CRUD and agenda
  - name: MCP
    description: Hestia's one MCP server — every client (Oracle, Telegram, WebUI, external AIs) lists and runs tools here
  - name: Argus
    description: System health monitoring and log analysis
  - name: Iris
    description: Email domain — mail APIs and PUSH dispatch (modules subscribe, Hecate's watcher hands new mail, Iris delivers)
  - name: Hephaestus
    description: Guarded self-healing remediation workflows
  - name: Dummy
    description: Deterministic generic testing module
  - name: WebUI
    description: Web-based chat interface — token management and health (direct :19015, not Hub-routed)
  - name: Athena
    description: Retrospective focus-brief cognition runtime
  - name: Themis
    description: Central settings — modules declare, clients and assistant read/change, user confirms proposals
  - name: Hercules
    description: Gym coach — exercises, templates, live sessions (offline sync), records, progress, goals
  - name: Archive — Hercules store
    description: Generic (kind,id) records with last-write-wins and a sync cursor (only Hercules calls it)
  - name: Hygieia
    description: Self care — products, routines with goals (no fixed schedule), planner with active conflicts, history, stats
  - name: Archive — Self care store
    description: Generic (kind,id) records with last-write-wins and a cursor (only Hygieia calls it)
  - name: Wardrobe
    description: Wardrobe — pieces, accessories, outfits, «Cosa mi metto», «Indossato», packing lists, stats, photos
  - name: Archive — Wardrobe store
    description: Same (kind,id) last-write-wins records as the Hercules store, for Wardrobe only
  - name: Plutus
    description: Expenses (domain finance) — PayPal mails by push, bank statements (PDF), quick entry, categories that learn, budgets, recurring, stats
  - name: Archive — Finance store
    description: Same (kind,id) last-write-wins records and cursor as the other module stores, for Plutus only
  - name: Archive — Iris store
    description: Same (kind,id) last-write-wins records and cursor, for Iris only (mail subscriptions, delivery state)
  - name: Archive — MCP accesses
    description: Who may use Hestia's MCP from outside (Hestia-MCP only); tokens only as sha256
  - name: Archive — Blobs
    description: Generic byte storage for module files (photos), deduplicated per module by sha256
  - name: Archive — Settings store
    description: Generic storage of setting values, light history and proposals (only Themis calls it)
  - name: Meta
    description: Runtime log-level control (available on every FastAPI service)

# ─────────────────────────────────────────────────────────────────────────────
#  Shared components
# ─────────────────────────────────────────────────────────────────────────────
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: hestia_hub
    RegisterServiceRequest:
      type: object
      required:
        [name, base_url, health_endpoint, service_type, service_version, tags]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9_-]{2,40}$"
          example: my_service
        base_url:
          type: string
          example: http://hestia_myservice:9999
        health_endpoint:
          type: string
          example: /health
        service_type:
          type: string
          enum: [core, module, integration]
        service_version:
          type: string
          example: 1.0.0
        tags:
          type: array
          items:
            type: string
            enum:
              [
                core,
                module,
                storage,
                connector,
                chat,
                dispatch,
                real_estate,
                integration,
                messaging,
                monitoring,
              ]
        topology_tags:
          type: array
          items:
            type: string
            pattern: "^(layer|domain|status):[a-z_]+$"
        capabilities:
          type: object
          additionalProperties: true

    RouteRequest:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
        headers:
          type: object
          additionalProperties:
            type: string
        query:
          type: object
          additionalProperties: true
        body:
          type: object
          additionalProperties: true
        timeout_seconds:
          type: number
          default: 8.0

    # ── Archive ───────────────────────────────────────────────────────────────
    ArchiveRecord:
      type: object
      required: [domain, source, payload]
      properties:
        reference_id:
          type: string
        domain:
          type: string
          example: real_estate
        source:
          type: string
          example: immobiliare_it
        payload:
          type: object
          additionalProperties: true

    EntityUpsertRequest:
      type: object
      required: [entity_id, domain, payload]
      properties:
        entity_id:
          type: string
        domain:
          type: string
        status:
          type: string
          default: active
        payload:
          type: object
          additionalProperties: true
        embedding:
          type: array
          items:
            type: number

    EntitySearchRequest:
      type: object
      properties:
        domain:
          type: string
        limit:
          type: integer
          default: 50
        query_vector:
          type: array
          items:
            type: number
        filters:
          type: object
          additionalProperties: true
        filters_gt:
          type: object
          additionalProperties: true
        filters_lt:
          type: object
          additionalProperties: true
        sort_by:
          type: string
        sort_order:
          type: string
          enum: [asc, desc]

    ChatMessageRequest:
      type: object
      required: [session_id, role, content]
      properties:
        session_id:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string

    PreferenceRequest:
      type: object
      required: [fact]
      properties:
        fact:
          type: string
          example: Preferisce risposte brevi
        domain:
          type: string
          default: general
        weight:
          type: number
          default: 1.0

    SubscriptionRequest:
      type: object
      required: [subscription_id, owner, domain, event_type, filters, channels]
      properties:
        subscription_id:
          type: string
        owner:
          type: string
        domain:
          type: string
        event_type:
          type: string
        filters:
          type: object
          additionalProperties: true
        channels:
          type: array
          items:
            type: string
        is_active:
          type: boolean
          default: true

    CalendarItemRequest:
      type: object
      required: [source, kind, title, start_at]
      properties:
        external_id:
          type: string
        source:
          type: string
          example: google
        kind:
          type: string
          enum: [event, task, reminder]
        title:
          type: string
        description:
          type: string
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        all_day:
          type: boolean
          default: false
        location:
          type: string
        attendees:
          type: array
          items:
            type: object
        recurrence:
          type: string
        status:
          type: string
          default: confirmed
        html_link:
          type: string
        nag_enabled:
          type: boolean
          default: true

    DocumentRequest:
      type: object
      required: [document_id]
      properties:
        document_id:
          type: string
        session_id:
          type: string
        chat_id:
          type: string
        filename:
          type: string
        mime_type:
          type: string
        file_size_bytes:
          type: integer
        file_hash:
          type: string
        title:
          type: string
        summary:
          type: string
        extracted_text:
          type: string
        embedding:
          type: array
          items:
            type: number
        is_permanent:
          type: boolean
          default: false
        domain:
          type: string
        tags:
          type: array
          items:
            type: string
        chunks:
          type: array
          items:
            type: object
            properties:
              chunk_index:
                type: integer
              chunk_text:
                type: string
              embedding:
                type: array
                items:
                  type: number

    # ── Oracle ────────────────────────────────────────────────────────────────
    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
        session_id:
          type: string
        notify_target:
          type: string
        force_notification_compiler:
          type: boolean
          default: false
        client_instructions:
          type: string
        client:
          type: string
          description: "Client name (telegram, webui…): Oracle adds the personal chat settings oracle.chat.* (Themis, session → client → profile); a chat with client or notify_target counts as user activity for the assistant presence (ping <client>)"
        mode:
          type: string
          enum: [auto, quick, thinking, cot, ""]
          default: ""
          description: "quick = 1 call no tools · auto = classifier decides · thinking (Pensata) = always agent loop, reasoning on · cot = deep reasoning, ≥50 turns, step-by-step recap. Empty = setting oracle.chat.mode for this client/session."
        model:
          type: string
          enum: [generic, reasoning, code]
          default: generic

    FormatRequest:
      type: object
      required: [command, payload]
      properties:
        command:
          type: string
        payload:
          type: object
          additionalProperties: true
        response_prompt:
          type: string
        client_instructions:
          type: string
        client:
          type: string
          description: "Client name (telegram, webui…): Oracle adds the personal chat settings oracle.chat.* (Themis, session → client → profile)"
        thinking:
          type: boolean
          default: false
        max_length:
          type: integer
        locale:
          type: string
          default: it

    ActionApprovalResponseRequest:
      type: object
      required: [approval_token, approve]
      properties:
        approval_token:
          type: string
        approve:
          type: boolean
        actor:
          type: string
          nullable: true
        client_instructions:
          type: string
          nullable: true

    AthenaHintIngestRequest:
      type: object
      required: [summary]
      properties:
        hint_id:
          type: string
        source:
          type: string
          default: athena
        hint_type:
          type: string
          default: focus_brief
        session_id:
          type: string
          nullable: true
        domain:
          type: string
          nullable: true
        domains:
          type: array
          items:
            type: string
        priority:
          type: string
          default: normal
        summary:
          type: string
        brief:
          type: object
          additionalProperties: true
        gate:
          type: object
          additionalProperties: true
        retrospective:
          type: object
          additionalProperties: true
        ttl_seconds:
          type: integer
          nullable: true
        trace_id:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true

    AthenaCommitmentRecord:
      type: object
      properties:
        brief_id:
          type: string
        title:
          type: string
        summary:
          type: string
        domain:
          type: string
        score:
          type: number
        trace_id:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        resolved:
          type: boolean
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolution_status:
          type: string
          nullable: true
        resolution_note:
          type: string
          nullable: true

    AthenaThinkingRecord:
      type: object
      description: One complete Athena thinking cycle (observe → think → decide)
      properties:
        record_id:
          type: string
        trace_id:
          type: string
        cycle_at:
          type: string
          format: date-time
        trigger:
          type: string
          enum: [periodic, manual]
        observation:
          $ref: "#/components/schemas/ObservationSnapshot"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ActionCandidate"
        emitted_count:
          type: integer
        hint_published:
          type: boolean
        error:
          type: string
          nullable: true
        threshold:
          type: number
          description: Gate threshold used in this cycle
        duration_ms:
          type: integer

    ObservationSnapshot:
      type: object
      description: System state as observed by Athena in one cycle
      properties:
        observation_id:
          type: string
        observed_at:
          type: string
          format: date-time
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceSnapshot"
        unhealthy_services:
          type: array
          items:
            type: string
        domains:
          type: array
          items:
            $ref: "#/components/schemas/DomainEntitySummary"
        active_commitments:
          type: integer
        unresolved_commitments:
          type: integer
        recent_failures:
          type: integer
        failure_streak:
          type: integer
        raw_errors:
          type: array
          items:
            type: string

    ServiceSnapshot:
      type: object
      properties:
        name:
          type: string
        base_url:
          type: string
        service_type:
          type: string
        status:
          type: string
          enum: [up, down, degraded, unknown]
        tags:
          type: array
          items:
            type: string

    DomainEntitySummary:
      type: object
      properties:
        domain:
          type: string
        total_entities:
          type: integer
        recent_count:
          type: integer
        pending_count:
          type: integer
        sample_titles:
          type: array
          items:
            type: string

    ActionCandidate:
      type: object
      description: A single action Athena is considering
      properties:
        candidate_id:
          type: string
        domain:
          type: string
        title:
          type: string
        summary:
          type: string
        kind:
          type: string
          enum: [advisory, remediation, notification, maintenance]
        target_service:
          type: string
          nullable: true
        target_path:
          type: string
          nullable: true
        priority:
          type: string
          enum: [low, normal, elevated, high]
        reasoning:
          type: string
        score:
          type: number
        accepted:
          type: boolean
        gate_reason:
          type: string
          description: Why the relevance gate accepted/discarded it (Italian, e.g. "punteggio 0.48 < soglia 0.55 (urgenza bassa)")
        outcome:
          type: string
          enum: ["", emitted, forge, forge_skipped, setting_proposed, setting_skipped, failed, discarded]

    TaskLifecycleRecord:
      type: object
      properties:
        task_id:
          type: string
        task_type:
          type: string
        lifecycle_state:
          type: string
          enum: [queued, running, succeeded, failed, canceled]
        progress:
          type: number
          minimum: 0
          maximum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        session_id:
          type: string
          nullable: true
        trace_id:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true
          nullable: true
        error:
          type: object
          additionalProperties: true
          nullable: true

    ArgusRemediationRequest:
      type: object
      required: [service, issue]
      properties:
        service:
          type: string
        issue:
          type: string
        severity:
          type: string
          default: warning
        requested_action:
          type: string
          default: runbook_autoselect
        environment:
          type: string
          default: dev
        dry_run:
          type: boolean
          default: true
        auto_approve:
          type: boolean
          default: false
        metadata:
          type: object
          additionalProperties: true

    HephaestusRemediationRequest:
      type: object
      required: [service, issue]
      properties:
        source:
          type: string
          default: argus
        incident_id:
          type: string
        service:
          type: string
        issue:
          type: string
        severity:
          type: string
          default: warning
        requested_action:
          type: string
          default: runbook_autoselect
        environment:
          type: string
          default: dev
        dry_run:
          type: boolean
          default: true
        auto_approve:
          type: boolean
          default: false
        metadata:
          type: object
          additionalProperties: true

    HephaestusRemediationApproveRequest:
      type: object
      properties:
        approved_by:
          type: string
          default: operator
        note:
          type: string
          nullable: true
        dry_run_override:
          type: boolean
          nullable: true

    HephaestusRemediationRollbackRequest:
      type: object
      properties:
        requested_by:
          type: string
          default: operator
        reason:
          type: string
          default: manual_rollback

    HephaestusTaskRecord:
      type: object
      properties:
        task_id:
          type: string
        incident_id:
          type: string
        source:
          type: string
        service:
          type: string
        issue:
          type: string
        severity:
          type: string
        environment:
          type: string
        requested_action:
          type: string
        runbook_id:
          type: string
        state:
          type: string
          enum: [pending_approval, running, succeeded, failed, rolled_back]
        dry_run:
          type: boolean
        auto_approve:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        branch:
          type: string
        baseline_ref:
          type: string
        commit_ref:
          type: string
          nullable: true
        rollback_ref:
          type: string
        notifications:
          type: array
          items:
            type: object
            additionalProperties: true
        metadata:
          type: object
          additionalProperties: true

    # ── Hermes ────────────────────────────────────────────────────────────────
    HermesEventRequest:
      type: object
      required: [event_type, domain, entity_id, payload]
      properties:
        event_type:
          type: string
          example: new_listing
        domain:
          type: string
          example: real_estate
        entity_id:
          type: string
        payload:
          type: object
          additionalProperties: true
          description: >-
            Domain data plus Hermes keys: _message, _title, _level, _source, _actions (an action may carry
            resolves: true = ends a repeat chain), _origin, dedupe_key; closes + decision (done/resolved also
            end a repeat chain) + outcome_text; replaces: "<key>" = same reminder again: never deduped, the
            previous open one is superseded on every client and Hermes keeps the counter (result.repeat).
        event_ts:
          type: string
          format: date-time

    DispatchSendRequest:
      type: object
      description: >
        Legacy direct send. target "owner" (default) → every client; a concrete target on a
        named client (channel = Hub client name, e.g. the Telegram chat that asked) → only that client.
      required: [message]
      properties:
        channel:
          type: string
          example: telegram
        target:
          type: string
          example: owner
        message:
          type: string
        metadata:
          type: object
          additionalProperties: true
        actions:
          type: array
          items: { $ref: "#/components/schemas/NotificationAction" }

    NotificationAction:
      type: object
      description: >
        Button of a Hermes notification. Route action (service+path) → Hermes routes the answer to that
        module via Hub ("<client>" in body = answering client); legacy {text, command} → the answering
        client runs the Hub command.
      properties:
        id: { type: string, maxLength: 20 }
        label: { type: string }
        text: { type: string, description: alias of label }
        style: { type: string, enum: [primary, danger, default] }
        service: { type: string }
        method: { type: string, default: POST }
        path: { type: string }
        body: { type: object, additionalProperties: true }
        command: { type: string }

    ClientNotifyRequest:
      type: object
      description: Hermes → client (POST capabilities.notify_endpoint via Hub)
      required: [kind, notification_id]
      properties:
        kind: { type: string, enum: [notification, update, retract] }
        notification_id: { type: string }
        target: { type: string, description: "owner, or the origin session (e.g. Telegram chat id)" }
        silent: { type: boolean, description: "Pushed to another client: keep it in the inbox only, no alert" }
        title: { type: string }
        message: { type: string, description: Telegram-style HTML }
        level: { type: string, enum: [info, success, warning, error] }
        source: { type: string }
        created_at: { type: string, format: date-time }
        actions:
          type: array
          items:
            type: object
            properties: { id: { type: string }, label: { type: string }, style: { type: string } }
        origin: { type: object, nullable: true, properties: { client: { type: string }, session_id: { type: string } } }
        payload: { type: object, additionalProperties: true }
        state: { type: string, description: "update: seen | answered | expired | superseded (a newer occurrence of the same reminder replaced it: drop it)" }
        superseded_by: { type: string, description: "update superseded: id of the new occurrence" }
        repeat:
          type: object
          nullable: true
          description: "Repeat chain counter, only from the second occurrence on; text = short Italian, readable aloud"
          properties: { count: { type: integer }, skipped: { type: integer }, since: { type: string }, text: { type: string, example: "Saltato 2 volte · dal 12 ott" } }
        seen: { type: object, properties: { by: { type: string }, at: { type: string } } }
        answer: { type: object, properties: { action_id: { type: string }, label: { type: string }, by: { type: string }, status: { type: string }, outcome_text: { type: string } } }
        pending: { type: boolean }
        ref: { type: string, description: "update/retract: the client's own message reference returned on delivery" }

    HermesNotification:
      type: object
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
        state: { type: string }
        read: { type: boolean }
        pending: { type: boolean, description: has actions and is still answerable }
        title: { type: string }
        message: { type: string }
        level: { type: string }
        source: { type: string }
        domain: { type: string }
        event_type: { type: string }
        actions: { type: array, items: { type: object } }
        audience: { type: string, enum: [global, origin] }
        origin: { type: object, nullable: true }
        other_client: { type: boolean }
        seen: { type: object, nullable: true }
        answer: { type: object, nullable: true }
        deliveries: { type: object, additionalProperties: { type: string } }
        repeat: { type: object, nullable: true, description: "same as ClientNotifyRequest.repeat (superseded rows are not listed)" }

    OutboundEventUpsertRequest:
      type: object
      required: [outbound_event_id, dedupe_key, lifecycle_state, event_type]
      properties:
        outbound_event_id:
          type: string
        dedupe_key:
          type: string
        lifecycle_state:
          type: string
          enum:
            [
              created,
              queued,
              delivered,
              seen,
              answered,
              dismissed,
              superseded,
              failed,
            ]
        event_type:
          type: string
        domain:
          type: string
        entity_id:
          type: string
        subscription_id:
          type: string
        channel:
          type: string
        target:
          type: string
        question_id:
          type: string
        brief_id:
          type: string
        source_service:
          type: string
        superseded_by:
          type: string
        detail:
          type: string
        payload:
          type: object
          additionalProperties: true

    OutboundEventStateUpdateRequest:
      type: object
      required: [lifecycle_state]
      properties:
        lifecycle_state:
          type: string
          enum:
            [
              created,
              queued,
              delivered,
              seen,
              answered,
              dismissed,
              superseded,
              failed,
              dead,
              expired,
            ]
        detail:
          type: string
        superseded_by:
          type: string
        only_if_states:
          type: array
          items: { type: string }
          description: Compare-and-set — change only if the current state is in this list, else 409 {status=state_conflict, lifecycle_state}
        payload_merge:
          type: object
          additionalProperties: true
          description: Shallow merge into payload (top-level keys) in the same transaction

    # ── Chronos ───────────────────────────────────────────────────────────────
    CalendarEvent:
      type: object
      required: [title, start_datetime, end_datetime]
      properties:
        title:
          type: string
        description:
          type: string
        start_datetime:
          type: string
          format: date-time
        end_datetime:
          type: string
          format: date-time
        location:
          type: string
        timezone:
          type: string
          default: Europe/Rome
        all_day:
          type: boolean
          default: false
        reminders_minutes_before:
          type: array
          items:
            type: integer
          default: [30]
        source_reference:
          type: string

    CreateEventRequest:
      type: object
      required: [event]
      properties:
        event:
          $ref: "#/components/schemas/CalendarEvent"
        target_providers:
          type: array
          items:
            type: string
          default: []
        calendar_id:
          type: string
          default: primary

    ListEventsRequest:
      type: object
      required: [start_datetime, end_datetime]
      properties:
        start_datetime:
          type: string
          format: date-time
        end_datetime:
          type: string
          format: date-time
        target_providers:
          type: array
          items:
            type: string
        calendar_id:
          type: string
          default: primary
        max_results:
          type: integer
          default: 50
          minimum: 1
          maximum: 250

    # ── Scout ─────────────────────────────────────────────────────────────────
    ModuleToolQueryRequest:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
          example: real_estate
        query:
          type: string
        session_id:
          type: string
        limit:
          type: integer
          default: 20
          minimum: 1
          maximum: 50
        filters:
          type: object
          additionalProperties: true
        filters_gt:
          type: object
          additionalProperties: true
        filters_lt:
          type: object
          additionalProperties: true
        sort_by:
          type: string
        sort_order:
          type: string
          enum: [asc, desc]
        preferences:
          type: array
          items:
            type: object

    RealEstateSearchRequest:
      type: object
      properties:
        query:
          type: string
        limit:
          type: integer
          default: 20
          minimum: 1
          maximum: 50
        city:
          type: string
        nearby:
          type: string
        radius_km:
          type: number
        price_max:
          type: number
        price_min:
          type: number
        rooms_min:
          type: integer
        surface_min:
          type: number

# ─────────────────────────────────────────────────────────────────────────────
#  Paths
# ─────────────────────────────────────────────────────────────────────────────
paths:
  # ══════════════════════════════════════════════════════════════════════════
  #  HUB — 19001
  # ══════════════════════════════════════════════════════════════════════════

  /health:
    get:
      tags: [Hub]
      summary: Hub health check
      servers:
        - url: http://localhost:19001
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/registry/register:
    post:
      tags: [Hub]
      summary: Register a service
      description: >-
        Also the keepalive: every service calls it again every 60 s. A service with no registration in the
        last 180 s is shown offline (`/api/ui/map`), and the in-memory registry is rebuilt this way after a Hub restart.
      servers:
        - url: http://localhost:19001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterServiceRequest"
      responses:
        "200":
          description: Registered

  /api/registry/deregister:
    post:
      tags: [Hub]
      summary: Deregister a service
      servers:
        - url: http://localhost:19001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                base_url:
                  type: string
      responses:
        "200":
          description: Deregistered

  /api/registry/revision:
    get:
      tags: [Hub]
      summary: Get current registry revision number
      servers:
        - url: http://localhost:19001
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    type: integer
                  updated_at:
                    type: string
                  services_count:
                    type: integer

  /api/registry/wait:
    get:
      tags: [Hub]
      summary: Wait for registry revision change (long-poll)
      servers:
        - url: http://localhost:19001
      parameters:
        - name: after_revision
          in: query
          schema:
            type: integer
            default: 0
        - name: timeout_seconds
          in: query
          schema:
            type: number
            default: 120
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    type: integer
                  updated_at:
                    type: number
                  changed:
                    type: boolean
                  services_count:
                    type: integer

  /api/registry/services:
    get:
      tags: [Hub]
      summary: List all registered services
      servers:
        - url: http://localhost:19001
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      type: object

  /api/discovery/commands:
    get:
      tags: [Hub]
      summary: Discover all routable commands
      servers:
        - url: http://localhost:19001
      parameters:
        - name: client
          in: query
          schema:
            type: string
          example: telegram
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  commands:
                    type: array
                    items:
                      type: object

  /api/discovery/catalog:
    get:
      tags: [Hub]
      summary: One catalog of module contributions, organized by client and type
      description: |
        Tools (MCP, client `*`), commands, and client plugin contributions (page, widget, quick_action, bundle)
        read from each module's `capabilities.ui_manifest`. See docs/work/2026-10-17-client-plugins/SPEC.md §4.2.
      servers:
        - url: http://localhost:19001
      parameters:
        - name: client
          in: query
          schema: {type: string}
          example: webui
        - name: type
          in: query
          description: Comma-separated types (tool, command, page, widget, quick_action)
          schema: {type: string}
          example: page,widget,quick_action
        - name: module
          in: query
          schema: {type: string}
          example: scout
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision: {type: integer}
                  ui_revision: {type: string}
                  modules:
                    type: array
                    items:
                      type: object
                      properties:
                        module: {type: string}
                        title: {type: string}
                        icon: {type: string}
                        color: {type: string}
                        version: {type: string}
                        kind: {type: string, enum: [domain, core], description: "core = system module (WebUI «Sistema»)"}
                        online: {type: boolean}
                  contributions:
                    type: object
                    description: "{client: {type: [items]}} — items carry id `<module>.<id>`, module, label, online"
                    additionalProperties:
                      type: object
                      additionalProperties:
                        type: array
                        items: {type: object}

  /api/discovery/module-tools:
    get:
      tags: [Hub]
      summary: Discover module-tool endpoints
      servers:
        - url: http://localhost:19001
      responses:
        "200":
          description: OK

  /api/status:
    get:
      tags: [Hub]
      summary: Health status of all registered services
      servers:
        - url: http://localhost:19001
      responses:
        "200":
          description: OK

  /api/ui/map:
    get:
      tags: [Hub]
      summary: Mappa read model (Hub WebUI plugin) — every service plus Hub itself
      description: |
        One row per service (newest instance) plus Hub: online = re-registered in the last 180 s, node
        (`capabilities.node` or base-URL host), version, last heartbeat, topology tags. `probe=true` also calls each
        health endpoint in parallel. Also reachable as `/api/route/hub/api/ui/map` (answered in-process by Hub).
      servers:
        - url: http://localhost:19001
      parameters:
        - name: probe
          in: query
          schema: {type: boolean, default: false}
      responses:
        "200": {description: "{revision, updated_at, generated_at, online_window_seconds, probed, services_count, online_count, offline_count, services: [{name, node, service_type, version, tags[], topology_tags[], topology{}, last_heartbeat, age_seconds, online, instances, has_ui, has_mcp, self?, health?, health_status_code?}]}"}

  /hub/api/ui/manifest:
    get:
      tags: [Hub]
      summary: WebUI plugin manifest (real path /api/ui/manifest; kind core, api_prefix /api/ui/)
      description: |
        Plugin contract (docs/work/2026-10-17-client-plugins/SPEC.md §4): page `mappa` (hub-map, order 100), widget
        `online` (hub-online-widget, auto). Bundle file at /ui/webui/hub.js. Hub never registers with itself: this
        manifest is folded into `/api/discovery/catalog` in-process, and `/api/route/hub/{api/ui/*, ui/*}` is answered
        locally (GET only; other paths 404, other methods 405).
      servers:
        - url: http://localhost:19001
      responses:
        "200": {description: "{module: hub, title, icon, color, description, kind: core, clients.webui{entry, api_prefix, page[], widget[], quick_action[]}, version}"}

  /api/standards/registration:
    get:
      tags: [Hub]
      summary: Registration standards and allowed values
      servers:
        - url: http://localhost:19001
      responses:
        "200":
          description: OK

  /api/logs:
    get:
      tags: [Hub]
      summary: Retrieve buffered runtime logs (service-local endpoint)
      description: |
        Implemented in all runtime services.
        Current instances:
        - Hub (19001)
        - Archive (19002)
        - Hecate (19003)
        - Oracle (19004)
        - Hermes (19005)
        - Scout (19006)
        - Chronos (19007)
        - Argus (19008)
        - Athena (19009)
        - Hephaestus (19010)
        - Telegram control API (internal: hestia_telegram:8010)

        Sensitive values (tokens, passwords, secrets, credential URLs, auth headers)
        are redacted before entries are buffered and returned.

        Use query filters to keep output dense and useful for troubleshooting.
      servers:
        - url: http://localhost:19001
          description: Hub
        - url: http://localhost:19002
          description: Archive
        - url: http://localhost:19003
          description: Hecate
        - url: http://localhost:19012
          description: Iris
        - url: http://localhost:19004
          description: Oracle
        - url: http://localhost:19005
          description: Hermes
        - url: http://localhost:19006
          description: Scout
        - url: http://localhost:19007
          description: Chronos
        - url: http://localhost:19008
          description: Argus
        - url: http://localhost:19009
          description: Athena
        - url: http://localhost:19010
          description: Hephaestus
        - url: http://hestia_telegram:8010
          description: Telegram control API (Docker network)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
            maximum: 2000
        - name: level
          in: query
          schema:
            type: string
            example: INFO
        - name: contains
          in: query
          schema:
            type: string
            example: outbound_event_id=p2-4-smoke-3
      responses:
        "200":
          description: "{service, count, logs[]}"

  /api/logs/level:
    get:
      tags: [Meta]
      summary: Get current runtime log level (per-service)
      description: |
        Returns the effective log level for this service instance.
        Available on every FastAPI-based Hestia service.
        Levels: TRACE (5), DEBUG (10), INFO (20), WARNING (30), ERROR (40), CRITICAL (50).
      servers:
        - url: http://localhost:19001
          description: Hub
        - url: http://localhost:19002
          description: Archive
        - url: http://localhost:19003
          description: Hecate
        - url: http://localhost:19004
          description: Oracle
        - url: http://localhost:19005
          description: Hermes
        - url: http://localhost:19006
          description: Scout
        - url: http://localhost:19007
          description: Chronos
        - url: http://localhost:19008
          description: Argus
        - url: http://localhost:19009
          description: Athena
        - url: http://localhost:19010
          description: Hephaestus
        - url: http://localhost:19012
          description: Iris
        - url: http://localhost:19013
          description: MCP
        - url: http://localhost:19014
          description: Metis
      responses:
        "200":
          description: |
            {
              "service": "hestia_oracle",
              "level": "INFO"
            }
    post:
      tags: [Meta]
      summary: Set runtime log level (per-service, no restart)
      description: |
        Change the log level for this service instance at runtime.
        No container restart required.  Takes effect immediately.
        Request body: {"level": "DEBUG"}
      servers:
        - url: http://localhost:19001
          description: Hub
        - url: http://localhost:19002
          description: Archive
        - url: http://localhost:19003
          description: Hecate
        - url: http://localhost:19004
          description: Oracle
        - url: http://localhost:19005
          description: Hermes
        - url: http://localhost:19006
          description: Scout
        - url: http://localhost:19007
          description: Chronos
        - url: http://localhost:19008
          description: Argus
        - url: http://localhost:19009
          description: Athena
        - url: http://localhost:19010
          description: Hephaestus
        - url: http://localhost:19012
          description: Iris
        - url: http://localhost:19013
          description: MCP
        - url: http://localhost:19014
          description: Metis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level:
                  type: string
                  enum: [TRACE, DEBUG, INFO, WARNING, ERROR, CRITICAL]
                  example: DEBUG
      responses:
        "200":
          description: |
            {
              "service": "hestia_oracle",
              "level": "DEBUG"
            }
        "400":
          description: Unknown log level

  /api/monitor/logs/{service_name}:
    get:
      tags: [Hub]
      summary: Retrieve logs for a registered service through Hub monitoring proxy
      description: |
        Supports multiple output modes:
        - raw: original proxied payload
        - text/transcribe: flattened plain-text log stream
        - ai/analyze/summary: Oracle-formatted analysis, with text fallback
      servers:
        - url: http://localhost:19001
      parameters:
        - name: service_name
          in: path
          required: true
          schema:
            type: string
          example: archive
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
            maximum: 2000
        - name: level
          in: query
          schema:
            type: string
            example: WARNING
        - name: contains
          in: query
          schema:
            type: string
            example: event=hub_register_non_success
        - name: mode
          in: query
          schema:
            type: string
            enum: [raw, text, transcribe, ai, analyze, summary]
            default: raw
        - name: response_prompt
          in: query
          schema:
            type: string
            example: Summarize critical errors and actionable next checks.
        - name: include_raw
          in: query
          schema:
            type: boolean
            default: false
        - name: timeout_seconds
          in: query
          schema:
            type: number
            default: 8.0
      responses:
        "200":
          description: "Mode-dependent payload. Raw: {status_code, service, target, payload}; Text/AI: {status_code, service, target, mode, text, line_count[, payload]}"

  /api/route/{service_name}/{path}:
    parameters:
      - name: service_name
        in: path
        required: true
        schema:
          type: string
        description: |
          Service name, comma-separated list, or ``*`` wildcard.

          | Value | Mode | Example |
          |-------|------|---------|
          | ``oracle`` | Unicast | Route to oracle only |
          | ``oracle,argus`` | Multicast | Route to oracle AND argus |
          | ``*`` | Broadcast | Route to ALL registered services |

          Broadcast/multicast returns an aggregated envelope:
          ``{"service": "*", "count": N, "ok": N, "results": [...]}``.
          Unicast returns the target's payload directly (backward-compatible).
      - name: path
        in: path
        required: true
        schema:
          type: string
        example: api/logs/level
    get:
      tags: [Hub]
      summary: Route a GET request (unicast, multicast, or broadcast)
      description: |
        Use ``service_name=*`` to broadcast to all services.
        Use ``service_name=oracle,argus`` for multicast.
      servers:
        - url: http://localhost:19001
      parameters:
        - name: service_name
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Aggregated results (multicast/broadcast) or direct payload (unicast)
    post:
      tags: [Hub]
      summary: Route a request to a registered service (unicast, multicast, or broadcast)
      description: |
        Use ``service_name=*`` to broadcast to all services (e.g. set all log levels at once).
        Use ``service_name=oracle,argus`` for multicast to specific services.
      servers:
        - url: http://localhost:19001
      parameters:
        - name: service_name
          in: path
          required: true
          schema:
            type: string
          example: archive
        - name: path
          in: path
          required: true
          schema:
            type: string
          example: api/entities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteRequest"
      responses:
        "200":
          description: Proxied response from the target service, or aggregated envelope for broadcast/multicast

  /api/domains:
    get:
      tags: [Hub]
      summary: List all known module tool domains (aggregated from registered services)
      servers:
        - url: http://localhost:19001
      responses:
        "200":
          description: '["calendar", "email", "real_estate", "system", ...]'

  /api/schemas:
    get:
      tags: [Hub]
      summary: Entity field schemas per domain (aggregated from registered services)
      servers:
        - url: http://localhost:19001
      responses:
        "200":
          description: '{"real_estate": {"fields": {...}}, ...}'

  # ══════════════════════════════════════════════════════════════════════════
  #  ARCHIVE — 19002
  # ══════════════════════════════════════════════════════════════════════════

  /archive/health:
    get:
      tags: [Archive — Records]
      summary: Archive health check
      servers:
        - url: http://localhost:19002
      responses:
        "200":
          description: OK

  /api/archive:
    post:
      tags: [Archive — Records]
      summary: Ingest a raw domain record
      servers:
        - url: http://localhost:19002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveRecord"
      responses:
        "200":
          description: Saved record

  /api/archive/{domain}/unevaluated:
    get:
      tags: [Archive — Records]
      summary: List unevaluated records for a domain
      servers:
        - url: http://localhost:19002
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of records

  /api/archive/{record_id}:
    patch:
      tags: [Archive — Records]
      summary: Mark a record as evaluated
      servers:
        - url: http://localhost:19002
      parameters:
        - name: record_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                evaluation:
                  type: object
      responses:
        "200":
          description: Updated record

  /api/entities:
    post:
      tags: [Archive — Entities]
      summary: Create or update an entity
      servers:
        - url: http://localhost:19002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntityUpsertRequest"
      responses:
        "200":
          description: Entity
    get:
      tags: [Archive — Entities]
      summary: List active entities (flat format)
      servers:
        - url: http://localhost:19002
      parameters:
        - name: domain
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of entity dicts

  /api/entities/records:
    get:
      tags: [Archive — Entities]
      summary: List entities with full record metadata
      servers:
        - url: http://localhost:19002
      parameters:
        - name: domain
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: include_embedding
          in: query
          description: false = rows without vectors (lighter, e.g. a module UI listing)
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: List of EntityResponse

  /api/entities/search:
    post:
      tags: [Archive — Entities]
      summary: Search entities with filters or vector similarity
      servers:
        - url: http://localhost:19002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntitySearchRequest"
      responses:
        "200":
          description: Matched entity dicts

  /api/entities/cleanup:
    post:
      tags: [Archive — Entities]
      summary: Delete entities missing required fields
      servers:
        - url: http://localhost:19002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain:
                  type: string
                required_fields:
                  type: array
                  items:
                    type: string
                require_created_at:
                  type: boolean
                delete_limit:
                  type: integer
                dry_run:
                  type: boolean
                  default: true
      responses:
        "200":
          description: Cleanup result

  /api/chat/history/all:
    get:
      tags: [Archive — Chat]
      summary: Get all chat history
      servers:
        - url: http://localhost:19002
      responses:
        "200":
          description: All messages
    delete:
      tags: [Archive — Chat]
      summary: Delete all chat history
      servers:
        - url: http://localhost:19002
      responses:
        "200":
          description: Deleted count

  /api/chat/history:
    post:
      tags: [Archive — Chat]
      summary: Append a chat message
      servers:
        - url: http://localhost:19002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageRequest"
      responses:
        "200":
          description: Saved message

  /api/chat/history/{session_id}:
    get:
      tags: [Archive — Chat]
      summary: Get chat history for a session
      servers:
        - url: http://localhost:19002
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Messages
