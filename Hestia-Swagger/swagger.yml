  # ══════════════════════════════════════════════════════════════════════════
  #  HECATE — 19003
  # ══════════════════════════════════════════════════════════════════════════

  /ingest/health:
    get:
      tags: [Hecate]
      summary: Hecate health check
      servers:
        - url: http://localhost:19003
      responses:
        "200":
          description: OK

  /api/ingest/trigger:
    post:
      tags: [Hecate]
      summary: Trigger a data fetch for a domain/source
      servers:
        - url: http://localhost:19003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, source]
              properties:
                domain:
                  type: string
                  example: real_estate
                source:
                  type: string
                  example: immobiliare_it
                filter_query:
                  type: string
      responses:
        "200":
          description: "{status, fetched}"

  /api/ingest/calendar/trigger:
    post:
      tags: [Hecate]
      summary: Trigger calendar sync from providers to Archive
      servers:
        - url: http://localhost:19003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sources:
                  type: array
                  items:
                    type: string
                    enum: [gcal, outlook_calendar]
                  description: Defaults to all available
                calendar_id:
                  type: string
                  default: primary
      responses:
        "200":
          description: "{status, sources: {source: {fetched, archived, error?}}, total_archived}"

  /api/gateway/providers:
    get:
      tags: [Hecate]
      summary: List configured gateway providers and availability
      servers:
        - url: http://localhost:19003
      responses:
        "200":
          description: "{status, providers[]}"

  /api/gateway/auth/status:
    get:
      tags: [Hecate]
      summary: Show provider auth status snapshot
      servers:
        - url: http://localhost:19003
      responses:
        "200":
          description: "{status, providers[]}"

  /api/gateway/outbound/mcp:
    get:
      tags: [Hecate]
      summary: Outbound MCP servers from .env (HECATE_MCP_<NAME>_URL / _KEY) — names, host and status, never a key
      servers:
        - url: http://localhost:19003
      responses:
        "200": {description: "{status, servers: [{name, host, auth: key|none, status: configured|invalid_url}], how_to}"}

  /api/gateway/auth/refresh/{provider}:
    post:
      tags: [Hecate]
      summary: Trigger provider auth refresh (re-acquires token via provider.refresh())
      servers:
        - url: http://localhost:19003
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, microsoft]
      responses:
        "200":
          description: "{status, provider, refreshed, details}"
        "400":
          description: Unsupported provider

  /api/gateway/auth/initiate/{provider}:
    post:
      tags: [Hecate]
      summary: Start OAuth flow for a provider (Google redirect / Microsoft device-code)
      servers:
        - url: http://localhost:19003
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, microsoft]
      responses:
        "200":
          description: "Google (loopback + PKCE): {status, mode: loopback, auth_url, redirect_uri, expires_in, instructions} | Microsoft: {status, user_code, verification_url, expires_in, instructions}"
        "400":
          description: Missing credentials or unsupported provider
        "501":
          description: Auth library not installed
    delete:
      tags: [Hecate]
      summary: Cancel a pending OAuth flow
      servers:
        - url: http://localhost:19003
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "{status: cancelled, provider}"

  /api/gateway/auth/poll/{provider}:
    get:
      tags: [Hecate]
      summary: Poll completion of a pending OAuth device-code flow
      servers:
        - url: http://localhost:19003
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "{status: authorized|pending|no_pending_flow|error}"

  /api/gateway/auth/complete/{provider}:
    post:
      tags: [Hecate]
      summary: Exchange the authorization code (or the full pasted redirect URL) for a token
      servers:
        - url: http://localhost:19003
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, microsoft]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Authorization code, or the full loopback URL shown after consent (code + state are parsed)
                state:
                  type: string
                  description: Optional OAuth state (validated against the pending flow)
      responses:
        "200":
          description: "{status: authorized|token_saved_provider_unavailable, provider, granted_scopes[], active_providers[], unavailable, note}"
        "400":
          description: "Missing code, state mismatch, Google error. Body: {detail: {error, hint}}"
        "404":
          description: No pending flow (expired after 15 min or never started) — call initiate first

  /api/gateway/mail/status:
    get:
      tags: [Hecate]
      summary: Mail provider configuration state
      servers:
        - url: http://localhost:19003
      responses:
        "200": {description: "{status, configured, user, imap_host, smtp_host}"}

  /api/gateway/mail/messages:
    get:
      tags: [Hecate]
      summary: Search the mailbox (IMAP)
      servers:
        - url: http://localhost:19003
      parameters:
        - {name: q, in: query, schema: {type: string}, description: "free text or raw IMAP criteria, e.g. FROM \"x\""}
        - {name: since, in: query, schema: {type: string}, description: ISO date}
        - {name: limit, in: query, schema: {type: integer, default: 50}}
      responses:
        "200": {description: "{status, count, messages[{id, thread_id, from, to, subject, body, created_at}]}"}
        "503": {description: Provider not configured or IMAP error}

  /api/gateway/mail/send:
    post:
      tags: [Hecate]
      summary: Send an email (SMTP)
      servers:
        - url: http://localhost:19003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, subject, body]
              properties:
                to: {type: string}
                subject: {type: string}
                body: {type: string}
      responses:
        "200": {description: "{status, sent}"}
        "503": {description: Provider not configured or SMTP error}

  /api/gateway/mail/watch/run:
    post:
      tags: [Hecate]
      summary: "Check the mailbox once (Gmail history API) and push new mail headers to Iris (agenda job hecate.mail_watch)"
      description: |
        The one look at the mailbox for the whole of Hestia. New headers since the stored history cursor go to
        Iris (`POST /route/iris/api/email/incoming`); when Iris answers an error the cursor is kept and the batch is
        offered again. Also fired by Gmail Pub/Sub push when configured (then the agenda job is only a safety net).
      servers:
        - url: http://localhost:19003
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                trigger: {type: string, default: api, description: "agenda | webui | pubsub | api"}
      responses:
        "200":
          description: "{status: ok|initialized|busy|skipped|error, new, source?, reason?, action_required?: reauth_google, error?}"

  /api/gateway/mail/watch:
    get:
      tags: [Hecate]
      summary: Mail watcher state
      servers:
        - url: http://localhost:19003
      responses:
        "200":
          description: "{status, agenda_job, interval_seconds, watcher: {history_id, last_check, last_ok, last_new, last_source, last_trigger, last_error, pushed_total, pending}, push: {configured, topic, ...}}"

  /api/gateway/mail/watch/renew:
    post:
      tags: [Hecate]
      summary: "Renew Gmail push (Pub/Sub watch, expires after 7 days) — agenda job hecate.mail_watch_renew; inactive until configured"
      servers:
        - url: http://localhost:19003
      responses:
        "200":
          description: "{status: ok|inactive|error, reason?: not_configured, error?, ...watch state}"

  /api/gateway/auth/callback/google:
    get:
      tags: [Hecate]
      summary: Loopback redirect target of the Google OAuth flow (completes it, returns HTML)
      servers:
        - url: http://localhost:19003
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        "200":
          description: HTML success page
        "400":
          description: HTML error page with hint

  # ══════════════════════════════════════════════════════════════════════════
  #  IRIS — 19012
  # ══════════════════════════════════════════════════════════════════════════

  /iris/health:
    get:
      tags: [Iris]
      summary: Iris health check
      servers:
        - url: http://localhost:19012
      responses:
        "200":
          description: OK

  /api/email/inbox:
    get:
      tags: [Iris]
      summary: List inbox messages
      servers:
        - url: http://localhost:19012
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: "{status, count, messages[]}"

  /api/email/messages:
    get:
      tags: [Iris]
      summary: Search messages by free-text query
      servers:
        - url: http://localhost:19012
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: "{status, query, count, messages[]}"

  /api/email/send:
    post:
      tags: [Iris]
      summary: Send an email via Iris domain service
      servers:
        - url: http://localhost:19012
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, subject, body]
              properties:
                to:
                  type: string
                subject:
                  type: string
                body:
                  type: string
                thread_id:
                  type: string
      responses:
        "200":
          description: "{status, sent}"

  /api/email/subscriptions:
    post:
      tags: [Iris]
      summary: "A module declares its full mail rule set (hestia_common.mail_client); new/changed rules get a backfill"
      servers:
        - url: http://localhost:19012
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner]
              properties:
                owner: {type: string, example: scout}
                rules:
                  type: array
                  items:
                    type: object
                    required: [key, title, path, domain]
                    properties:
                      key: {type: string, example: listings}
                      title: {type: string}
                      path: {type: string, description: "module endpoint Iris rings via Hub after storing matching mails, e.g. /api/scout/mail"}
                      domain: {type: string, description: "Archive domain the mails are stored under (real_estate, finance…)"}
                      senders: {type: array, items: {type: string}, description: "addresses or domains (OR)"}
                      subject_contains: {type: array, items: {type: string}, description: "words (OR)"}
                      labels: {type: array, items: {type: string}, description: "Gmail label ids (OR)"}
                      queries: {type: array, items: {type: string}, description: "Gmail searches evaluated by Hecate (any)"}
                      description: {type: string}
                      backfill_days: {type: integer}
                  description: "Filled groups are AND-ed, values inside a group OR-ed"
      responses:
        "200": {description: "{status, owner, rules, changed, backfill[keys]}"}
        "422": {description: invalid rule}
    get:
      tags: [Iris]
      summary: List subscriptions
      servers:
        - url: http://localhost:19012
      parameters:
        - {name: owner, in: query, schema: {type: string}}
      responses:
        "200": {description: "{status, count, subscriptions[]}"}

  /api/email/subscriptions/{owner}/{key}:
    delete:
      tags: [Iris]
      summary: Remove one subscription
      servers:
        - url: http://localhost:19012
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: key, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status: ok}"}
        "404": {description: subscription not found}

  /api/email/subscriptions/{owner}/{key}/backfill:
    post:
      tags: [Iris]
      summary: "Deliver the matching mails of the last days again (the module's «controlla ora»; Archive dedupes)"
      servers:
        - url: http://localhost:19012
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: key, in: path, required: true, schema: {type: string}}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                days: {type: integer, description: "default: the rule's backfill_days"}
      responses:
        "200": {description: "{status: ok|error, found, stored, days, error?}"}

  /api/email/incoming:
    post:
      tags: [Iris]
      summary: "New mail headers from Hecate's watcher → match subscriptions, store in Archive, ring the modules"
      servers:
        - url: http://localhost:19012
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messages: {type: array, items: {type: object}, description: "mail headers {id, thread_id, from, to, subject, labels, created_at…}"}
                source: {type: string, default: watch}
      responses:
        "200": {description: "{status: ok, ok: true, received, delivered[{owner, key, count, …}], unmatched}"}
        "503": {description: "A matched mail could not be stored: Hecate keeps its cursor and offers the batch again"}

  /api/email/dispatch:
    get:
      tags: [Iris]
      summary: "Everything the «Email» page shows: subscriptions, last deliveries, counters, Hecate's watcher (MCP tool email_subscriptions)"
      servers:
        - url: http://localhost:19012
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 50, minimum: 1, maximum: 200}}
      responses:
        "200": {description: "{status, subscriptions[], deliveries[], stats, watcher|null}"}

  /api/email/check:
    post:
      tags: [Iris]
      summary: "«Controlla ora»: ask Hecate's watcher for one check (same as the agenda job)"
      servers:
        - url: http://localhost:19012
      responses:
        "200": {description: "the watcher result {status, new, …}"}
        "503": {description: Hecate not reachable}

  /api/email/threads/{thread_id}:
    get:
      tags: [Iris]
      summary: Get one email thread
      servers:
        - url: http://localhost:19012
      parameters:
        - name: thread_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "{status, thread_id, count, messages[]}"
        "404":
          description: thread not found

  # ══════════════════════════════════════════════════════════════════════════
  #  ORACLE — 19004
  # ══════════════════════════════════════════════════════════════════════════

  /oracle/health:
    get:
      tags: [Oracle]
      summary: Oracle health check
      servers:
        - url: http://localhost:19004
      responses:
        "200":
          description: OK

  /api/chat:
    post:
      tags: [Oracle]
      summary: Send a chat message (streaming NDJSON)
      servers:
        - url: http://localhost:19004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: >
            NDJSON stream with event types:
            - `{"type":"status","content":"..."}` — progress update
            - `{"type":"thinking","action":"reasoning|tool_call|tool_result","content":"...","turn":N,"tool":"...","metadata":{...}}` — agent loop visibility
            - `{"type":"token","text":"..."}` — incremental LLM token
            - `{"type":"final","reply":"...","domain":"..."}` — terminal answer
            - `{"type":"signal","event":"memory.preference.*|subscription.*|action.*|tool.summary","content":"...","data":{...}}` — side-channel event
            - `{"type":"question","question_id":"...","header":"...","prompt":"...","kind":"...","options":[...]}` — interactive prompt

  /api/chat/document/json:
    post:
      tags: [Oracle]
      summary: Document analysis with a JSON (base64) body — Hub-friendly twin of /api/chat/document
      servers:
        - url: http://localhost:19004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message: {type: string}
                session_id: {type: string}
                notify_target: {type: string}
                client_instructions: {type: string}
                client: {type: string}
                filename: {type: string}
                mime_type: {type: string}
                content_base64: {type: string, description: "file bytes, base64"}
                data_uri: {type: string, description: "alternative: data:<mime>;base64,..."}
      responses:
        "200":
          description: NDJSON stream (same frames as /api/chat/document)
        "400":
          description: invalid or empty base64
        "415":
          description: unsupported file type

  /api/chat/document:
    post:
      tags: [Oracle]
      summary: Analyse an uploaded document (streaming)
      servers:
        - url: http://localhost:19004
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [message, file]
              properties:
                message:
                  type: string
                session_id:
                  type: string
                notify_target:
                  type: string
                client_instructions:
                  type: string
                client:
                  type: string
                filename:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: NDJSON analysis stream

  /api/format:
    post:
      tags: [Oracle]
      summary: Format a command payload as HTML via LLM
      servers:
        - url: http://localhost:19004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FormatRequest"
      responses:
        "200":
          description: "{text}"

  /api/subscriptions/compile:
    post:
      tags: [Oracle]
      summary: Extract subscription signals from a natural-language message
      servers:
        - url: http://localhost:19004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, session_id]
              properties:
                message:
                  type: string
                session_id:
                  type: string
                notify_target:
                  type: string
      responses:
        "200":
          description: "{ok, message, signals[...]}"

  /api/chat/question-answer:
    post:
      tags: [Oracle]
      summary: Submit an answer for a pending Oracle question frame
      servers:
        - url: http://localhost:19004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, question_id, answer]
              properties:
                session_id:
                  type: string
                question_id:
                  type: string
                answer:
                  type: string
                client:
                  type: string
      responses:
        "200":
          description: "{resolved, question_id, action?: {ok, result}} — action = the module action bound to the answer (confirm cards, e.g. Themis proposals)"
        "404":
          description: "question not found or already resolved"

  /api/user/controls:
    get:
      tags: [Oracle]
      summary: Read durable user controllability settings
      servers:
        - url: http://localhost:19004
      responses:
        "200":
          description: "{controls}"
    post:
      tags: [Oracle]
      summary: Patch durable user controllability settings
      servers:
        - url: http://localhost:19004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                proactive_enabled:
                  type: boolean
                allowed_categories:
                  type: array
                  items:
                    type: string
                quiet_hours:
                  type: object
                  additionalProperties: true
                reminder_aggressiveness:
                  type: string
                dont_ask_again:
                  type: array
                  items:
                    type: string
                reset_scope:
                  type: string
                  enum: [branch, primary]
      responses:
        "200":
          description: "{updated, controls}"

  /api/feedback:
    post:
      tags: [Oracle]
      summary: Persist explicit quality feedback for a response/session
      servers:
        - url: http://localhost:19004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                interaction_id:
                  type: string
                source_client:
                  type: string
                quality_label:
                  type: string
                  enum: [excellent, good, mixed, poor, rejected]
                quality_score:
                  type: integer
                  minimum: 1
                  maximum: 5
                outcome_label:
                  type: string
                feedback_text:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                payload:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: "{ok, feedback}"
    get:
      tags: [Oracle]
      summary: List Oracle feedback records
      servers:
        - url: http://localhost:19004
      parameters:
        - name: session_id
          in: query
          schema:
            type: string
        - name: quality_label
          in: query
          schema:
            type: string
            enum: [excellent, good, mixed, poor, rejected]
        - name: source_client
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
      responses:
        "200":
          description: "{count, feedback}"

  /api/feedback/export/jsonl:
    get:
      tags: [Oracle]
      summary: Export Oracle feedback as JSONL
      servers:
        - url: http://localhost:19004
      parameters:
        - name: session_id
          in: query
          schema:
            type: string
        - name: quality_label
          in: query
          schema:
            type: string
            enum: [excellent, good, mixed, poor, rejected]
        - name: source_client
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 1000
      responses:
        "200":
          description: application/x-ndjson JSONL export

  /api/llm/models:
    get:
      tags: [Oracle]
      summary: Model choices of a named provider (oracle.providers; chain editor)
      parameters:
        - in: query
          name: provider
          required: true
          schema: { type: string, example: ollama }
      responses:
        "200":
          description: "{options: [{value, label}]} — Ollama installed models, Gemini curated list, Anthropic Models API, OpenAI-compatible /models, Claude CLI haiku/sonnet/opus"
          content:
            application/json:
              schema: { type: object }

  /api/llm/generate:
    post:
      tags: [Oracle]
      summary: Plain generation for services along a use case's chain (no classifier, no tools)
      servers:
        - url: http://localhost:19004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                use_case:
                  type: string
                  description: "Use case <module>.<task> declared in the module's Hub registration (capabilities.llm_usecases), e.g. scout.annunci, athena.strategia; default oracle.generale; undeclared → runs like oracle.generale and is listed. In brain mode esterna the external agent answers (one shot, no tools)."
      responses:
        "200":
          description: "{response, model, provider, use_case, chain} — provider/model of the chain step that answered"
        "503":
          description: "Every step of the chain failed or is out of quota (detail names the chain and each step)"

  /api/llm/providers:
    get:
      tags: [Oracle]
      summary: Named providers (setting oracle.providers) — never a key
      servers:
        - url: http://localhost:19004
      parameters:
        - {name: check, in: query, schema: {type: boolean, default: false}, description: "true = also list each available provider's models"}
      responses:
        "200": {description: "{status, providers: [{name, type, label, url, key_env, key_set, needs_key, available, detail, exhausted: {model: until}}], types: {type: label}}"}

  /api/llm/chains:
    get:
      tags: [Oracle]
      summary: Model chains (setting oracle.chains) with each step's state
      servers:
        - url: http://localhost:19004
      responses:
        "200": {description: "{status, chains: {name: {label, single_step, steps: [{provider, model, thinking?, available, detail, exhausted_until}]}}}"}

  /api/llm/usecases:
    get:
      tags: [Oracle]
      summary: Every use case (Oracle's, declared by modules, undeclared seen) with its effective chain, mode, thinking
      servers:
        - url: http://localhost:19004
      responses:
        "200": {description: "{status, usecases: [{id, module, label, chain, mode, thinking, help, undeclared?, effective_chain, effective_mode, effective_thinking}]}"}

  /api/llm/usecases/{use_case}:
    get:
      tags: [Oracle]
      summary: What a chat on this use case would use now (Forge engine oracle, use case forge.codice)
      servers:
        - url: http://localhost:19004
      parameters:
        - {name: use_case, in: path, required: true, schema: {type: string, example: forge.codice}}
      responses:
        "200": {description: "{status, use_case, chain, available, detail, provider, model, context_window, billed, steps[{provider, model}]}"}

  /api/llm/usage:
    get:
      tags: [Oracle]
      summary: Usage of the models (rows kept in Archive llm-usage), grouped
      servers:
        - url: http://localhost:19004
      parameters:
        - {name: group, in: query, schema: {type: string, enum: [module, session, usecase, model, step, day], default: module}}
        - {name: days, in: query, schema: {type: integer, default: 7}}
        - {name: module, in: query, schema: {type: string}}
        - {name: session_id, in: query, schema: {type: string}}
        - {name: use_case, in: query, schema: {type: string}}
      responses:
        "200": {description: "{status, group, days, rows: [{<group keys>, calls, ok, errors, quota, fallbacks, input_tokens, cached_tokens, output_tokens, cost_usd, avg_duration_ms, max_input_tokens, context_window, first_at, last_at}]}"}
        "502": {description: Archive unreachable}

  /api/llm/usage/calls:
    get:
      tags: [Oracle]
      summary: Latest single LLM calls (e.g. one conversation), newest first
      servers:
        - url: http://localhost:19004
      parameters:
        - {name: session_id, in: query, schema: {type: string}}
        - {name: module, in: query, schema: {type: string}}
        - {name: use_case, in: query, schema: {type: string}}
        - {name: days, in: query, schema: {type: integer, default: 7}}
        - {name: limit, in: query, schema: {type: integer, default: 100}}
      responses:
        "200": {description: "{status, rows: [{at, module, use_case, chain, step, provider, model, client, session_id, input_tokens, cached_tokens, output_tokens, context_window, duration_ms, cost_usd, cost_kind, outcome, detail}]}"}

  /api/agent-bridge/{token}/tools:
    get:
      tags: [Oracle]
      summary: Loopback only — tools of the external agent's running turn (stdio MCP bridge tools/list)
      servers:
        - url: http://127.0.0.1:19004
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{tools: [{name, description, inputSchema}]}"}
        "403": {description: Not from loopback}
        "404": {description: Unknown or finished turn}

  /api/agent-bridge/{token}/call:
    post:
      tags: [Oracle]
      summary: Loopback only — run one tool for the external agent (same handler and approval gate as the internal loop)
      servers:
        - url: http://127.0.0.1:19004
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {name: {type: string}, params: {type: object}}}
      responses:
        "200": {description: "{ok, result}"}
        "403": {description: Not from loopback}
        "404": {description: Unknown or finished turn}

  /api/chat/{session_id}:
    delete:
      tags: [Oracle]
      summary: Clear Oracle in-memory session state
      servers:
        - url: http://localhost:19004
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "{status, session_id}"

  /api/chat/context:
    get:
      tags: [Oracle]
      summary: Return context-window usage stats for a session (Plan P2-4c)
      servers:
        - url: http://localhost:19004
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            {session_id, context_window, history_messages, history_chars,
             history_tokens_est, tool_count, preference_count,
             total_tokens_est, context_used_pct, compaction_available,
             context_used_tokens, context_measured,
             active: {use_case, provider, provider_label, model, billing, context_window},
             session_usage: {calls, input_tokens, cached_tokens, output_tokens, cost_usd, estimated,
             last_prompt_tokens, provider, model, last_at} ({} before the first counted call),
             runtime: {<use case>: {calls, provider, model, avg_prompt_tokens, max_prompt_tokens,
             cache_hit_pct, cache_estimated, avg_load_ms, avg_prompt_ms, tokens_per_second, last_at}}}.
            context_window = window of the chat provider in use (Ollama/OpenAI-compatible: setting
            oracle.provider.ollama.num_ctx; Gemini 1,048,576; Claude 200,000). context_used_tokens = real
            prompt size of this conversation's last call when measured, else the estimate.

  /api/chat/compact:
    post:
      tags: [Oracle]
      summary: Force-compact conversation history via LLM summarisation (Plan P2-6)
      servers:
        - url: http://localhost:19004
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            {session_id, before_tokens, after_tokens, messages_before,
             messages_after, summary_chars}

  /api/llm/code/status:
    get:
      tags: [Oracle]
      summary: Claude Code (code use case) readiness
      servers:
        - url: http://localhost:19004
      responses:
        "200": {description: "{status, available, detail, model}"}

  /oracle/api/ui/manifest:
    get:
      tags: [Oracle]
      summary: WebUI plugin manifest (real path /api/ui/manifest; kind core, api_prefix /api/ui/)
      description: |
        Plugin contract (docs/work/2026-10-17-client-plugins/SPEC.md §4): page `cervello` (oracle-brain, order 120),
        widget `uso-oggi` (oracle-usage-widget). Bundle file at /ui/webui/oracle.js.
      servers:
        - url: http://localhost:19004
      responses:
        "200": {description: "{module: oracle, title, icon, color, description, kind: core, clients.webui{entry, api_prefix, page[], widget[], quick_action[]}, version}"}

  /oracle/api/ui/activity:
    get:
      tags: [Oracle]
      summary: Recent chat turns (real path /api/ui/activity; page Cervello)
      description: In memory (last 200 turns, reset on restart). Newest first.
      servers:
        - url: http://localhost:19004
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 30, maximum: 200}}
      responses:
        "200": {description: "{status, count, turns: [{at, trace_id, session, client, mode, route: quick|quick_chat|agent, model, provider, domains[], tools: [{tool, ok, writes}], tools_failed, ms, preview, usage{calls, input_tokens, output_tokens, cost_usd}}], last_user_activity_ts, idle_seconds}"}

  /oracle/api/ui/stats:
    get:
      tags: [Oracle]
      summary: LLM use per day and per use case/model (real path /api/ui/stats; page Cervello, widget Uso modelli oggi)
      description: From the in-memory llm_stats (since Oracle started; days kept ≤ 31).
      servers:
        - url: http://localhost:19004
      parameters:
        - {name: days, in: query, schema: {type: integer, default: 14, maximum: 31}}
      responses:
        "200": {description: "{status, days: [{day, calls, input_tokens, cached_tokens, output_tokens, cost_usd}] (oldest first), today{…}, today_by_model: [{use_case, label, provider, model, calls, input_tokens, cached_tokens, output_tokens, cost_usd}], use_cases: [{use_case, label, calls, provider, model, avg_prompt_tokens, max_prompt_tokens, cache_hit_pct, cache_estimated, avg_load_ms, avg_prompt_ms, tokens_per_second, last_at}], since}"}

  /oracle/api/ui/code:
    get:
      tags: [Oracle]
      summary: Claude Code status and recent runs (real path /api/ui/code; page Cervello)
      servers:
        - url: http://localhost:19004
      responses:
        "200": {description: "{status, available, detail, model?, running, runs: [{task, started_at, state: running|done|failed, ok, ms, turns, cost_usd, error}]}"}

  /oracle/api/ui/models:
    get:
      tags: [Oracle]
      summary: Tab Modelli — providers (no keys), standards, chains with step state, use cases, overrides, modes (real path /api/ui/models)
      servers:
        - url: http://localhost:19004
      responses:
        "200": {description: "{status, providers[], types[{value,label}], chains{}, usecases[], overrides{}, modes[{value,label}]}"}

  /oracle/api/ui/models/list:
    get:
      tags: [Oracle]
      summary: Model names of a provider (real path /api/ui/models/list)
      servers:
        - url: http://localhost:19004
      parameters:
        - {name: provider, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, provider, models: [string]}"}
        "404": {description: Unknown provider}

  /oracle/api/ui/models/{part}:
    put:
      tags: [Oracle]
      summary: Save providers | chains | usecases through Themis (actor user; real path /api/ui/models/{part})
      servers:
        - url: http://localhost:19004
      parameters:
        - {name: part, in: path, required: true, schema: {type: string, enum: [providers, chains, usecases]}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [value], properties: {value: {type: object}}}
      responses:
        "200": {description: "{status, key}"}
        "400": {description: "Invalid value (unknown standard, chain without steps)"}
        "502": {description: Themis refused the change}

  /oracle/api/ui/models/quota/reset:
    post:
      tags: [Oracle]
      summary: «Riprova adesso» — forget the quota state of a provider/model (all when no provider)
      servers:
        - url: http://localhost:19004
      parameters:
        - {name: provider, in: query, schema: {type: string}}
        - {name: model, in: query, schema: {type: string}}
      responses:
        "200": {description: "{status}"}

  /oracle/api/ui/usage:
    get:
      tags: [Oracle]
      summary: Tab Uso — same as /api/llm/usage (real path /api/ui/usage; also /api/ui/usage/calls)
      servers:
        - url: http://localhost:19004
      responses:
        "200": {description: "{status, group, days, rows[]}"}

  /api/llm-usage-store/rows:
    post:
      tags: [Archive]
      summary: Store LLM usage rows (Oracle only); rows older than retention_days are deleted on write
      servers:
        - url: http://localhost:19002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows: {type: array, maxItems: 500, items: {type: object, description: "{at, module, use_case, chain?, step, provider?, model?, client?, session_id?, input_tokens, cached_tokens, output_tokens, context_window, duration_ms, cost_usd, cost_kind?, outcome, detail?}"}}
                retention_days: {type: integer, default: 90}
      responses:
        "200": {description: "{status, written, removed}"}
        "413": {description: More than 500 rows}
    get:
      tags: [Archive]
      summary: Latest single calls, newest first (real path GET /api/llm-usage-store/rows)
      servers:
        - url: http://localhost:19002
      parameters:
        - {name: session_id, in: query, schema: {type: string}}
        - {name: module, in: query, schema: {type: string}}
        - {name: use_case, in: query, schema: {type: string}}
        - {name: days, in: query, schema: {type: integer, default: 7}}
        - {name: limit, in: query, schema: {type: integer, default: 100}}
      responses:
        "200": {description: "{rows: [...]}"}

  /api/llm-usage-store/summary:
    get:
      tags: [Archive]
      summary: Sums of LLM usage rows grouped by module | session | usecase | model | step | day
      servers:
        - url: http://localhost:19002
      parameters:
        - {name: group, in: query, schema: {type: string, enum: [module, session, usecase, model, step, day], default: module}}
        - {name: days, in: query, schema: {type: integer, default: 7}}
        - {name: module, in: query, schema: {type: string}}
        - {name: session_id, in: query, schema: {type: string}}
        - {name: use_case, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 200}}
      responses:
        "200": {description: "{group, days, rows: [{<group keys>, calls, ok, errors, quota, fallbacks, input_tokens, cached_tokens, output_tokens, cost_usd, avg_duration_ms, max_input_tokens, context_window, first_at, last_at}]}"}
        "400": {description: Unknown group}

  /oracle/api/ui/documents:
    get:
      tags: [Oracle]
      summary: Documents kept for RAG, from Archive via Hub (real path /api/ui/documents; page Documenti)
      servers:
        - url: http://localhost:19004
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 100, maximum: 200}}
        - {name: domain, in: query, schema: {type: string}}
        - {name: permanent, in: query, schema: {type: boolean}}
      responses:
        "200": {description: "{status, count, documents: [{document_id, filename, title, summary, mime_type, file_size_bytes, domain, tags[], is_permanent, chunk_count, access_count, created_at, last_accessed_at}], domains}"}
        "502": {description: Archive not reachable}
    post:
      tags: [Oracle]
      summary: Add a file (base64 from the SDK upload helper); archived in background like a chat attachment
      servers:
        - url: http://localhost:19004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data_b64]
              properties:
                name: {type: string}
                mime: {type: string}
                data_b64: {type: string, description: "base64 (or data: URI)"}
      responses:
        "200": {description: "{status: ingesting, document_id, filename, mime_type, file_size_bytes}"}
        "400": {description: Empty or invalid base64}
        "413": {description: Larger than oracle.documents.max_archive_mb}
        "415": {description: Unsupported file type}

  /oracle/api/ui/documents/search:
    get:
      tags: [Oracle]
      summary: Semantic search over document passages, the same the chat uses (real path /api/ui/documents/search)
      servers:
        - url: http://localhost:19004
      parameters:
        - {name: query, in: query, required: true, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 8, maximum: 20}}
      responses:
        "200": {description: "{status, query, count, chunks: [{document_id, title, summary, chunk_text, chunk_index, distance, is_permanent, domain, tags}]}"}
        "400": {description: Empty query}

  /oracle/api/ui/documents/{document_id}/permanent:
    patch:
      tags: [Oracle]
      summary: Keep a document for good or make it temporary (real path /api/ui/documents/{id}/permanent)
      servers:
        - url: http://localhost:19004
      parameters:
        - {name: document_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [is_permanent], properties: {is_permanent: {type: boolean}}}
      responses:
        "200": {description: "{status, document_id, is_permanent}"}
        "404": {description: Document not found}

  /oracle/api/ui/documents/{document_id}:
    delete:
      tags: [Oracle]
      summary: Delete a document and its passages (real path /api/ui/documents/{id})
      servers:
        - url: http://localhost:19004
      parameters:
        - {name: document_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status: deleted, document_id}"}
        "404": {description: Document not found}

  /api/llm/code:
    post:
      tags: [Oracle]
      summary: Run a coding task with Claude Code inside a Forge worktree
      servers:
        - url: http://localhost:19004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workdir, prompt]
              properties:
                workdir: {type: string}
                prompt: {type: string}
                append_system_prompt: {type: string}
                max_turns: {type: integer, default: 40}
                timeout_seconds: {type: integer, default: 1800}
      responses:
        "200": {description: "{ok, summary, turns, cost_usd, subtype, log_tail, transcript_path}. Runs claude with --output-format stream-json; every line is written live to <worktree root>/.transcripts/<task folder>.jsonl (read by Hephaestus for the Sviluppo page)"}
        "400": {description: workdir outside the worktree root or empty prompt}
        "503": {description: Claude Code not installed / no token / worktrees not mounted}
        "504": {description: Timeout}

  /api/llm/chat:
    post:
      tags: [Oracle]
      summary: OpenAI-compatible chat completion along a use case's chain (tool calling supported)
      servers:
        - url: http://localhost:19004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                use_case: {type: string, default: forge.codice, description: "Declared use case (Forge: forge.codice, Wardrobe: wardrobe.foto)"}
                messages: {type: array, items: {type: object}}
                tools: {type: array, items: {type: object}}
                temperature: {type: number}
                max_tokens: {type: integer}
                tool_choice: {}
      responses:
        "200": {description: "Provider chat completion JSON + hestia_step {use_case, chain, step, provider, model}"}
        "400": {description: messages missing}
        "502": {description: "Every step failed (detail names the chain and each step)"}

  /api/chat/sessions:
    get:
      tags: [Archive]
      summary: Distinct chat session ids with messages since a datetime
      servers:
        - url: http://localhost:19002
      parameters:
        - {name: since, in: query, schema: {type: string, format: date-time}}
      responses:
        "200": {description: "{sessions: [string]}"}

  /api/agenda:
    get:
      tags: [Chronos]
      summary: Assistant agenda occurrences
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: days, in: query, schema: {type: integer, default: 7}}
        - {name: owner, in: query, schema: {type: string}}
        - {name: type, in: query, schema: {type: string, enum: [event, task, job, window]}}
        - {name: past_hours, in: query, schema: {type: integer, default: 0}}
        - {name: start, in: query, schema: {type: string, format: date-time}, description: "Range start (with end, replaces days)"}
        - {name: end, in: query, schema: {type: string, format: date-time}}
        - {name: include_done, in: query, schema: {type: boolean, default: false}}
      responses:
        "200": {description: "{from, days, count, occurrences[{item_id, key, type, owner, title, start, end, occurrence, skipped, moved, status, recurring, created_by, run:{ok, detail, at, duration_ms}|null}]} — run = result of that occurrence (Chronos per-occurrence run log, last 50 per item)"}

  /api/agenda/templates:
    get:
      tags: [Chronos]
      summary: What each module lets the user create (calendar wizard)
      servers:
        - url: http://localhost:19007
      responses:
        "200": {description: "{count, templates[{id, owner, label, description, icon, type, types[], fields{name:{type,label,description,enum,default,format,in}}, required[], title, duration_minutes, recurrence, action}]}"}
    post:
      tags: [Chronos]
      summary: Module declares its templates (replaces the owner's set; kept in memory, re-asserted hourly)
      servers:
        - url: http://localhost:19007
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [owner], properties: {owner: {type: string}, templates: {type: array, items: {type: object}}}}
      responses:
        "200": {description: "{status, count}"}

  /api/agenda/templates/{owner}/{template_id}/create:
    post:
      tags: [Chronos]
      summary: Create an agenda item from a module template (created_by=user, owner=module)
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: template_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_at]
              properties:
                values: {type: object, description: "Field values (in:path fields fill the action path)"}
                start_at: {type: string, format: date-time}
                end_at: {type: string, format: date-time, nullable: true}
                recurrence: {type: string, nullable: true, description: "RRULE for job/window"}
                type: {type: string, enum: [task, job, window, event]}
                description: {type: string}
      responses:
        "200": {description: "{status, item}"}
        "404": {description: "Template unknown (module offline / not registered yet)"}

  /api/agenda/items:
    get:
      tags: [Chronos]
      summary: Assistant agenda raw items
      servers:
        - url: http://localhost:19007
      responses:
        "200": {description: "{count, items[]}"}
    post:
      tags: [Chronos]
      summary: Create an assistant agenda item (on demand)
      servers:
        - url: http://localhost:19007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, start_at]
              properties:
                title: {type: string}
                type: {type: string, enum: [event, task, job, window]}
                owner: {type: string}
                start_at: {type: string}
                end_at: {type: string}
                recurrence: {type: string, description: RRULE}
                description: {type: string}
                action: {type: object, description: "{service, method, path, body, query, timeout_seconds}"}
                key: {type: string}
                params: {type: object}
                tz: {type: string}
                parent: {type: string, description: "key of a linked parent item: cancelling the parent cancels this one; this one failing (or being cancelled by the user) marks the parent"}
      responses:
        "200": {description: "{status, item}"}

  /api/agenda/register:
    post:
      tags: [Chronos]
      summary: Module default rules (idempotent by key, user edits preserved)
      servers:
        - url: http://localhost:19007
      responses:
        "200": {description: "{status, count, items}"}

  /api/agenda/retire:
    post:
      tags: [Chronos]
      summary: "A module cancels default rules it no longer declares (only rules it created; user items stay)"
      servers:
        - url: http://localhost:19007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [owner, keys]
              properties:
                owner: {type: string, example: scout}
                keys: {type: array, items: {type: string}, example: [scout.email_cycle]}
      responses:
        "200": {description: "{status, retired[keys]}"}

  /api/agenda/items/{ref}:
    patch:
      tags: [Chronos]
      summary: Move/change/pause an agenda item
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string}, description: id or key}
      responses:
        "200": {description: "{status, item}"}
    delete:
      tags: [Chronos]
      summary: Cancel an agenda item
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string}, description: id or key}
      responses:
        "200": {description: "{status, item}"}

  /api/agenda/items/{ref}/skip:
    post:
      tags: [Chronos]
      summary: Skip (dismiss) one occurrence
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string}, description: id or key}
      responses:
        "200": {description: "{status, item}"}

  /api/agenda/items/{ref}/unskip:
    post:
      tags: [Chronos]
      summary: Restore a skipped occurrence
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string}, description: id or key}
      responses:
        "200": {description: "{status, item}"}

  /api/agenda/items/{ref}/run:
    post:
      tags: [Chronos]
      summary: Execute the item's action now
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string}, description: id or key}
      responses:
        "200": {description: "{status, ok, detail, reactivated} — a working run of a rule stopped as failed puts it back on (recurring → confirmed, one-off → completed); paused stays paused"}

  /api/agenda/runs:
    get:
      tags: [Chronos]
      summary: Runs of the assistant agenda's jobs/tasks (WebUI plugin page Esecuzioni)
      description: |
        Every recorded run (`meta.runs`, last 50 per item) plus skipped past occurrences, newest first; summary and the
        rules registered per owner (module).
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: owner, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [ok, failed, skipped]}}
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {name: hours, in: query, schema: {type: number}, description: "alternative to since: last N hours"}
        - {name: limit, in: query, schema: {type: integer, default: 100, maximum: 500}}
      responses:
        "200": {description: "{count, runs: [{item_id, key, title, owner, type, item_status, status: ok|failed|skipped, at, occurrence, detail, by, duration_ms, manual, can_run}], summary{ok, failed, skipped, avg_ms, failed_items}, owners: [{owner, rules, active, paused, failed, user_modified, types{}}]}"}
        "400": {description: bad status or since}

  /api/agenda/runs/failed:
    get:
      tags: [Chronos]
      summary: Jobs whose last run failed — chips of the quick action «Riprova job» (POST /api/agenda/items/{id}/run)
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: hours, in: query, schema: {type: number, default: 24}}
      responses:
        "200": {description: "[{id (item key), item_id, label, owner, icon, state: late, status, at, detail, hint}]"}

  /api/agenda/logs:
    get:
      tags: [Chronos]
      summary: A module's logs around an occurrence (Agenda «Log del modulo»)
      description: |
        Chronos reads `{service}/api/logs` through Hub (the module's in-memory buffer, last 2000 lines) and keeps the
        lines within `at ± minutes`. Old occurrences may return nothing (`oldest` says how far the buffer goes).
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: service, in: query, required: true, schema: {type: string, pattern: "^[a-z0-9_-]{2,40}$"}}
        - {name: at, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: minutes, in: query, schema: {type: integer, default: 5, minimum: 1, maximum: 120}}
        - {name: level, in: query, schema: {type: string}}
        - {name: contains, in: query, schema: {type: string}}
      responses:
        "200": {description: "{service, from, to, count, oldest, logs: [{ts, level, message, ...}]}"}
        "400": {description: bad service or at}
        "502": {description: module unreachable}

  /chronos/api/ui/manifest:
    get:
      tags: [Chronos]
      summary: WebUI plugin manifest (real path /api/ui/manifest; kind core, api_prefix /api/agenda/)
      description: |
        Pages `agenda` «Agenda di Hestia» (chronos-agenda, order 150; WebUI /calendar redirects here) and `esecuzioni`
        (chronos-runs, order 151, parent agenda), widget `falliti` «Job falliti» (chronos-failed-widget, auto),
        quick action `riprova` «Riprova job» (source /api/agenda/runs/failed). Bundle file at /ui/webui/chronos.js.
      servers:
        - url: http://localhost:19007
      responses:
        "200": {description: "{module: chronos, title, icon, color, description, kind: core, clients.webui{entry, api_prefix, page[], widget[], quick_action[]}, version}"}

  /api/agenda/items/{ref}/links:
    get:
      tags: [Chronos]
      summary: Linked items (parent + children)
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string}, description: id or key}
      responses:
        "200": {description: "{status, key, parent (item|null), children[]}"}

  /api/agenda/items/{ref}/link:
    post:
      tags: [Chronos]
      summary: Link an item to a parent (cascade cancel / error propagation); empty parent unlinks
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string}, description: id or key}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parent: {type: string, nullable: true}
                by: {type: string, default: user}
      responses:
        "200": {description: "{status, item}"}
        "400": {description: link would create a cycle}
        "404": {description: item or parent not found}

  /api/agenda/items/{ref}/fail:
    post:
      tags: [Chronos]
      summary: A module reports that the work behind the item failed (status failed, parent marked)
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string}, description: id or key}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                detail: {type: string}
                by: {type: string, default: module}
      responses:
        "200": {description: "{status, item}"}

  /api/agenda/parse:
    post:
      tags: [Chronos]
      summary: Natural-language quick add ("domani alle 15 dentista") → draft fields (nothing is created)
      description: Oracle /api/llm/generate extracts the fields; Chronos validates dates and RRULE.
      servers:
        - url: http://localhost:19007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string}
                tz: {type: string, description: IANA zone of the user (default the container TZ)}
      responses:
        "200": {description: "{status, draft: {title, type, start_at, end_at, recurrence, description}}"}
        "400": {description: text too short}
        "502": {description: Oracle answer not usable}
        "503": {description: Oracle unreachable}

  /api/agenda/ics:
    get:
      tags: [Chronos]
      summary: Read-only iCalendar feed of the assistant agenda (expanded occurrences)
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: days, in: query, schema: {type: integer, default: 60, maximum: 400}}
        - {name: past_days, in: query, schema: {type: integer, default: 7, maximum: 90}}
        - {name: owner, in: query, schema: {type: string}}
        - {name: types, in: query, schema: {type: string, default: "event,task,window"}, description: comma list (add job for periodic jobs)}
      responses:
        "200":
          description: "text/calendar (through Hub it arrives as {raw: ...})"
          content:
            text/calendar: {schema: {type: string}}

  /api/agenda/windows/{key}:
    get:
      tags: [Chronos]
      summary: Is a window open now?
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, key, exists, active, until, skipped_now, next_open, params}"}

  /api/presence:
    get:
      tags: [Chronos — Presence]
      summary: Assistant state (base + overlays, label, effects, last interaction, activities)
      description: "SPEC docs/work/2026-10-10-assistant-presence. Consumers read `effects` (work.light, work.heavy, llm.claude, notify.level, chat.style, chat.notice), never state names."
      servers:
        - url: http://localhost:19007
      responses:
        "200": {description: "{base, base_label, emoji, icon, tone, help, overlays[{key,label,emoji,icon,tone}], label, effects{}, decided_by{}, enabled, show_in_chat, since, changed_at, reason, last_interaction_at, last_interaction_client, last_interaction_kind, idle_minutes, dnd_until, dnd_minutes, activities[], evaluated_at}"}

  /api/presence/ping:
    post:
      tags: [Chronos — Presence]
      summary: The user interacted (chat | command | ui); clients debounce
      servers:
        - url: http://localhost:19007
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {client: {type: string}, kind: {type: string, enum: [chat, command, ui]}}}
      responses:
        "200": {description: current state}

  /api/presence/activity:
    post:
      tags: [Chronos — Presence]
      summary: A module starts an activity (busy/eating overlays); expires after ttl_seconds
      servers:
        - url: http://localhost:19007
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: {type: string}
                label: {type: string}
                load: {type: string, enum: [light, heavy]}
                resource: {type: string, description: "gpu | claude_quota | cpu"}
                kind: {type: string, enum: [work, maintenance]}
                module: {type: string}
                ttl_seconds: {type: number, default: 3600}
      responses:
        "200": {description: current state}

  /api/presence/activity/{key}:
    delete:
      tags: [Chronos — Presence]
      summary: The activity ended
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: current state}

  /api/presence/signals/{key}:
    put:
      tags: [Chronos — Presence]
      summary: Report a fact (e.g. resource.claude_quota_left, health.degraded_services); derived signals are refused
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {value: {}, meta: {type: object}, ttl_seconds: {type: number}}}
      responses:
        "200": {description: current state}
        "400": {description: derived or invalid signal}
    delete:
      tags: [Chronos — Presence]
      summary: Remove a fact
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: current state}

  /api/presence/dnd:
    post:
      tags: [Chronos — Presence]
      summary: Non disturbare on (minutes or until; empty = chronos.presence.dnd_default_duration). MCP tool `nondisturbare`
      servers:
        - url: http://localhost:19007
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {minutes: {type: number}, until: {type: string, format: date-time}}}
      responses:
        "200": {description: current state}
    delete:
      tags: [Chronos — Presence]
      summary: Non disturbare off. MCP tool `disturbami`
      servers:
        - url: http://localhost:19007
      responses:
        "200": {description: current state}

  /api/presence/states:
    get:
      tags: [Chronos — Presence]
      summary: Effective state definitions (built-in + module-declared + setting chronos.presence.states), core keys and effect orders
      servers:
        - url: http://localhost:19007
      responses:
        "200": {description: "{setting, core[], effects{}, states{key: {kind, priority, label, emoji, icon, tone, when, effects, notice?, core?}}}"}

  /api/presence/states/register:
    post:
      tags: [Chronos — Presence]
      summary: A module declares its own states (in memory, re-asserted by the module)
      servers:
        - url: http://localhost:19007
      requestBody:
        content:
          application/json:
            schema: {type: object, required: [owner], properties: {owner: {type: string}, states: {type: object}}}
      responses:
        "200": {description: "{status, owner, count}"}

  /api/presence/history:
    get:
      tags: [Chronos — Presence]
      summary: Last state changes
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 50}}
      responses:
        "200": {description: "{count, items[{base, overlays, label, reason, from, from_label, at}]}"}

  /api/activity:
    get:
      tags: [Oracle]
      summary: Last real user chat activity in this Oracle process (legacy alias; the shared state is Chronos /api/presence, Athena falls back here only when Chronos is down)
      servers:
        - url: http://localhost:19004
      responses:
        "200": {description: "{last_user_activity_ts, idle_seconds}"}

  /api/sessions:
    get:
      tags: [Oracle]
      summary: Return global Oracle state (Plan P3c-11)
      servers:
        - url: http://localhost:19004
      responses:
        "200":
          description: >
            {service, models: {generic, reasoning, code},
             hub_url, uptime_seconds}

  /api/tasks:
    get:
      tags: [Oracle]
      summary: List Oracle background task lifecycle records
      servers:
        - url: http://localhost:19004
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: task_type
          in: query
          schema:
            type: string
            example: oracle.compaction
        - name: lifecycle_state
          in: query
          schema:
            type: string
            enum: [queued, running, succeeded, failed, canceled]
      responses:
        "200":
          description: "{count, tasks[]}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/TaskLifecycleRecord"

  /api/tasks/{task_id}:
    get:
      tags: [Oracle]
      summary: Get one Oracle background task lifecycle record
      servers:
        - url: http://localhost:19004
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "{task}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/TaskLifecycleRecord"
        "404":
          description: task not found

  /api/actions/approval/respond:
    post:
      tags: [Oracle]
      summary: Approve or cancel a pending high-impact action
      servers:
        - url: http://localhost:19004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionApprovalResponseRequest"
      responses:
        "200":
          description: Approval response result
        "400":
          description: Invalid payload
        "404":
          description: Approval token not found or expired

  /api/athena/hints:
    post:
      tags: [Oracle]
      summary: Ingest advisory hints emitted by Athena
      servers:
        - url: http://localhost:19004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AthenaHintIngestRequest"
      responses:
        "200":
          description: "{status, stored, hint}"
    get:
      tags: [Oracle]
      summary: List currently active Athena advisory hints in Oracle
      servers:
        - url: http://localhost:19004
      parameters:
        - name: session_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 200
      responses:
        "200":
          description: "{count, hints[]}"

  # ══════════════════════════════════════════════════════════════════════════
  #  HERMES — 19005
  # ══════════════════════════════════════════════════════════════════════════

  /hermes/health:
    get:
      tags: [Hermes]
      summary: Hermes health check
      servers:
        - url: http://localhost:19005
      responses:
        "200":
          description: OK

  /api/events/ingest:
    post:
      tags: [Hermes]
      summary: Ingest a domain event — matches subscriptions and dispatches notifications
      servers:
        - url: http://localhost:19005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HermesEventRequest"
      responses:
        "200":
          description: "{status: ok, result: {subscriptions_matched, deliveries, ...}}"

  /api/dispatch/send:
    post:
      tags: [Hermes]
      summary: Direct notification (legacy) — owner → every client; concrete target on a named client → that client
      servers:
        - url: http://localhost:19005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchSendRequest"
      responses:
        "200":
          description: "{success, detail}"

  /api/notifications:
    get:
      tags: [Hermes]
      summary: Notification inbox (global, every client)
      servers:
        - url: http://localhost:19005
      parameters:
        - { name: filter, in: query, schema: { type: string, enum: [all, unread, pending], default: all } }
        - { name: source, in: query, schema: { type: string } }
        - { name: before, in: query, description: created_at cursor, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: client, in: query, description: asking client (computes other_client), schema: { type: string } }
      responses:
        "200":
          description: "{items: HermesNotification[], counts: {unread, pending}}"

  /api/notifications/counts:
    get:
      tags: [Hermes]
      summary: Unread / pending counters
      servers:
        - url: http://localhost:19005
      responses:
        "200":
          description: "{unread, pending}"

  /api/notifications/clients:
    get:
      tags: [Hermes]
      summary: Discovered delivery clients (Hub layer:client + capabilities.notify_endpoint)
      servers:
        - url: http://localhost:19005
      responses:
        "200":
          description: "{clients: [name]}"

  /hermes/api/ui/manifest:
    get:
      tags: [Hermes]
      summary: WebUI plugin manifest (real path /api/ui/manifest; kind core, api_prefix /api/ui/)
      description: |
        Plugin contract (docs/work/2026-10-17-client-plugins/SPEC.md §4): page `notifiche` (hermes-inbox, order 140,
        badge {source: /api/ui/inbox/counts, field: unread}), sub-page `consegne` (hermes-deliveries, order 141),
        widget `oggi` «Consegne oggi» (hermes-today-widget, auto). Bundle file at /ui/webui/hermes.js.
      servers:
        - url: http://localhost:19005
      responses:
        "200": {description: "{module: hermes, title, icon, color, description, kind: core, clients.webui{entry, api_prefix, page[], widget[], quick_action[]}, version}"}

  /hermes/api/ui/deliveries:
    get:
      tags: [Hermes]
      summary: Delivery log (real path /api/ui/deliveries) — page Consegne, widget Consegne oggi
      description: |
        Notifications newest first with their state on every client and what happened to them: held by presence
        (and released in the digest), quiet (inbox copy only), retracted from a chat, superseded (repeat chain),
        answer. Message preview only (HTML stripped), never the event payload. 502 when Archive is unavailable.
      servers:
        - url: http://localhost:19005
      parameters:
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {name: before, in: query, schema: {type: string, format: date-time}, description: "page cursor (next_before)"}
        - {name: limit, in: query, schema: {type: integer, default: 50, maximum: 200}}
        - {name: flag, in: query, schema: {type: string, enum: [held, quiet, retracted, failed, answered, superseded, pending]}}
        - {name: client, in: query, schema: {type: string}, description: "only rows delivered (any state) to this client"}
        - {name: source, in: query, schema: {type: string}}
      responses:
        "200": {description: "{items: [{id, created_at, updated_at, state, title, preview, level, source, event_type, audience, origin_client, actions[], clients{<name>: {state: delivered|skipped|failed|dead, at, attempts, retracted, detail}}, answer{by, action_id, label, status, outcome_text, at}, seen{by, at}, repeat{count, skipped}, flags{held, held_released, quiet, retracted, failed, answered, superseded, pending}}], summary{total, held, quiet, retracted, failed, answered, superseded, pending, clients{<name>: {delivered, skipped, failed}}}, next_before}"}
        "400": {description: bad flag or date}
        "502": {description: Archive unavailable}

  /hermes/api/ui/subscriptions:
    get:
      tags: [Hermes]
      summary: Active subscriptions (real path /api/ui/subscriptions) — page Consegne
      servers:
        - url: http://localhost:19005
      responses:
        "200": {description: "{count, subscriptions: [{subscription_id, owner, domain, event_type, filters{}, channels[{type, client?}], updated_at}]}"}
        "502": {description: Archive unavailable}

  /hermes/api/ui/clients:
    get:
      tags: [Hermes]
      summary: Clients Hermes delivers to now (real path /api/ui/clients; same as /api/notifications/clients)
      servers:
        - url: http://localhost:19005
      responses:
        "200": {description: "{clients: [name]}"}

  /hermes/api/ui/inbox:
    get:
      tags: [Hermes]
      summary: Inbox for the plugin page Notifiche (real path /api/ui/inbox; same as GET /api/notifications, client webui)
      servers:
        - url: http://localhost:19005
      parameters:
        - { name: filter, in: query, schema: { type: string, enum: [all, unread, pending], default: all } }
        - { name: source, in: query, schema: { type: string } }
        - { name: before, in: query, description: created_at cursor, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, default: 40, maximum: 200 } }
        - { name: client, in: query, schema: { type: string, default: webui } }
      responses:
        "200":
          description: "{items: HermesNotification[], counts: {unread, pending}}"

  /hermes/api/ui/inbox/counts:
    get:
      tags: [Hermes]
      summary: Unread / pending counters (real path /api/ui/inbox/counts) — sidebar badge of Notifiche
      servers:
        - url: http://localhost:19005
      parameters:
        - { name: client, in: query, schema: { type: string, default: webui } }
      responses:
        "200":
          description: "{unread, pending}"

  /hermes/api/ui/inbox/seen-all:
    post:
      tags: [Hermes]
      summary: Mark every unread notification seen (real path /api/ui/inbox/seen-all; client webui)
      servers:
        - url: http://localhost:19005
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { client: { type: string, default: webui } } }
      responses:
        "200":
          description: "{status: ok, changed}"

  /hermes/api/ui/inbox/{notification_id}/seen:
    post:
      tags: [Hermes]
      summary: Mark one notification seen everywhere (real path /api/ui/inbox/{id}/seen; client webui)
      servers:
        - url: http://localhost:19005
      parameters:
        - { name: notification_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, properties: { client: { type: string, default: webui } } }
      responses:
        "200":
          description: "{status: ok, changed}"

  /hermes/api/ui/inbox/{notification_id}/answer:
    post:
      tags: [Hermes]
      summary: Answer with one of the notification's buttons (real path /api/ui/inbox/{id}/answer; first answer wins)
      servers:
        - url: http://localhost:19005
      parameters:
        - { name: notification_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action_id]
              properties:
                action_id: { type: string }
                client: { type: string, default: webui }
      responses:
        "200":
          description: "{status, answer{action_id, label, by, at, status, outcome_text}}"
        "404":
          description: not_found / unknown_action
        "409":
          description: "already_handled, with the winning answer"

  /api/notifications/seen-all:
    post:
      tags: [Hermes]
      summary: Mark every unread notification seen (optionally only those delivered to one client)
      servers:
        - url: http://localhost:19005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client]
              properties: { client: { type: string }, delivered_to: { type: string } }
      responses:
        "200":
          description: "{status, changed}"

  /api/notifications/release-held:
    post:
      tags: [Hermes]
      summary: Presence opened the notification level again — publish one digest of the held (inbox-only) notifications
      servers:
        - url: http://localhost:19005
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {level: {type: string, enum: [all, important, urgent]}}}
      responses:
        "200":
          description: "{released, digest}"

  /api/notifications/retract-stale:
    post:
      tags: [Hermes]
      summary: Agenda job — ask clients to drop handled messages older than the retract delay (Telegram ≤ 47 h)
      servers:
        - url: http://localhost:19005
      responses:
        "200":
          description: "{retracted}"

  /api/notifications/{notification_id}/seen:
    post:
      tags: [Hermes]
      summary: Mark seen (global read state; the other clients get an update)
      servers:
        - url: http://localhost:19005
      parameters:
        - { name: notification_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [client], properties: { client: { type: string } } }
      responses:
        "200":
          description: "{status, changed}"

  /api/notifications/{notification_id}/answer:
    post:
      tags: [Hermes]
      summary: Answer with one action — first answer wins; routed to the module that asked
      servers:
        - url: http://localhost:19005
      parameters:
        - { name: notification_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action_id, client]
              properties: { action_id: { type: string }, client: { type: string } }
      responses:
        "200":
          description: "{status: done, answer} or {status: claimed, execute: command, command} (legacy action)"
        "409":
          description: "{status: already_handled, answer}"
        "502":
          description: Module failed; the claim is released so the user can retry

  /api/notifications/{notification_id}/answer/outcome:
    post:
      tags: [Hermes]
      summary: Outcome of a legacy command action executed by the answering client
      servers:
        - url: http://localhost:19005
      parameters:
        - { name: notification_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client]
              properties: { client: { type: string }, ok: { type: boolean }, text: { type: string } }
      responses:
        "200":
          description: "{status}"

  /api/notify:
    post:
      tags: [Clients]
      summary: Client delivery endpoint (Telegram, WebUI) — Hermes via Hub only
      description: Declared by each client as capabilities.notify_endpoint. WebUI accepts it from the internal network only.
      servers:
        - url: http://localhost:19006
        - url: http://localhost:19015
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientNotifyRequest"
      responses:
        "200":
          description: "{delivered, ref?} · {delivered: false, skipped: true} (silent on Telegram)"

  /api/chat-queue/drain:
    post:
      tags: [Clients]
      summary: Answer the chat messages queued while Oracle was offline — Chronos via Hub only
      description: Declared by each chat client as capabilities.chat_queue_drain; Chronos calls it when the presence effect chat.reply goes back to live. Runs in the background. WebUI accepts it from the internal network only. SPEC docs/work/2026-10-19-oracle-offline.
      servers:
        - url: http://localhost:19006
        - url: http://localhost:19015
      responses:
        "202": {description: "{status: started | busy}"}

  /api/outbound-events/state:
    post:
      tags: [Hermes]
      summary: Update lifecycle state for a tracked outbound event
      servers:
        - url: http://localhost:19005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outbound_event_id, lifecycle_state]
              properties:
                outbound_event_id:
                  type: string
                lifecycle_state:
                  type: string
                  enum:
                    [
                      created,
                      queued,
                      delivered,
                      seen,
                      answered,
                      dismissed,
                      superseded,
                      failed,
                    ]
                detail:
                  type: string
                superseded_by:
                  type: string
      responses:
        "200":
          description: "{status, updated}"

  # ══════════════════════════════════════════════════════════════════════════
  #  SCOUT — 19006
  #  Note: expose port 19006 in docker-compose.global.yml to test locally
  # ══════════════════════════════════════════════════════════════════════════

  /scout/health:
    get:
      tags: [Scout]
      summary: Scout health check
      servers:
        - url: http://localhost:19006
      responses:
        "200":
          description: OK

  /api/module-tools/domains:
    get:
      tags: [Scout]
      summary: List domains served by Scout module tools
      servers:
