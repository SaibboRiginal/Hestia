  /api/route/{service_name}/{path}:
    parameters:
      - name: service_name
        in: path
        required: true
        schema:
          type: string
        description: |
          Service name, comma-separated list, or ``*`` wildcard.

          | Value | Mode | Example |
          |-------|------|---------|
          | ``oracle`` | Unicast | Route to oracle only |
          | ``oracle,argus`` | Multicast | Route to oracle AND argus |
          | ``*`` | Broadcast | Route to ALL registered services |

          Broadcast/multicast returns an aggregated envelope:
          ``{"service": "*", "count": N, "ok": N, "results": [...]}``.
          Unicast returns the target's payload directly (backward-compatible).
      - name: path
        in: path
        required: true
        schema:
          type: string
        example: api/logs/level
    get:
      tags: [Hub]
      summary: Route a GET request (unicast, multicast, or broadcast)
      description: |
        Use ``service_name=*`` to broadcast to all services.
        Use ``service_name=oracle,argus`` for multicast.
      servers:
        - url: http://localhost:19001
      parameters:
        - name: service_name
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Aggregated results (multicast/broadcast) or direct payload (unicast)
    post:
      tags: [Hub]
      summary: Route a request to a registered service (unicast, multicast, or broadcast)
      description: |
        Use ``service_name=*`` to broadcast to all services (e.g. set all log levels at once).
        Use ``service_name=oracle,argus`` for multicast to specific services.
      servers:
        - url: http://localhost:19001
      parameters:
        - name: service_name
          in: path
          required: true
          schema:
            type: string
          example: archive
        - name: path
          in: path
          required: true
          schema:
            type: string
          example: api/entities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteRequest"
      responses:
        "200":
          description: Proxied response from the target service, or aggregated envelope for broadcast/multicast

