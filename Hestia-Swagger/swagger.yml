  /api/logs:
    get:
      tags: [Hub]
      summary: Retrieve buffered runtime logs (service-local endpoint)
      description: |
        Implemented in all runtime services.
        Current instances:
        - Hub (19001)
        - Archive (19002)
        - Hecate (19003)
        - Oracle (19004)
        - Hermes (19005)
        - Scout (19006)
        - Chronos (19007)
        - Argus (19008)
        - Athena (19009)
        - Hephaestus (19010)
        - Telegram control API (internal: hestia_telegram:8010)

        Sensitive values (tokens, passwords, secrets, credential URLs, auth headers)
        are redacted before entries are buffered and returned.

        Use query filters to keep output dense and useful for troubleshooting.
      servers:
        - url: http://localhost:19001
          description: Hub
        - url: http://localhost:19002
          description: Archive
        - url: http://localhost:19003
          description: Hecate
        - url: http://localhost:19012
          description: Iris
        - url: http://localhost:19004
          description: Oracle
        - url: http://localhost:19005
          description: Hermes
        - url: http://localhost:19006
          description: Scout
        - url: http://localhost:19007
          description: Chronos
        - url: http://localhost:19008
          description: Argus
        - url: http://localhost:19009
          description: Athena
        - url: http://localhost:19010
          description: Hephaestus
        - url: http://hestia_telegram:8010
          description: Telegram control API (Docker network)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
            maximum: 2000
        - name: level
          in: query
          schema:
            type: string
            example: INFO
        - name: contains
          in: query
          schema:
            type: string
            example: outbound_event_id=p2-4-smoke-3
      responses:
        "200":
          description: "{service, count, logs[]}"

  /api/logs/level:
    get:
      tags: [Meta]
      summary: Get current runtime log level (per-service)
      description: |
        Returns the effective log level for this service instance.
        Available on every FastAPI-based Hestia service.
        Levels: TRACE (5), DEBUG (10), INFO (20), WARNING (30), ERROR (40), CRITICAL (50).
      servers:
        - url: http://localhost:19001
          description: Hub
        - url: http://localhost:19002
          description: Archive
        - url: http://localhost:19003
          description: Hecate
        - url: http://localhost:19004
          description: Oracle
        - url: http://localhost:19005
          description: Hermes
        - url: http://localhost:19006
          description: Scout
        - url: http://localhost:19007
          description: Chronos
        - url: http://localhost:19008
          description: Argus
        - url: http://localhost:19009
          description: Athena
        - url: http://localhost:19010
          description: Hephaestus
        - url: http://localhost:19012
          description: Iris
        - url: http://localhost:19013
          description: MCP
        - url: http://localhost:19014
          description: Metis
      responses:
        "200":
          description: |
            {
              "service": "hestia_oracle",
              "level": "INFO"
            }
    post:
      tags: [Meta]
      summary: Set runtime log level (per-service, no restart)
      description: |
        Change the log level for this service instance at runtime.
        No container restart required.  Takes effect immediately.
        Request body: {"level": "DEBUG"}
      servers:
        - url: http://localhost:19001
          description: Hub
        - url: http://localhost:19002
          description: Archive
        - url: http://localhost:19003
          description: Hecate
        - url: http://localhost:19004
          description: Oracle
        - url: http://localhost:19005
          description: Hermes
        - url: http://localhost:19006
          description: Scout
        - url: http://localhost:19007
          description: Chronos
        - url: http://localhost:19008
          description: Argus
        - url: http://localhost:19009
          description: Athena
        - url: http://localhost:19010
          description: Hephaestus
        - url: http://localhost:19012
          description: Iris
        - url: http://localhost:19013
          description: MCP
        - url: http://localhost:19014
          description: Metis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [level]
              properties:
                level:
                  type: string
                  enum: [TRACE, DEBUG, INFO, WARNING, ERROR, CRITICAL]
                  example: DEBUG
      responses:
        "200":
          description: |
            {
              "service": "hestia_oracle",
              "level": "DEBUG"
            }
        "400":
          description: Unknown log level

  /api/monitor/logs/{service_name}:
    get:
      tags: [Hub]
      summary: Retrieve logs for a registered service through Hub monitoring proxy
      description: |
        Supports multiple output modes:
        - raw: original proxied payload
        - text/transcribe: flattened plain-text log stream
        - ai/analyze/summary: Oracle-formatted analysis, with text fallback
      servers:
