    delete:
      tags: [Oracle]
      summary: Clear Oracle in-memory session state
      servers:
        - url: http://localhost:19004
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "{status, session_id}"

  /api/chat/context:
    get:
      tags: [Oracle]
      summary: Return context-window usage stats for a session (Plan P2-4c)
      servers:
        - url: http://localhost:19004
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            {session_id, context_window, history_messages, history_chars,
             history_tokens_est, tool_count, preference_count,
             total_tokens_est, context_used_pct, compaction_available}

  /api/chat/compact:
    post:
      tags: [Oracle]
      summary: Force-compact conversation history via LLM summarisation (Plan P2-6)
      servers:
        - url: http://localhost:19004
      parameters:
        - name: session_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >
            {session_id, before_tokens, after_tokens, messages_before,
             messages_after, summary_chars}

  /api/llm/profiles:
    get:
      tags: [Oracle]
      summary: LLM profiles served by Oracle (no secrets)
      servers:
        - url: http://localhost:19004
      parameters:
        - {name: check, in: query, schema: {type: boolean, default: true}}
      responses:
        "200": {description: "{status, profiles{name: {model, base_url, available, detail}}}"}

  /api/llm/code/status:
    get:
      tags: [Oracle]
      summary: Claude Code (code use case) readiness
      servers:
        - url: http://localhost:19004
      responses:
        "200": {description: "{status, available, detail, model}"}

  /api/llm/code:
    post:
      tags: [Oracle]
      summary: Run a coding task with Claude Code inside a Forge worktree
      servers:
        - url: http://localhost:19004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workdir, prompt]
              properties:
                workdir: {type: string}
                prompt: {type: string}
                append_system_prompt: {type: string}
                max_turns: {type: integer, default: 40}
                timeout_seconds: {type: integer, default: 1800}
      responses:
        "200": {description: "{ok, summary, turns, cost_usd, subtype, log_tail, transcript_path}. Runs claude with --output-format stream-json; every line is written live to <worktree root>/.transcripts/<task folder>.jsonl (read by Hephaestus for the Sviluppo page)"}
        "400": {description: workdir outside the worktree root or empty prompt}
        "503": {description: Claude Code not installed / no token / worktrees not mounted}
        "504": {description: Timeout}

  /api/llm/chat:
    post:
      tags: [Oracle]
      summary: OpenAI-compatible chat completion on a named profile (tool calling supported)
      servers:
        - url: http://localhost:19004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                profile: {type: string, default: local}
                messages: {type: array, items: {type: object}}
                tools: {type: array, items: {type: object}}
                temperature: {type: number}
                model: {type: string}
      responses:
        "200": {description: Provider chat completion JSON}
        "404": {description: Profile not configured}
        "502": {description: Provider error/unreachable}

  /api/chat/sessions:
    get:
      tags: [Archive]
      summary: Distinct chat session ids with messages since a datetime
      servers:
        - url: http://localhost:19002
      parameters:
        - {name: since, in: query, schema: {type: string, format: date-time}}
      responses:
        "200": {description: "{sessions: [string]}"}

  /api/agenda:
    get:
      tags: [Chronos]
      summary: Assistant agenda occurrences
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: days, in: query, schema: {type: integer, default: 7}}
        - {name: owner, in: query, schema: {type: string}}
        - {name: type, in: query, schema: {type: string, enum: [event, task, job, window]}}
        - {name: past_hours, in: query, schema: {type: integer, default: 0}}
        - {name: start, in: query, schema: {type: string, format: date-time}, description: "Range start (with end, replaces days)"}
        - {name: end, in: query, schema: {type: string, format: date-time}}
        - {name: include_done, in: query, schema: {type: boolean, default: false}}
      responses:
        "200": {description: "{from, days, count, occurrences[{item_id, key, type, owner, title, start, end, occurrence, skipped, moved, status, recurring, created_by, run:{ok, detail, at, duration_ms}|null}]} — run = result of that occurrence (Chronos per-occurrence run log, last 50 per item)"}

  /api/agenda/templates:
    get:
      tags: [Chronos]
      summary: What each module lets the user create (calendar wizard)
      servers:
        - url: http://localhost:19007
      responses:
        "200": {description: "{count, templates[{id, owner, label, description, icon, type, types[], fields{name:{type,label,description,enum,default,format,in}}, required[], title, duration_minutes, recurrence, action}]}"}
    post:
      tags: [Chronos]
      summary: Module declares its templates (replaces the owner's set; kept in memory, re-asserted hourly)
      servers:
        - url: http://localhost:19007
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [owner], properties: {owner: {type: string}, templates: {type: array, items: {type: object}}}}
      responses:
        "200": {description: "{status, count}"}

  /api/agenda/templates/{owner}/{template_id}/create:
    post:
      tags: [Chronos]
      summary: Create an agenda item from a module template (created_by=user, owner=module)
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: owner, in: path, required: true, schema: {type: string}}
        - {name: template_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_at]
              properties:
                values: {type: object, description: "Field values (in:path fields fill the action path)"}
                start_at: {type: string, format: date-time}
                end_at: {type: string, format: date-time, nullable: true}
                recurrence: {type: string, nullable: true, description: "RRULE for job/window"}
                type: {type: string, enum: [task, job, window, event]}
                description: {type: string}
      responses:
        "200": {description: "{status, item}"}
        "404": {description: "Template unknown (module offline / not registered yet)"}

  /api/agenda/items:
    get:
      tags: [Chronos]
      summary: Assistant agenda raw items
      servers:
        - url: http://localhost:19007
      responses:
        "200": {description: "{count, items[]}"}
    post:
      tags: [Chronos]
      summary: Create an assistant agenda item (on demand)
      servers:
        - url: http://localhost:19007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, start_at]
              properties:
                title: {type: string}
                type: {type: string, enum: [event, task, job, window]}
                owner: {type: string}
                start_at: {type: string}
                end_at: {type: string}
                recurrence: {type: string, description: RRULE}
                description: {type: string}
                action: {type: object, description: "{service, method, path, body, query, timeout_seconds}"}
                key: {type: string}
                params: {type: object}
                tz: {type: string}
                parent: {type: string, description: "key of a linked parent item: cancelling the parent cancels this one; this one failing (or being cancelled by the user) marks the parent"}
      responses:
        "200": {description: "{status, item}"}

  /api/agenda/register:
    post:
      tags: [Chronos]
      summary: Module default rules (idempotent by key, user edits preserved)
      servers:
        - url: http://localhost:19007
      responses:
        "200": {description: "{status, count, items}"}

  /api/agenda/items/{ref}:
    patch:
      tags: [Chronos]
      summary: Move/change/pause an agenda item
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string}, description: id or key}
      responses:
        "200": {description: "{status, item}"}
    delete:
      tags: [Chronos]
      summary: Cancel an agenda item
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string}, description: id or key}
      responses:
        "200": {description: "{status, item}"}

  /api/agenda/items/{ref}/skip:
    post:
      tags: [Chronos]
      summary: Skip (dismiss) one occurrence
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string}, description: id or key}
      responses:
        "200": {description: "{status, item}"}

  /api/agenda/items/{ref}/unskip:
    post:
      tags: [Chronos]
      summary: Restore a skipped occurrence
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string}, description: id or key}
      responses:
        "200": {description: "{status, item}"}

  /api/agenda/items/{ref}/run:
    post:
      tags: [Chronos]
      summary: Execute the item's action now
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string}, description: id or key}
      responses:
        "200": {description: "{status, ok, detail}"}

  /api/agenda/items/{ref}/links:
    get:
      tags: [Chronos]
      summary: Linked items (parent + children)
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string}, description: id or key}
      responses:
        "200": {description: "{status, key, parent (item|null), children[]}"}

  /api/agenda/items/{ref}/link:
    post:
      tags: [Chronos]
      summary: Link an item to a parent (cascade cancel / error propagation); empty parent unlinks
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string}, description: id or key}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parent: {type: string, nullable: true}
                by: {type: string, default: user}
      responses:
        "200": {description: "{status, item}"}
        "400": {description: link would create a cycle}
        "404": {description: item or parent not found}

  /api/agenda/items/{ref}/fail:
    post:
      tags: [Chronos]
      summary: A module reports that the work behind the item failed (status failed, parent marked)
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: ref, in: path, required: true, schema: {type: string}, description: id or key}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                detail: {type: string}
                by: {type: string, default: module}
      responses:
        "200": {description: "{status, item}"}

  /api/agenda/parse:
    post:
      tags: [Chronos]
      summary: Natural-language quick add ("domani alle 15 dentista") → draft fields (nothing is created)
      description: Oracle /api/llm/generate extracts the fields; Chronos validates dates and RRULE.
      servers:
        - url: http://localhost:19007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string}
                tz: {type: string, description: IANA zone of the user (default CHRONOS_DISPLAY_TZ)}
      responses:
        "200": {description: "{status, draft: {title, type, start_at, end_at, recurrence, description}}"}
        "400": {description: text too short}
        "502": {description: Oracle answer not usable}
        "503": {description: Oracle unreachable}

  /api/agenda/ics:
    get:
      tags: [Chronos]
      summary: Read-only iCalendar feed of the assistant agenda (expanded occurrences)
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: days, in: query, schema: {type: integer, default: 60, maximum: 400}}
        - {name: past_days, in: query, schema: {type: integer, default: 7, maximum: 90}}
        - {name: owner, in: query, schema: {type: string}}
        - {name: types, in: query, schema: {type: string, default: "event,task,window"}, description: comma list (add job for periodic jobs)}
      responses:
        "200":
          description: "text/calendar (through Hub it arrives as {raw: ...})"
          content:
            text/calendar: {schema: {type: string}}

  /api/agenda/windows/{key}:
    get:
      tags: [Chronos]
      summary: Is a window open now?
      servers:
        - url: http://localhost:19007
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, key, exists, active, until, skipped_now, next_open, params}"}

  /api/activity:
    get:
      tags: [Oracle]
      summary: Last real user chat activity (idle signal for Athena)
      servers:
        - url: http://localhost:19004
      responses:
        "200": {description: "{last_user_activity_ts, idle_seconds}"}

  /api/sessions:
    get:
      tags: [Oracle]
      summary: Return global Oracle state (Plan P3c-11)
      servers:
        - url: http://localhost:19004
      responses:
        "200":
          description: >
            {service, models: {generic, reasoning, code},
             hub_url, uptime_seconds}

  /api/tasks:
    get:
      tags: [Oracle]
      summary: List Oracle background task lifecycle records
      servers:
        - url: http://localhost:19004
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: task_type
          in: query
          schema:
            type: string
            example: oracle.compaction
        - name: lifecycle_state
          in: query
          schema:
            type: string
            enum: [queued, running, succeeded, failed, canceled]
      responses:
        "200":
          description: "{count, tasks[]}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/TaskLifecycleRecord"

  /api/tasks/{task_id}:
    get:
      tags: [Oracle]
      summary: Get one Oracle background task lifecycle record
      servers:
        - url: http://localhost:19004
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "{task}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/TaskLifecycleRecord"
        "404":
          description: task not found

  /api/actions/approval/respond:
    post:
      tags: [Oracle]
      summary: Approve or cancel a pending high-impact action
      servers:
        - url: http://localhost:19004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionApprovalResponseRequest"
      responses:
        "200":
          description: Approval response result
        "400":
          description: Invalid payload
        "404":
          description: Approval token not found or expired

  /api/athena/hints:
    post:
      tags: [Oracle]
      summary: Ingest advisory hints emitted by Athena
      servers:
        - url: http://localhost:19004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AthenaHintIngestRequest"
      responses:
        "200":
          description: "{status, stored, hint}"
    get:
      tags: [Oracle]
      summary: List currently active Athena advisory hints in Oracle
      servers:
        - url: http://localhost:19004
      parameters:
        - name: session_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 200
      responses:
        "200":
          description: "{count, hints[]}"

  # ══════════════════════════════════════════════════════════════════════════
  #  HERMES — 19005
  # ══════════════════════════════════════════════════════════════════════════

  /hermes/health:
    get:
      tags: [Hermes]
      summary: Hermes health check
      servers:
        - url: http://localhost:19005
      responses:
        "200":
          description: OK

  /api/events/ingest:
    post:
      tags: [Hermes]
      summary: Ingest a domain event — matches subscriptions and dispatches notifications
      servers:
        - url: http://localhost:19005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HermesEventRequest"
      responses:
        "200":
          description: "{status: ok, result: {subscriptions_matched, deliveries, ...}}"

  /api/dispatch/send:
    post:
      tags: [Hermes]
      summary: Send a direct message to a channel target
      servers:
        - url: http://localhost:19005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchSendRequest"
      responses:
        "200":
          description: "{success, detail}"

  /api/outbound-events/state:
    post:
      tags: [Hermes]
      summary: Update lifecycle state for a tracked outbound event
      servers:
        - url: http://localhost:19005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outbound_event_id, lifecycle_state]
              properties:
                outbound_event_id:
                  type: string
                lifecycle_state:
                  type: string
                  enum:
                    [
                      created,
                      queued,
                      delivered,
                      seen,
                      answered,
                      dismissed,
                      superseded,
                      failed,
                    ]
                detail:
                  type: string
                superseded_by:
                  type: string
      responses:
        "200":
          description: "{status, updated}"

  # ══════════════════════════════════════════════════════════════════════════
  #  SCOUT — 19006
  #  Note: expose port 19006 in docker-compose.global.yml to test locally
  # ══════════════════════════════════════════════════════════════════════════

  /scout/health:
    get:
      tags: [Scout]
      summary: Scout health check
      servers:
        - url: http://localhost:19006
      responses:
        "200":
          description: OK

  /api/module-tools/domains:
    get:
      tags: [Scout]
      summary: List domains served by Scout module tools
      servers:
        - url: http://localhost:19006
      responses:
        "200":
          description: '{domains: ["real_estate"]}'

  /api/module-tools/query:
    post:
      tags: [Scout]
      summary: Query entities via module-tool interface
      servers:
        - url: http://localhost:19006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModuleToolQueryRequest"
      responses:
        "200":
          description: "{domain, items: [...]}"

  /api/tools:
    get:
      tags: [Scout]
      summary: List available Scout tools
      servers:
        - url: http://localhost:19006
      responses:
        "200":
          description: "{tools: [{name, path, description}]}"

  /api/scout/cycle:
    post:
      tags: [Scout]
      summary: Run the email to listings cycle (agenda job scout.email_cycle)
      servers:
        - url: http://localhost:19006
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                trigger:
                  type: string
                  description: "agenda | user | api"
                wait:
                  type: boolean
                  description: "run synchronously"
      responses:
        "200":
          description: "{status: started|busy|ok|error, trigger}"

  /api/scout/stats:
    get:
      tags: [Scout]
      summary: Real-estate domain summary (counts by status, date range)
      servers:
        - url: http://localhost:19006
      responses:
        "200":
          description: "{domain, total_entities, by_status, oldest_created, newest_created}"

  /api/tools/real_estate/search:
    post:
      tags: [Scout]
      summary: Search real estate listings
      servers:
        - url: http://localhost:19006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RealEstateSearchRequest"
      responses:
        "200":
          description: List of real estate entity items

  # ══════════════════════════════════════════════════════════════════════════
  #  CHRONOS — 19007
  # ══════════════════════════════════════════════════════════════════════════

  /chronos/health:
    get:
      tags: [Chronos]
      summary: Chronos health check (includes provider status)
      servers:
        - url: http://localhost:19007
      responses:
        "200":
          description: "{status, service, providers: {active[], unavailable{}}}"

  /api/calendar/events:
    post:
      tags: [Chronos]
      summary: Create a calendar event in one or more providers
      servers:
        - url: http://localhost:19007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "200":
          description: "{results[{provider, success, event_id?, error?}], total_created, total_failed}"

  /api/calendar/events/list:
    post:
      tags: [Chronos]
      summary: List events from calendar providers
      servers:
        - url: http://localhost:19007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListEventsRequest"
      responses:
        "200":
          description: "{events[...], provider_errors{}}"

  /api/calendar/events/{event_id}:
    delete:
      tags: [Chronos]
      summary: Delete a calendar event
      servers:
        - url: http://localhost:19007
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  type: string
                calendar_id:
                  type: string
                  default: primary
      responses:
        "200":
          description: "{success: true}"
    patch:
      tags: [Chronos]
      summary: Update a calendar event
      servers:
        - url: http://localhost:19007
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, updates]
              properties:
                provider:
                  type: string
                updates:
                  type: object
                  additionalProperties: true
                calendar_id:
                  type: string
                  default: primary
      responses:
        "200":
          description: "{success: true}"

  /api/agenda/items/{ref}/move:
    post:
      tags: [Chronos]
      summary: Move one occurrence of an agenda item (exception) or reset it
      servers:
        - url: http://localhost:19007
      parameters:
        - name: ref
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                occurrence: {type: string, description: "occurrence key (UTC ISO) from /api/agenda"}
                start_at: {type: string}
                end_at: {type: string}
                reset: {type: boolean}
                by: {type: string, default: user}
      responses:
        "200":
          description: "{status, item}"

  /api/calendar/sync:
    post:
      tags: [Chronos]
      summary: Run a Hecate to Archive calendar sync now (agenda job chronos.calendar_sync)
      servers:
        - url: http://localhost:19007
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                trigger:
                  type: string
                  description: "agenda | user | api"
      responses:
        "200":
          description: "{status: started, trigger, agenda_job}"

  /api/calendar/providers:
    get:
      tags: [Chronos]
      summary: List active calendar providers
      servers:
        - url: http://localhost:19007
      responses:
        "200":
          description: "{active[], unavailable{}}"

  /api/calendar/agenda:
    get:
      tags: [Chronos]
      summary: Get upcoming agenda from Archive
      servers:
        - url: http://localhost:19007
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 7
            minimum: 1
            maximum: 90
        - name: source
          in: query
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
            enum: [event, task, reminder]
      responses:
        "200":
          description: "{from, to, days, count, items[...]}"

  # ══════════════════════════════════════════════════════════════════════════
  #  ARGUS — 19008
  # ══════════════════════════════════════════════════════════════════════════

  /argus/health:
    get:
      tags: [Argus]
      summary: Argus health check
      servers:
        - url: http://localhost:19008
      responses:
        "200":
          description: OK

  /api/argus/status:
    get:
      tags: [Argus]
      summary: Health status of all monitored services
      servers:
        - url: http://localhost:19008
      responses:
        "200":
          description: "{healthy_count, unhealthy_count, services: {name: {status, ...}}}"

  /api/argus/logs:
    get:
      tags: [Argus]
      summary: Query collected service logs
      servers:
        - url: http://localhost:19008
      parameters:
        - name: service
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
            default: WARNING
        - name: since
          in: query
          schema:
            type: string
            default: 30m
          description: "e.g. '30m', '2h', '1d'"
      responses:
        "200":
          description: "{count, filters{}, events[]}"

  /api/argus/analyze:
    post:
      tags: [Argus]
      summary: Run an LLM system analysis across all monitored logs
      servers:
        - url: http://localhost:19008
      responses:
        "200":
          description: "SystemReport: {status, summary (LLM text), events[], ...}"

  /api/argus/recheck/{service}:
    post:
      tags: [Argus]
      summary: Repair follow-up for an unhealthy service (agenda task argus.repair.<service>)
      servers:
        - url: http://localhost:19008
      parameters:
        - name: service
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "{status, service, health, remediation_requested, next_attempt}"

  /api/argus/remediate:
    post:
      tags: [Argus]
      summary: Forward remediation intent to Hephaestus through Hub routing
      servers:
        - url: http://localhost:19008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArgusRemediationRequest"
      responses:
        "200":
          description: "{status, forwarded_to, result}"

  # ══════════════════════════════════════════════════════════════════════════
  #  HEPHAESTUS — 19010
  # ══════════════════════════════════════════════════════════════════════════

  /hephaestus/health:
    get:
      tags: [Hephaestus]
      summary: Hephaestus health check
      servers:
        - url: http://localhost:19010
      responses:
        "200":
          description: OK

  /api/hephaestus/status:
    get:
      tags: [Hephaestus]
      summary: Hephaestus runtime status
      servers:
        - url: http://localhost:19010
      responses:
        "200":
          description: "{status, mode, self_healing_preview_only, runbook_count}"

  /api/hephaestus/runbooks:
    get:
      tags: [Hephaestus]
      summary: List available Hephaestus runbooks
      servers:
        - url: http://localhost:19010
      responses:
        "200":
          description: "{status, runbooks[]}"

  /api/hephaestus/tasks:
    get:
      tags: [Hephaestus]
      summary: List remediation tasks
      servers:
        - url: http://localhost:19010
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: state
          in: query
          schema:
            type: string
            enum: [pending_approval, running, succeeded, failed, rolled_back]
      responses:
        "200":
          description: "{status, count, tasks[]}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  count:
                    type: integer
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/HephaestusTaskRecord"

  /api/hephaestus/forge/status:
    get:
      tags: [Hephaestus]
      summary: Forge status (repo, base branch, engines, queue)
      servers:
        - url: http://localhost:19010
      responses:
        "200": {description: OK}

  /api/hephaestus/forge/engine:
    get:
      tags: [Hephaestus]
      summary: Default Forge engine, fallback chain, availability
      servers:
        - url: http://localhost:19010
      responses:
        "200": {description: "{status, default_engine, fallback[], engines{}}"}
    post:
      tags: [Hephaestus]
      summary: Set default Forge engine (persisted)
      servers:
        - url: http://localhost:19010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [engine]
              properties:
                engine: {type: string, enum: [local, cloud, claude]}
      responses:
        "200": {description: "{status, default_engine, available, detail}"}
        "400": {description: Unknown engine}

  /api/hephaestus/forge/settings:
    get:
      tags: [Hephaestus]
      summary: Forge settings (default engine, fallback, permission modes)
      servers:
        - url: http://localhost:19010
      responses:
        "200": {description: OK}

  /api/hephaestus/forge/settings/mode:
    post:
      tags: [Hephaestus]
      summary: Set Forge permission mode (ask | auto | full_auto) for local/cloud group (persisted)
      servers:
        - url: http://localhost:19010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: {type: string, enum: [ask, auto, full_auto]}
                group: {type: string, enum: [local, cloud, ""], description: empty = both}
      responses:
        "200": {description: Updated settings}
        "400": {description: Unknown mode or group}

  /api/hephaestus/forge/claude-budget:
    get:
      tags: [Hephaestus]
      summary: Claude Pro budget window status (phase, next reset, used tonight)
      servers:
        - url: http://localhost:19010
      responses:
        "200": {description: "{status, phase, allowed, reason, next_reset, hours_to_reset, used_tonight, schedule, blocked_until}"}

  /api/hephaestus/forge/settings/claude-schedule:
    post:
      tags: [Hephaestus]
      summary: Configure the Claude Pro budget window (persisted)
      servers:
        - url: http://localhost:19010
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reset_day: {type: string, description: mon..sun / lun..dom}
                reset_time: {type: string, description: "HH:MM"}
                tz: {type: string}
                window_hours: {type: integer}
                night: {type: string, description: "HH:MM-HH:MM"}
                night_max_tasks: {type: integer}
                final_hours: {type: integer}
      responses:
        "200": {description: Updated budget status}
        "400": {description: Invalid schedule}

  /api/hephaestus/forge/tasks:
    get:
      tags: [Hephaestus]
      summary: List Forge self-development tasks
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: state, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 20}}
      responses:
        "200": {description: "{status, count, tasks[]}"}
    post:
      tags: [Hephaestus]
      summary: Submit a self-development task (isolated branch, tests, approval)
      servers:
        - url: http://localhost:19010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request]
              properties:
                request: {type: string}
                services: {type: array, items: {type: string}}
                engine: {type: string, enum: [auto, local, cloud, claude], description: empty/auto = default + fallback}
                auto_start: {type: boolean, description: "omit = user source starts; athena/argus follow permission mode; false = proposal"}
                auto_merge: {type: boolean}
                context: {type: string}
                source: {type: string}
                requested_by: {type: string}
                notify_target: {type: string}
                workdoc: {type: string, description: "continue docs/work/<workdoc>/ of an earlier task"}
                parent_task: {type: string, description: "follow-up of this task (Sviluppo page): inherits workdoc, services and its outcome as context"}
                agenda_parent: {type: string, description: "agenda key this task serves: its mirror forge.task.<id> is linked to it (cancelling it rejects a proposed/scheduled task; a failed task marks it)"}
      responses:
        "200": {description: "{status, task}"}
        "400": {description: Invalid request}
        "404": {description: parent_task not found}
        "503": {description: Forge disabled or repo not mounted}

  /api/hephaestus/forge/tasks/{task_id}:
    get:
      tags: [Hephaestus]
      summary: Full Forge task record (short ids accepted)
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: OK}
        "404": {description: Not found}

  /api/hephaestus/forge/tasks/{task_id}/diff:
    get:
      tags: [Hephaestus]
      summary: Unified diff of the task (text/plain)
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: diff text}

  /api/hephaestus/forge/tasks/{task_id}/transcript:
    get:
      tags: [Hephaestus]
      summary: "Engine conversation, normalized (Sviluppo page). Live while a Claude run is going"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
        - {name: offset, in: query, schema: {type: integer, default: 0}}
        - {name: limit, in: query, schema: {type: integer, default: 500, maximum: 2000}}
      responses:
        "200": {description: "{status, task_id, state, total, offset, live, events[{i, ts, kind: user|text|thinking|tool_use|tool_result|system|result|error, text?, tool?, id?, input?, is_error?, meta?}]}"}
        "404": {description: Task not found}

  /api/hephaestus/forge/tasks/{task_id}/files:
    get:
      tags: [Hephaestus]
      summary: "Changed files + diff (live worktree incl. uncommitted, or base...commit)"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
        - {name: diff, in: query, schema: {type: boolean, default: true}}
      responses:
        "200": {description: "{status, live, base, head, files[{path, old_path?, added, deleted, binary, status: A|M|D|R|C|?}], diff, truncated, totals}"}
        "404": {description: Task not found}

  /api/hephaestus/forge/tasks/{task_id}/workdoc:
    get:
      tags: [Hephaestus]
      summary: "Dossier docs/work/<workdoc>/*.md + every other .md the task changed"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, workdoc, ref, docs[{path, name, group: dossier|changed, content}]}"}
        "404": {description: Task not found}

  /api/hephaestus/forge/tasks/{task_id}/tests:
    get:
      tags: [Hephaestus]
      summary: "Full pytest output of Forge's own test run"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, ok, ran, output, summary{passed, failed, error, skipped, failed_tests[]}}"}
        "404": {description: Task not found}

  /api/hephaestus/forge/tasks/{task_id}/logs:
    get:
      tags: [Hephaestus]
      summary: "Engine log, deploy output, error"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, engine, deploy, error, hint}"}
        "404": {description: Task not found}

  /api/hephaestus/forge/tasks/{task_id}/events:
    get:
      tags: [Hephaestus]
      summary: "State timeline"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, state, events[{ts, state, note}]}"}
        "404": {description: Task not found}

  /api/hephaestus/forge/tasks/{task_id}/retry:
    post:
      tags: [Hephaestus]
      summary: "Same request again as a new task (failed / no_changes / rejected / rolled_back)"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, task} (the new task)"}
        "404": {description: Task not found}

  /api/hephaestus/repo/branches:
    get:
      tags: [Hephaestus]
      summary: "Local branches with ahead/behind vs base; forge worktree branches flagged"
      servers:
        - url: http://localhost:19010
      responses:
        "200": {description: "{status, base, current, branches[{name, sha, date, author, subject, upstream, current, base, forge_task, ahead, behind}]}"}
        "400": {description: Invalid ref or path}
        "503": {description: Repo not mounted}

  /api/hephaestus/repo/tags:
    get:
      tags: [Hephaestus]
      summary: "Tags"
      servers:
        - url: http://localhost:19010
      responses:
        "200": {description: "{status, tags[{name, sha, date, subject}]}"}
        "400": {description: Invalid ref or path}
        "503": {description: Repo not mounted}

  /api/hephaestus/repo/log:
    get:
      tags: [Hephaestus]
      summary: "Commit log (parents included for the graph)"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: ref, in: query, schema: {type: string, default: HEAD}}
        - {name: path, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 100, maximum: 500}}
        - {name: skip, in: query, schema: {type: integer, default: 0}}
        - {name: all, in: query, schema: {type: boolean, default: false}, description: all branches and tags}
      responses:
        "200": {description: "{status, commits[{sha, short, parents[], author, email, date, subject, refs[]}], has_more}"}
        "400": {description: Invalid ref or path}
        "503": {description: Repo not mounted}

  /api/hephaestus/repo/commits/{sha}:
    get:
      tags: [Hephaestus]
      summary: "Commit meta + changed files + diff (merge: vs first parent)"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: sha, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, sha, parents, author, date, subject, body, refs, files[], diff, truncated}"}
        "400": {description: Invalid ref or path}
        "503": {description: Repo not mounted}

  /api/hephaestus/repo/compare:
    get:
      tags: [Hephaestus]
      summary: "base...head: commits, files, diff"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: base, in: query, schema: {type: string}, description: default = base branch}
        - {name: head, in: query, schema: {type: string, default: HEAD}}
      responses:
        "200": {description: "{status, base, head, ahead, behind, commits[], files[], diff, truncated}"}
        "400": {description: Invalid ref or path}
        "503": {description: Repo not mounted}

  /api/hephaestus/repo/tree:
    get:
      tags: [Hephaestus]
      summary: "Directory listing at a ref"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: ref, in: query, schema: {type: string, default: HEAD}}
        - {name: path, in: query, schema: {type: string}}
      responses:
        "200": {description: "{status, ref, path, entries[{name, path, type: blob|tree|commit, sha, size, secret}]}"}
        "400": {description: Invalid ref or path}
        "503": {description: Repo not mounted}

  /api/hephaestus/repo/file:
    get:
      tags: [Hephaestus]
      summary: "File content at a ref (secret files refused with 403, binary flagged, capped)"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: ref, in: query, schema: {type: string, default: HEAD}}
        - {name: path, in: query, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, ref, path, size, binary, content, truncated}"}
        "400": {description: Invalid ref or path}
        "503": {description: Repo not mounted}

  /api/hephaestus/repo/dossiers:
    get:
      tags: [Hephaestus]
      summary: "docs/work dossiers with SPEC header (title, version, status, source) and PROGRESS counts"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: ref, in: query, schema: {type: string, default: HEAD}}
      responses:
        "200": {description: "{status, ref, dossiers[{name, path, title, version, status, source, progress{done, total}}]}"}
        "400": {description: Invalid ref or path}
        "503": {description: Repo not mounted}

  /api/hephaestus/forge/tasks/{task_id}/approve:
    post:
      tags: [Hephaestus]
      summary: "proposed → start; awaiting_review → merge/deploy (async)"
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, task}"}
        "409": {description: Repo not on base branch or dirty}

  /api/hephaestus/forge/tasks/{task_id}/reject:
    post:
      tags: [Hephaestus]
      summary: Discard a proposed/awaiting_review task
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, task}"}

  /api/hephaestus/forge/tasks/{task_id}/rollback:
    post:
      tags: [Hephaestus]
      summary: Revert a merged Forge change (git revert -m 1)
      servers:
        - url: http://localhost:19010
      parameters:
        - {name: task_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status, task}"}

  /api/metis/lora/jobs:
    get:
      tags: [Metis]
      summary: LoRA training jobs (scheduled in the agenda window metis.training, running, finished)
      servers:
        - url: http://localhost:19014
      responses:
        "200":
          description: "{status, window, count, jobs[{job_id, status, dataset_name, start_at, agenda_key, pid, log}]}"

  /api/metis/insights:
    get:
      tags: [Metis]
      summary: Weak spots from graded feedback
      servers:
        - url: http://localhost:19014
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 500}}
        - {name: since, in: query, schema: {type: string}}
      responses:
        "200": {description: "{status, total_feedback, bad_feedback, bad_ratio, weak_domains[]}"}

  /api/settings/register:
    post:
      tags: [Themis]
      summary: A module declares its settings (hestia_common.settings_client); answer = its stored system values
      servers:
        - url: http://localhost:19016
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [owner, definitions]
              properties:
                owner: {type: string, example: argus}
                definitions:
                  type: array
                  description: "setting(): {key, label, type: enum|bool|int|float|string|text|model|time|duration|list|object, default, group, help, options[{value,label}], min, max, unit, apply: live|restart, scope: system|user, depends_on, oracle: propose|read|none, advanced, order, options_source, fields}"
                  items: {type: object}
                presets:
                  type: array
                  items: {type: object, description: "{id, label, group, values{key: value}, help}"}
                effective: {type: object, description: values the module is using now}
      responses:
        "200": {description: "{owner, values{key: value}, revision}"}
        "503": {description: Archive unreachable (module keeps defaults and retries)}

  /api/settings/revision:
    get:
      tags: [Themis]
      summary: Change marker — clients refetch when it differs
      servers:
        - url: http://localhost:19016
      responses:
        "200": {description: "{revision}"}

  /api/settings/modules:
    get:
      tags: [Themis]
      summary: Modules with settings + live state from Hub (health, version, pending proposals) for the panel
      servers:
        - url: http://localhost:19016
      responses:
        "200": {description: "{revision, modules[{module, definitions, groups[], health, version, pending_proposals}], other_services[]}"}

  /api/settings:
    get:
      tags: [Themis]
      summary: Settings with value, source (default|stored|profile|client|session) and status (ok|restart_required|offline)
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: module, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}, description: "search in label, help, key, group, module, option labels"}
        - {name: client, in: query, schema: {type: string}, description: "webui | telegram (user-scope resolution)"}
        - {name: session, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: boolean, default: true}, description: "ask modules their effective values"}
      responses:
        "200": {description: "{revision, items[definition + value, source, status, updated_by, updated_at], presets[{module, group, active (preset id | custom), presets[]}]}"}

  /api/settings/search:
    get:
      tags: [Themis]
      summary: Compact search (assistant tool settings_search)
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: query, in: query, schema: {type: string}}
        - {name: module, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 15}}
      responses:
        "200": {description: "{count, settings[{key, label, module, group, value, default, help, assistant}]}"}

  /api/settings/key/{key}:
    get:
      tags: [Themis]
      summary: One setting (assistant tool settings_get)
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
        - {name: client, in: query, schema: {type: string}}
        - {name: session, in: query, schema: {type: string}}
      responses:
        "200": {description: definition + value, source, status}
        "404": {description: unknown setting}
    put:
      tags: [Themis]
      summary: Change a setting (user/clients only — the assistant must propose)
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                value: {description: new value (validated against the definition)}
                scope: {type: string, enum: [system, profile, client, session]}
                scope_id: {type: string, description: "client name or session id"}
                actor: {type: string, default: user}
                reason: {type: string}
      responses:
        "200": {description: "{key, scope, scope_id, value, revision} — live settings applied at once, restart ones flagged"}
        "403": {description: actor is the assistant}
        "422": {description: invalid value (Italian message)}
    delete:
      tags: [Themis]
      summary: Reset to default
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
        - {name: scope, in: query, schema: {type: string}}
        - {name: scope_id, in: query, schema: {type: string}}
      responses:
        "200": {description: "{key, scope, value (default), revision}"}

  /api/settings/key/{key}/history:
    get:
      tags: [Themis]
      summary: Last changes (max 10)
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{key, history[{old_value, new_value, actor, reason, created_at}]}"}

  /api/settings/key/{key}/undo:
    post:
      tags: [Themis]
      summary: Restore the value before the last change (user)
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: like PUT}

  /api/settings/key/{key}/undo-propose:
    post:
      tags: [Themis]
      summary: Assistant undo — proposes the previous value (assistant tool settings_undo)
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: key, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: like POST /api/settings/proposals}

  /api/settings/presets/{module}/{preset_id}/apply:
    post:
      tags: [Themis]
      summary: Apply a preset (writes its values; editing one later makes the group "custom")
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: module, in: path, required: true, schema: {type: string}}
        - {name: preset_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{module, preset, applied{}, revision}"}

  /api/settings/sessions/{session}/init:
    post:
      tags: [Themis]
      summary: New chat session starts from the profile (+client) defaults
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: session, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {client: {type: string}}}
      responses:
        "200": {description: "{session, copied[], revision}"}

  /api/settings/proposals:
    get:
      tags: [Themis]
      summary: Proposals (default pending; expired ones closed lazily)
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: status, in: query, schema: {type: string, default: pending}}
      responses:
        "200": {description: "{proposals[]}"}
    post:
      tags: [Themis]
      summary: Assistant proposes a change (assistant tool settings_propose; Athena in autonomy) — never applied without the user
      description: Themis stores it as pending and sends it to the user through Hermes (service.action_required, payload kind settings.proposal, _message, _actions Approva/Rifiuta with service/method/path).
      servers:
        - url: http://localhost:19016
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key: {type: string}
                value: {}
                reason: {type: string}
                proposer: {type: string, enum: [oracle, athena]}
      responses:
        "200": {description: "{status: pending|already_pending|unchanged, proposal_id, key, value, current, label}"}
        "403": {description: setting reserved to the user}

  /api/settings/proposals/{proposal_id}/approve:
    post:
      tags: [Themis]
      summary: User approves (from any client) — first answer wins
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: proposal_id, in: path, required: true, schema: {type: string}}
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {by: {type: string, description: client}}}
      responses:
        "200": {description: "{status: approved, proposal_id, key, value, revision}"}
        "409": {description: "{status: already_decided, decision}"}

  /api/settings/proposals/{proposal_id}/reject:
    post:
      tags: [Themis]
      summary: User rejects — first answer wins
      servers:
        - url: http://localhost:19016
      parameters:
        - {name: proposal_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "{status: rejected, proposal_id}"}
        "409": {description: "{status: already_decided, decision}"}

  /api/settings/effective:
    get:
      tags: [Meta]
      summary: (every module with settings, hestia_common) values the module is really using
      responses:
        "200": {description: "{owner, loaded, values{}, pending_restart[]}"}

  /api/settings/reload:
    post:
      tags: [Meta]
      summary: (every module with settings) Themis pushes stored values; live ones apply at once
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {values: {type: object}}}
      responses:
        "200": {description: "{owner, applied[], pending_restart[]}"}

  /api/settings-store/values:
    get:
      tags: [Archive — Settings store]
      summary: Stored values (filters key, prefix, scope, scope_id)
      servers:
        - url: http://localhost:19002
      responses:
        "200": {description: "[{key, scope, scope_id, value, updated_by, updated_at}]"}
    put:
      tags: [Archive — Settings store]
      summary: Upsert a value and log old → new (history trimmed to history_keep)
      servers:
        - url: http://localhost:19002
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key: {type: string}
                scope: {type: string}
                scope_id: {type: string}
                value: {}
                actor: {type: string}
                reason: {type: string}
                history_keep: {type: integer, default: 10}
      responses:
        "200": {description: stored row}
    delete:
      tags: [Archive — Settings store]
      summary: Delete a value (logged as old → null)
      servers:
        - url: http://localhost:19002
      responses:
        "200": {description: "{status: deleted|absent}"}

  /api/settings-store/history:
    get:
      tags: [Archive — Settings store]
      summary: Change log (filters key, scope, scope_id, actor, limit)
      servers:
        - url: http://localhost:19002
      responses:
        "200": {description: "[{id, key, scope, scope_id, old_value, new_value, actor, reason, created_at}]"}

  /api/settings-store/proposals:
    get:
      tags: [Archive — Settings store]
      summary: Proposals (filters status, key, proposal_id)
      servers:
        - url: http://localhost:19002
      responses:
        "200": {description: list}
    post:
      tags: [Archive — Settings store]
      summary: Store a pending proposal
      servers:
        - url: http://localhost:19002
      responses:
        "200": {description: stored proposal}
        "409": {description: duplicate proposal_id}

  /api/settings-store/proposals/{proposal_id}:
    patch:
      tags: [Archive — Settings store]
      summary: Close a proposal (only_if_status makes the first answer win)
      servers:
        - url: http://localhost:19002
      parameters:
        - {name: proposal_id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: updated proposal}
        "409": {description: already decided}

  /api/hephaestus/tasks/{task_id}:
    get:
      tags: [Hephaestus]
      summary: Retrieve one remediation task
      servers:
        - url: http://localhost:19010
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "{status, task}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  task:
                    $ref: "#/components/schemas/HephaestusTaskRecord"

  /api/hephaestus/remediate:
    post:
      tags: [Hephaestus]
      summary: Create a remediation task (policy-gated skeleton flow)
      servers:
        - url: http://localhost:19010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HephaestusRemediationRequest"
      responses:
        "200":
          description: "{status, task, approval_required}"

  /api/hephaestus/remediate/{task_id}/approve:
    post:
      tags: [Hephaestus]
      summary: Approve and execute a pending remediation task
      servers:
        - url: http://localhost:19010
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HephaestusRemediationApproveRequest"
      responses:
        "200":
          description: "{status, task}"

  /api/hephaestus/remediate/{task_id}/retry:
    post:
      tags: [Hephaestus]
      summary: Retry a failed remediation (fired by the assistant agenda); last failure escalates to Forge
      servers:
        - url: http://localhost:19010
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                requested_by:
                  type: string
                  description: "agenda | user"
      responses:
        "200":
          description: "{status, task}; task.state escalated + forge_task_id after the last attempt"

  /api/hephaestus/remediate/{task_id}/rollback:
    post:
      tags: [Hephaestus]
      summary: Record rollback execution for a remediation task
      servers:
        - url: http://localhost:19010
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HephaestusRemediationRollbackRequest"
      responses:
        "200":
          description: "{status, task}"

  # ══════════════════════════════════════════════════════════════════════════
  #  DUMMY — 19011
  # ══════════════════════════════════════════════════════════════════════════

  /dummy/health:
    get:
      tags: [Dummy]
      summary: Dummy module health check
      servers:
        - url: http://localhost:19011
      responses:
        "200":
          description: OK

  /api/dummy/status:
    get:
      tags: [Dummy]
      summary: Read current dummy module state
      servers:
        - url: http://localhost:19011
      responses:
        "200":
          description: "{status, service, state}"

  /api/module/maintenance/reconcile:
    post:
      tags: [Maintenance]
      summary: Execute module maintenance reconcile using the standard contract
      servers:
        - url: http://localhost:19002
        - url: http://localhost:19006
        - url: http://localhost:19007
        - url: http://localhost:19011
        - url: http://localhost:19012
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: string
                task_id:
                  type: string
                  nullable: true
                issue:
                  type: string
                  nullable: true
                requested_action:
                  type: string
                  nullable: true
                environment:
                  type: string
                  default: dev
                dry_run:
                  type: boolean
                  default: true
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: "{status, service, dry_run, task_id, executed_at, retriable, summary, mutation_count, details}"

  /api/maintenance/reconcile:
    post:
      tags: [Maintenance]
      summary: Compatibility alias of module maintenance reconcile
      servers:
        - url: http://localhost:19002
        - url: http://localhost:19006
        - url: http://localhost:19007
        - url: http://localhost:19011
        - url: http://localhost:19012
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: "Alias response; same as /api/module/maintenance/reconcile"

  # ══════════════════════════════════════════════════════════════════════════
  #  ATHENA — 19009
  # ══════════════════════════════════════════════════════════════════════════

  /athena/health:
    get:
      tags: [Athena]
      summary: Athena health check
      servers:
        - url: http://localhost:19009
      responses:
        "200":
          description: OK

  /api/athena/status:
    get:
      tags: [Athena]
      summary: Athena runtime status
      servers:
        - url: http://localhost:19009
      responses:
        "200":
          description: "{status, runtime}"

  /api/athena/trigger:
    post:
      tags: [Athena]
      summary: Manually trigger one Athena focus brief evaluation
      servers:
        - url: http://localhost:19009
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                summary:
                  type: string
                domain:
                  type: string
                  default: cognition
                signals:
                  type: object
                  properties:
                    urgency:
                      type: number
                      minimum: 0
                      maximum: 1
                    usefulness:
                      type: number
                      minimum: 0
                      maximum: 1
                    novelty:
                      type: number
                      minimum: 0
                      maximum: 1
                    interruption_cost:
                      type: number
                      minimum: 0
                      maximum: 1
                    confidence:
                      type: number
                      minimum: 0
                      maximum: 1
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: "{status, accepted, score, threshold, brief}"

  /api/athena/tasks:
    get:
      tags: [Athena]
      summary: List Athena task lifecycle records
      servers:
        - url: http://localhost:19009
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: task_type
          in: query
          schema:
            type: string
            example: athena.focus_brief.periodic
        - name: lifecycle_state
          in: query
          schema:
            type: string
            enum: [queued, running, succeeded, failed, canceled]
      responses:
        "200":
          description: "{status, count, tasks[]}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  count:
                    type: integer
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/TaskLifecycleRecord"

  /api/athena/tasks/{task_id}:
    get:
      tags: [Athena]
      summary: Get one Athena task lifecycle record
      servers:
        - url: http://localhost:19009
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "{status, task}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  task:
                    $ref: "#/components/schemas/TaskLifecycleRecord"
        "404":
          description: task not found

  /api/athena/commitments:
    get:
      tags: [Athena]
      summary: List unresolved or historical Athena commitments
      servers:
        - url: http://localhost:19009
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: include_resolved
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: "{status, count, commitments[]}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  count:
                    type: integer
                  commitments:
                    type: array
                    items:
                      $ref: "#/components/schemas/AthenaCommitmentRecord"

  /api/athena/commitments/{brief_id}/resolve:
    post:
      tags: [Athena]
      summary: Resolve an open Athena commitment
      servers:
        - url: http://localhost:19009
      parameters:
        - name: brief_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  default: resolved
                note:
                  type: string
      responses:
        "200":
          description: "{status, commitment}"
        "404":
          description: commitment not found

  /api/athena/thinking:
    get:
      tags: [Athena]
      summary: List recent Athena thinking records (observation → candidates → decisions)
      description: >
        Returns a time-ordered list of thinking cycles. Each record shows what
        Athena observed, what action candidates it considered, and what it
        actually emitted. This is the audit trail for proactive cognition.
      servers:
        - url: http://localhost:19009
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: "{status, count, thinking}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  count:
                    type: integer
                  thinking:
                    type: array
                    items:
                      $ref: "#/components/schemas/AthenaThinkingRecord"

  /api/athena/observation:
    get:
      tags: [Athena]
      summary: Fetch the most recent observation snapshot
      description: >
        Returns live system state as last seen by Athena: registered services,
        unhealthy services, domain entity summaries, and self-state metrics.
      servers:
        - url: http://localhost:19009
      responses:
        "200":
          description: "{status, observation}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  observation:
                    $ref: "#/components/schemas/ObservationSnapshot"

  # ── WebUI ───────────────────────────────────────────────────────────────
  /api/webui/admin/generate-token:
    servers:
      - url: http://localhost:19015
    post:
      tags: [WebUI]
      summary: Generate WebUI access token
      description: >
        Generates a new 256-bit access token. Invalidates previous token.
        NOT Hub-routed — called directly by Telegram on internal Docker network.
      parameters:
        - name: lifetimeHours
          in: query
          schema:
            type: number
            default: 72
      responses:
        "200":
          description: "{token, public_url, expires_in_seconds, lifetime_hours}"

  /api/webui/admin/revoke-token:
    servers:
      - url: http://localhost:19015
    post:
      tags: [WebUI]
      summary: Revoke WebUI access token
      description: Immediately invalidates the current active token.
      responses:
        "200":
          description: "{status: revoked}"

  /api/webui/admin/token-status:
    servers:
      - url: http://localhost:19015
    get:
      tags: [WebUI]
      summary: Get WebUI token status
      responses:
        "200":
          description: "{active, created_at, expires_at, remaining_seconds, remaining_hours}"

  /api/webui/admin/public-url:
    servers:
      - url: http://localhost:19015
    get:
      tags: [WebUI]
      summary: Get current public-facing Cloudflare URL
      responses:
        "200":
          description: "{public_url, detected}"
