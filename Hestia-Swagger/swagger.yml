    post:
      tags: [Archive — Chat queue]
      summary: Queue a chat message written while Oracle was offline
      description: SPEC docs/work/2026-10-19-oracle-offline. Each chat client queues its own and answers them when Chronos says Oracle is back.
      servers:
        - url: http://localhost:19002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client, session_id, text]
              properties:
                client: {type: string, example: telegram}
                session_id: {type: string}
                text: {type: string}
                target: {type: string, description: "Client-side destination (Telegram chat id)"}
                client_ref: {type: string, description: "Client-side message to reply to"}
                meta: {type: object}
      responses:
        "200": {description: "{id, client, session_id, target, client_ref, text, meta, state: queued, attempts, created_at, position}"}
    get:
      tags: [Archive — Chat queue]
      summary: Queued items, oldest first
      servers:
        - url: http://localhost:19002
      parameters:
        - {name: client, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string, enum: [queued, answering, answered, failed], default: queued}}
        - {name: limit, in: query, schema: {type: integer, default: 100}}
      responses:
        "200": {description: "{items: [item]}"}

