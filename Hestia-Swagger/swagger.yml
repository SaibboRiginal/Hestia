openapi: 3.0.3

info:
  title: Hestia — API Reference
  description: |
    Aggregated API reference for all Hestia services.
    Each path overrides the server URL to route to the correct service.

    | Service   | Port  |
    |-----------|-------|
    | Hub       | 19001 |
    | Archive   | 19002 |
    | Hecate    | 19003 |
    | Oracle    | 19004 |
    | Hermes    | 19005 |
    | Scout     | 19006 |
    | Chronos   | 19007 |
    | Argus     | 19008 |
    | Iris      | 19012 |
    | Hephaestus| 19010 |
    | Dummy     | 19011 |
    | Themis    | 19016 |
  version: 1.0.0

servers:
  - url: http://localhost:19001
    description: Hub (default)

tags:
  - name: Hub
    description: Service registry and request routing
  - name: Archive — Records
    description: Raw domain records ingested from external sources
  - name: Archive — Entities
    description: Structured persistent entities (real estate listings, etc.)
  - name: Archive — Chat
    description: Conversation history
  - name: Archive — Memory
    description: User preferences and long-term memory
  - name: Archive — Subscriptions
    description: Proactive notification subscriptions
  - name: Archive — Dispatch Logs
    description: Delivery logs for dispatched notifications
  - name: Archive — Outbound Events
    description: Outbound delivery lifecycle and dedupe tracking
  - name: Archive — Feedback
    description: Quality feedback records and JSONL export
  - name: Archive — Calendar
    description: Calendar items (events, tasks, reminders)
  - name: Archive — Documents
    description: Uploaded and indexed documents with embeddings
  - name: Hecate
    description: API gateway and ingestion triggers
  - name: Oracle
    description: LLM chat, document analysis and formatting
  - name: Hermes
    description: Event-driven dispatch and direct messaging
  - name: Scout
    description: Real estate search and module tools
  - name: Chronos
    description: Calendar CRUD and agenda
  - name: Argus
    description: System health monitoring and log analysis
  - name: Iris
    description: Email domain APIs
  - name: Hephaestus
    description: Guarded self-healing remediation workflows
  - name: Dummy
    description: Deterministic generic testing module
  - name: WebUI
    description: Web-based chat interface — token management and health (direct :19015, not Hub-routed)
  - name: Athena
    description: Retrospective focus-brief cognition runtime
  - name: Themis
    description: Central settings — modules declare, clients and assistant read/change, user confirms proposals
  - name: Archive — Settings store
    description: Generic storage of setting values, light history and proposals (only Themis calls it)
  - name: Meta
    description: Runtime log-level control (available on every FastAPI service)

# ─────────────────────────────────────────────────────────────────────────────
#  Shared components
# ─────────────────────────────────────────────────────────────────────────────
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: hestia_hub
    RegisterServiceRequest:
      type: object
      required:
        [name, base_url, health_endpoint, service_type, service_version, tags]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9_-]{2,40}$"
          example: my_service
        base_url:
          type: string
          example: http://hestia_myservice:9999
        health_endpoint:
          type: string
          example: /health
        service_type:
          type: string
          enum: [core, module, integration]
        service_version:
          type: string
          example: 1.0.0
        tags:
          type: array
          items:
            type: string
            enum:
              [
                core,
                module,
                storage,
                connector,
                chat,
                dispatch,
                real_estate,
                integration,
                messaging,
                monitoring,
              ]
        topology_tags:
          type: array
          items:
            type: string
            pattern: "^(layer|domain|status):[a-z_]+$"
        capabilities:
          type: object
          additionalProperties: true

    RouteRequest:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
        headers:
          type: object
          additionalProperties:
            type: string
        query:
          type: object
          additionalProperties: true
        body:
          type: object
          additionalProperties: true
        timeout_seconds:
          type: number
          default: 8.0

    # ── Archive ───────────────────────────────────────────────────────────────
    ArchiveRecord:
      type: object
      required: [domain, source, payload]
      properties:
        reference_id:
          type: string
        domain:
          type: string
          example: real_estate
        source:
          type: string
          example: immobiliare_it
        payload:
          type: object
          additionalProperties: true

    EntityUpsertRequest:
      type: object
      required: [entity_id, domain, payload]
      properties:
        entity_id:
          type: string
        domain:
          type: string
        status:
          type: string
          default: active
        payload:
          type: object
          additionalProperties: true
        embedding:
          type: array
          items:
            type: number

    EntitySearchRequest:
      type: object
      properties:
        domain:
          type: string
        limit:
          type: integer
          default: 50
        query_vector:
          type: array
          items:
            type: number
        filters:
          type: object
          additionalProperties: true
        filters_gt:
          type: object
          additionalProperties: true
        filters_lt:
          type: object
          additionalProperties: true
        sort_by:
          type: string
        sort_order:
          type: string
          enum: [asc, desc]

    ChatMessageRequest:
      type: object
      required: [session_id, role, content]
      properties:
        session_id:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string

    PreferenceRequest:
      type: object
      required: [fact]
      properties:
        fact:
          type: string
          example: Preferisce risposte brevi
        domain:
          type: string
          default: general
        weight:
          type: number
          default: 1.0

    SubscriptionRequest:
      type: object
      required: [subscription_id, owner, domain, event_type, filters, channels]
      properties:
        subscription_id:
          type: string
        owner:
          type: string
        domain:
          type: string
        event_type:
          type: string
        filters:
          type: object
          additionalProperties: true
        channels:
          type: array
          items:
            type: string
        is_active:
          type: boolean
          default: true

    CalendarItemRequest:
      type: object
      required: [source, kind, title, start_at]
      properties:
        external_id:
          type: string
        source:
          type: string
          example: google
        kind:
          type: string
          enum: [event, task, reminder]
        title:
          type: string
        description:
          type: string
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        all_day:
          type: boolean
          default: false
        location:
          type: string
        attendees:
          type: array
          items:
            type: object
        recurrence:
          type: string
        status:
          type: string
          default: confirmed
        html_link:
          type: string
        nag_enabled:
          type: boolean
          default: true

    DocumentRequest:
      type: object
      required: [document_id]
      properties:
        document_id:
          type: string
        session_id:
          type: string
        chat_id:
          type: string
        filename:
          type: string
        mime_type:
          type: string
        file_size_bytes:
          type: integer
        file_hash:
          type: string
        title:
          type: string
        summary:
          type: string
        extracted_text:
          type: string
        embedding:
          type: array
          items:
            type: number
        is_permanent:
          type: boolean
          default: false
        domain:
          type: string
        tags:
          type: array
          items:
            type: string
        chunks:
          type: array
          items:
            type: object
            properties:
              chunk_index:
                type: integer
              chunk_text:
                type: string
              embedding:
                type: array
                items:
                  type: number

    # ── Oracle ────────────────────────────────────────────────────────────────
    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
        session_id:
          type: string
        notify_target:
          type: string
        force_notification_compiler:
          type: boolean
          default: false
        client_instructions:
          type: string

    FormatRequest:
      type: object
      required: [command, payload]
      properties:
        command:
          type: string
        payload:
          type: object
          additionalProperties: true
        response_prompt:
          type: string
        client_instructions:
          type: string
        thinking:
          type: boolean
          default: false
        max_length:
          type: integer
        locale:
          type: string
          default: it

    ActionApprovalResponseRequest:
      type: object
      required: [approval_token, approve]
      properties:
        approval_token:
          type: string
        approve:
          type: boolean
        actor:
          type: string
          nullable: true
        client_instructions:
          type: string
          nullable: true

    AthenaHintIngestRequest:
      type: object
      required: [summary]
      properties:
        hint_id:
          type: string
        source:
          type: string
          default: athena
        hint_type:
          type: string
          default: focus_brief
        session_id:
          type: string
          nullable: true
        domain:
          type: string
          nullable: true
        domains:
          type: array
          items:
            type: string
        priority:
          type: string
          default: normal
        summary:
          type: string
        brief:
          type: object
          additionalProperties: true
        gate:
          type: object
          additionalProperties: true
        retrospective:
          type: object
          additionalProperties: true
        ttl_seconds:
          type: integer
          nullable: true
        trace_id:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true

    AthenaCommitmentRecord:
      type: object
      properties:
        brief_id:
          type: string
        title:
          type: string
        summary:
          type: string
        domain:
          type: string
        score:
          type: number
        trace_id:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        resolved:
          type: boolean
        resolved_at:
          type: string
          format: date-time
          nullable: true
        resolution_status:
          type: string
          nullable: true
        resolution_note:
          type: string
          nullable: true

    AthenaThinkingRecord:
      type: object
      description: One complete Athena thinking cycle (observe → think → decide)
      properties:
        record_id:
          type: string
        trace_id:
          type: string
        cycle_at:
          type: string
          format: date-time
        trigger:
          type: string
          enum: [periodic, manual]
        observation:
          $ref: "#/components/schemas/ObservationSnapshot"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ActionCandidate"
        emitted_count:
          type: integer
        hint_published:
          type: boolean
        error:
          type: string
          nullable: true

    ObservationSnapshot:
      type: object
      description: System state as observed by Athena in one cycle
      properties:
        observation_id:
          type: string
        observed_at:
          type: string
          format: date-time
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceSnapshot"
        unhealthy_services:
          type: array
          items:
            type: string
        domains:
          type: array
          items:
            $ref: "#/components/schemas/DomainEntitySummary"
        active_commitments:
          type: integer
        unresolved_commitments:
          type: integer
        recent_failures:
          type: integer
        failure_streak:
          type: integer
        raw_errors:
          type: array
          items:
            type: string

    ServiceSnapshot:
      type: object
      properties:
        name:
          type: string
        base_url:
          type: string
        service_type:
          type: string
        status:
          type: string
          enum: [up, down, degraded, unknown]
        tags:
          type: array
          items:
            type: string

    DomainEntitySummary:
      type: object
      properties:
        domain:
          type: string
        total_entities:
          type: integer
        recent_count:
          type: integer
        pending_count:
          type: integer
        sample_titles:
          type: array
          items:
            type: string

    ActionCandidate:
      type: object
      description: A single action Athena is considering
      properties:
        candidate_id:
          type: string
        domain:
          type: string
        title:
          type: string
        summary:
          type: string
        kind:
          type: string
          enum: [advisory, remediation, notification, maintenance]
        target_service:
          type: string
          nullable: true
        target_path:
          type: string
          nullable: true
        priority:
          type: string
          enum: [low, normal, elevated, high]
        reasoning:
          type: string
        score:
          type: number
        accepted:
          type: boolean

    TaskLifecycleRecord:
      type: object
      properties:
        task_id:
          type: string
        task_type:
          type: string
        lifecycle_state:
          type: string
          enum: [queued, running, succeeded, failed, canceled]
        progress:
          type: number
          minimum: 0
          maximum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        session_id:
          type: string
          nullable: true
        trace_id:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true
          nullable: true
        error:
          type: object
          additionalProperties: true
          nullable: true

    ArgusRemediationRequest:
      type: object
      required: [service, issue]
      properties:
        service:
          type: string
        issue:
          type: string
        severity:
          type: string
          default: warning
        requested_action:
          type: string
          default: runbook_autoselect
        environment:
          type: string
          default: dev
        dry_run:
          type: boolean
          default: true
        auto_approve:
          type: boolean
          default: false
        metadata:
          type: object
          additionalProperties: true

    HephaestusRemediationRequest:
      type: object
      required: [service, issue]
      properties:
        source:
          type: string
          default: argus
        incident_id:
          type: string
        service:
          type: string
        issue:
          type: string
        severity:
          type: string
          default: warning
        requested_action:
          type: string
          default: runbook_autoselect
        environment:
          type: string
          default: dev
        dry_run:
          type: boolean
          default: true
        auto_approve:
          type: boolean
          default: false
        metadata:
          type: object
          additionalProperties: true

    HephaestusRemediationApproveRequest:
      type: object
      properties:
        approved_by:
          type: string
          default: operator
        note:
          type: string
          nullable: true
        dry_run_override:
          type: boolean
          nullable: true

    HephaestusRemediationRollbackRequest:
      type: object
      properties:
        requested_by:
          type: string
          default: operator
        reason:
          type: string
          default: manual_rollback

    HephaestusTaskRecord:
      type: object
      properties:
        task_id:
          type: string
        incident_id:
          type: string
        source:
          type: string
        service:
          type: string
        issue:
          type: string
        severity:
          type: string
        environment:
          type: string
        requested_action:
          type: string
        runbook_id:
          type: string
        state:
          type: string
          enum: [pending_approval, running, succeeded, failed, rolled_back]
        dry_run:
          type: boolean
        auto_approve:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        branch:
          type: string
        baseline_ref:
          type: string
        commit_ref:
          type: string
          nullable: true
        rollback_ref:
          type: string
        notifications:
          type: array
          items:
            type: object
            additionalProperties: true
        metadata:
          type: object
          additionalProperties: true

    # ── Hermes ────────────────────────────────────────────────────────────────
    HermesEventRequest:
      type: object
      required: [event_type, domain, entity_id, payload]
      properties:
        event_type:
          type: string
          example: new_listing
        domain:
          type: string
          example: real_estate
        entity_id:
          type: string
        payload:
          type: object
          additionalProperties: true
        event_ts:
          type: string
          format: date-time

    DispatchSendRequest:
      type: object
      required: [channel, target, message]
      properties:
        channel:
          type: string
          example: telegram
        target:
          type: string
          example: "123456789"
        message:
          type: string
        metadata:
          type: object
          additionalProperties: true

    OutboundEventUpsertRequest:
      type: object
      required: [outbound_event_id, dedupe_key, lifecycle_state, event_type]
      properties:
        outbound_event_id:
          type: string
        dedupe_key:
          type: string
        lifecycle_state:
          type: string
          enum:
            [
              created,
              queued,
              delivered,
              seen,
              answered,
              dismissed,
              superseded,
              failed,
            ]
        event_type:
          type: string
        domain:
          type: string
        entity_id:
          type: string
        subscription_id:
          type: string
        channel:
          type: string
        target:
          type: string
        question_id:
          type: string
        brief_id:
          type: string
        source_service:
          type: string
        superseded_by:
          type: string
        detail:
          type: string
        payload:
          type: object
          additionalProperties: true

    OutboundEventStateUpdateRequest:
      type: object
      required: [lifecycle_state]
      properties:
        lifecycle_state:
          type: string
          enum:
            [
              created,
              queued,
              delivered,
              seen,
              answered,
              dismissed,
              superseded,
              failed,
            ]
        detail:
          type: string
        superseded_by:
          type: string

    # ── Chronos ───────────────────────────────────────────────────────────────
    CalendarEvent:
      type: object
      required: [title, start_datetime, end_datetime]
      properties:
        title:
          type: string
        description:
          type: string
        start_datetime:
          type: string
          format: date-time
        end_datetime:
          type: string
          format: date-time
        location:
          type: string
        timezone:
          type: string
          default: Europe/Rome
        all_day:
          type: boolean
          default: false
        reminders_minutes_before:
          type: array
          items:
            type: integer
          default: [30]
        source_reference:
          type: string

    CreateEventRequest:
      type: object
      required: [event]
      properties:
        event:
          $ref: "#/components/schemas/CalendarEvent"
        target_providers:
          type: array
          items:
            type: string
          default: []
        calendar_id:
          type: string
          default: primary

    ListEventsRequest:
      type: object
      required: [start_datetime, end_datetime]
      properties:
        start_datetime:
          type: string
          format: date-time
        end_datetime:
          type: string
          format: date-time
        target_providers:
          type: array
          items:
            type: string
        calendar_id:
          type: string
          default: primary
        max_results:
          type: integer
          default: 50
          minimum: 1
          maximum: 250

    # ── Scout ─────────────────────────────────────────────────────────────────
    ModuleToolQueryRequest:
      type: object
      required: [domain]
      properties:
        domain:
          type: string
          example: real_estate
        query:
          type: string
        session_id:
          type: string
        limit:
          type: integer
          default: 20
          minimum: 1
          maximum: 50
        filters:
          type: object
          additionalProperties: true
        filters_gt:
          type: object
          additionalProperties: true
        filters_lt:
          type: object
          additionalProperties: true
        sort_by:
          type: string
        sort_order:
          type: string
          enum: [asc, desc]
        preferences:
          type: array
          items:
            type: object

    RealEstateSearchRequest:
      type: object
      properties:
        query:
          type: string
        limit:
          type: integer
          default: 20
          minimum: 1
          maximum: 50
        city:
          type: string
        nearby:
          type: string
        radius_km:
          type: number
        price_max:
          type: number
        price_min:
          type: number
        rooms_min:
          type: integer
        surface_min:
          type: number

# ─────────────────────────────────────────────────────────────────────────────
#  Paths
# ─────────────────────────────────────────────────────────────────────────────
paths:
  # ══════════════════════════════════════════════════════════════════════════
  #  HUB — 19001
  # ══════════════════════════════════════════════════════════════════════════

  /health:
    get:
      tags: [Hub]
      summary: Hub health check
      servers:
        - url: http://localhost:19001
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/registry/register:
    post:
      tags: [Hub]
      summary: Register a service
      servers:
        - url: http://localhost:19001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterServiceRequest"
      responses:
        "200":
          description: Registered

  /api/registry/deregister:
    post:
      tags: [Hub]
      summary: Deregister a service
      servers:
        - url: http://localhost:19001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                base_url:
                  type: string
      responses:
        "200":
          description: Deregistered

  /api/registry/revision:
    get:
      tags: [Hub]
      summary: Get current registry revision number
      servers:
        - url: http://localhost:19001
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    type: integer
                  updated_at:
                    type: string
                  services_count:
                    type: integer

  /api/registry/wait:
    get:
      tags: [Hub]
      summary: Wait for registry revision change (long-poll)
      servers:
        - url: http://localhost:19001
      parameters:
        - name: after_revision
          in: query
          schema:
            type: integer
            default: 0
        - name: timeout_seconds
          in: query
          schema:
            type: number
            default: 120
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision:
                    type: integer
                  updated_at:
                    type: number
                  changed:
                    type: boolean
                  services_count:
                    type: integer

  /api/registry/services:
    get:
      tags: [Hub]
      summary: List all registered services
      servers:
        - url: http://localhost:19001
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      type: object

  /api/discovery/commands:
    get:
      tags: [Hub]
      summary: Discover all routable commands
      servers:
        - url: http://localhost:19001
      parameters:
        - name: client
          in: query
          schema:
            type: string
          example: telegram
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  commands:
                    type: array
                    items:
                      type: object

  /api/discovery/module-tools:
    get:
      tags: [Hub]
      summary: Discover module-tool endpoints
      servers:
        - url: http://localhost:19001
