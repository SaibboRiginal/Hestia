      tags: [Athena]
      summary: List Athena task lifecycle records
      servers:
        - url: http://localhost:19009
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: task_type
          in: query
          schema:
            type: string
            example: athena.focus_brief.periodic
        - name: lifecycle_state
          in: query
          schema:
            type: string
            enum: [queued, running, succeeded, failed, canceled]
      responses:
        "200":
          description: "{status, count, tasks[]}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  count:
                    type: integer
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/TaskLifecycleRecord"

  /api/athena/tasks/{task_id}:
    get:
      tags: [Athena]
      summary: Get one Athena task lifecycle record
      servers:
        - url: http://localhost:19009
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "{status, task}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  task:
                    $ref: "#/components/schemas/TaskLifecycleRecord"
        "404":
          description: task not found

  /api/athena/commitments:
    get:
      tags: [Athena]
      summary: List unresolved or historical Athena commitments
      servers:
        - url: http://localhost:19009
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: include_resolved
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: "{status, count, commitments[]}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  count:
                    type: integer
                  commitments:
                    type: array
                    items:
                      $ref: "#/components/schemas/AthenaCommitmentRecord"

  /api/athena/commitments/{brief_id}/resolve:
    post:
      tags: [Athena]
      summary: Resolve an open Athena commitment
      servers:
        - url: http://localhost:19009
      parameters:
        - name: brief_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  default: resolved
                note:
                  type: string
      responses:
        "200":
          description: "{status, commitment}"
        "404":
          description: commitment not found

  /api/athena/thinking:
    get:
      tags: [Athena]
      summary: List recent Athena thinking records (observation → candidates → decisions)
      description: >
        Returns a time-ordered list of thinking cycles. Each record shows what
        Athena observed, what action candidates it considered, and what it
        actually emitted. This is the audit trail for proactive cognition.
      servers:
        - url: http://localhost:19009
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: "{status, count, thinking}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  count:
                    type: integer
                  thinking:
                    type: array
                    items:
                      $ref: "#/components/schemas/AthenaThinkingRecord"

  /api/athena/thinking/summary:
    get:
      tags: [Athena]
      summary: Compact thinking cycles (page Pensieri, MCP tool athena_thinking)
      description: >
        Newest first. Observation as counts (no services payload), every candidate (accepted or discarded) with
        its 5 gate signals, score, accepted, gate_reason and outcome.
      servers:
        - url: http://localhost:19009
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 10, maximum: 50}}
      responses:
        "200": {description: "{status, count, running, threshold, loop_enabled, strategist_enabled, interval_seconds, weights{urgency, usefulness, novelty, confidence, interruption_cost}, cycles: [{record_id, trace_id, cycle_at, trigger, threshold, duration_ms, emitted_count, error, observation{services, unhealthy_services[], domains[{domain, total, recent, pending}], active_commitments, unresolved_commitments, failure_streak, recent_errors, recent_errors_sample[], quality_issues[], presence}, candidates: [{candidate_id, title, summary, kind, domain, priority, reasoning, signals, score, accepted, gate_reason, outcome, setting_key, setting_value}]}]}"}

  /api/athena/think:
    post:
      tags: [Athena]
      summary: «Pensa ora» — run one full thinking cycle now (background)
      description: >
        observe → think → gate → act → archive with trigger=manual, past the idle gate and the agenda window.
        One cycle at a time (shared with the loop). The record appears in /api/athena/thinking.
      servers:
        - url: http://localhost:19009
      responses:
        "200": {description: "{status: started, trace_id} | {status: busy, detail}"}

  /athena/api/ui/manifest:
    get:
      tags: [Athena]
      summary: WebUI plugin manifest (real path /api/ui/manifest; kind core, api_prefix /api/athena/)
      description: |
        Plugin contract (docs/work/2026-10-17-client-plugins/SPEC.md §4): page `pensieri` (athena-thoughts, order 130),
        widget `ultimo` (athena-last-widget, auto), quick action `pensa` (POST /api/athena/think). Bundle /ui/webui/athena.js.
      servers:
        - url: http://localhost:19009
      responses:
        "200": {description: "{module: athena, title, icon, color, description, kind: core, clients.webui{entry, api_prefix, page[], widget[], quick_action[]}, version}"}

  /api/athena/observation:
    get:
      tags: [Athena]
      summary: Fetch the most recent observation snapshot
      description: >
        Returns live system state as last seen by Athena: registered services,
        unhealthy services, domain entity summaries, and self-state metrics.
      servers:
        - url: http://localhost:19009
      responses:
        "200":
          description: "{status, observation}"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  observation:
                    $ref: "#/components/schemas/ObservationSnapshot"

  # ── WebUI ───────────────────────────────────────────────────────────────
  /api/webui/auth/access:
    get:
      tags: [WebUI]
      summary: Does this browser need the access token? (no token required to call it)
      description: >-
        local=true only when the Themis switch webui.auth.local_without_token is on, the request carries no
        Cloudflare/proxy header (Cf-Connecting-Ip, Cf-Ray, Cdn-Loop, X-Forwarded-*, Forwarded…), its Host is not
        a public tunnel host and the TCP peer is loopback/private. Then /api/webui/* and /hubs/chat work
        without token; through the Cloudflare tunnel the token is always required.
      servers:
        - url: http://localhost:19015
      responses:
        "200": {description: "{local, tokenRequired}"}

  /api/webui/chat/context:
    get:
      tags: [WebUI]
      summary: Context gauge of the current conversation (→ Oracle /api/chat/context?session_id=<current>)
      responses:
        "200": {description: Oracle context stats (active provider, session_usage)}

  /api/webui/chat/compact:
    post:
      tags: [WebUI]
      summary: Compact the current conversation (→ Oracle /api/chat/compact)
      responses:
        "200": {description: "{session_id, before_tokens, after_tokens, …}"}

  /.well-known/oauth-authorization-server (WebUI door):
    get:
      tags: [WebUI]
      summary: "Public OAuth door (OAuthDoorController, no WebUI login): /.well-known/oauth-*, /oauth/register|token|revoke → Hub → Hestia-MCP with X-Hestia-Public-Base; /oauth/authorize → 302 /p/mcp/accessi?oauth=<id> (consent card)"
      servers:
        - url: http://localhost:19015
      responses:
        "200": {description: As the Hestia-MCP endpoint of the same path}

  /api/webui/plugins/catalog:
    get:
      tags: [WebUI]
      summary: Client plugins for this WebUI (→ Hub /api/discovery/catalog?client=webui), cached 15 s
      parameters:
        - {name: fresh, in: query, required: false, schema: {type: boolean}, description: "skip the 15 s cache"}
      responses:
        "200": {description: "{revision, ui_revision, modules[], contributions.webui.{bundle,page,widget,quick_action}[]}"}

  /api/webui/plugins/{module}/bundle/{file}:
    get:
      tags: [WebUI]
      summary: A module's WebUI bundle file (→ Hub route <module>/ui/webui/<file>); the browser imports it as an ES module
      parameters:
        - {name: module, in: path, required: true, schema: {type: string}}
        - {name: file, in: path, required: true, schema: {type: string}, description: "path inside ui/dist/webui (no ..)"}
      responses:
        "200": {description: "file content (text/javascript, css, json, svg)"}
        "404": {description: unknown module or file}

  /api/webui/plugins/{module}/call/{path}:
    get: &plugin_call
      tags: [WebUI]
      summary: Plugin → its own module (→ Hub route <module>/<path>); path must start with the module's api_prefix
      description: Any method (GET/POST/PUT/PATCH/DELETE). Query and JSON body are forwarded; access_token is never forwarded.
      parameters:
        - {name: module, in: path, required: true, schema: {type: string}}
        - {name: path, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: module answer (status code passed through)}
        "403": {description: path outside the module's api_prefix}
    post: *plugin_call
    put: *plugin_call
    patch: *plugin_call
    delete: *plugin_call

  /api/webui/plugins/{module}/image:
    get:
      tags: [WebUI]
      summary: Image from a module ({mime, data_b64} answer turned into bytes); usable in <img src> with ?token=
      parameters:
        - {name: module, in: path, required: true, schema: {type: string}}
        - {name: path, in: query, required: true, schema: {type: string}, description: "under the module's api_prefix"}
      responses:
        "200": {description: image bytes}

  /api/ai/widgets:
    get:
      tags: [WebUI]
      summary: Assistant tool webui_widgets — compact widget catalog for dashboards (internal, via Hub)
      parameters:
        - {name: q, in: query, required: false, schema: {type: string}}
      responses:
        "200": {description: "{count, widgets: [{id, label, module, help, sizes, size, auto, online, params}]}"}

  /api/ai/mcp:
    post:
      tags: [WebUI]
      summary: The WebUI's own module tools as MCP JSON-RPC (capabilities.mcp_endpoint; read by Hub). Was /mcp before 2026-10-18
      responses:
        "200": {description: JSON-RPC result}

  /api/ai/dashboards:
    get:
      tags: [WebUI]
      summary: Assistant tool webui_dashboards — current value of webui.dashboards (client layer webui)
      responses:
        "200": {description: "{key, note, value: {dashboards: [...]}}"}

  /api/webui/presence:
    get:
      tags: [WebUI]
      summary: Assistant state for the sidebar badge (→ Chronos /api/presence)
      responses:
        "200": {description: presence state}

  /api/webui/presence/history:
    get:
      tags: [WebUI]
      summary: Last state changes (→ Chronos /api/presence/history)
      responses:
        "200": {description: "{count, items[]}"}

  /api/webui/presence/dnd:
    post:
      tags: [WebUI]
      summary: Non disturbare on (body {minutes?, until?}; → Chronos)
      responses:
        "200": {description: presence state}
    delete:
      tags: [WebUI]
      summary: Non disturbare off (→ Chronos)
      responses:
        "200": {description: presence state}

  /api/webui/notifications:
    get:
      tags: [WebUI]
      summary: Notifiche page inbox (→ Hermes /api/notifications, client=webui)
      parameters:
        - { name: filter, in: query, schema: { type: string, enum: [all, unread, pending] } }
        - { name: source, in: query, schema: { type: string } }
        - { name: before, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: "{items, counts}"

  /api/webui/notifications/counts:
    get:
      tags: [WebUI]
      summary: Sidebar badge counters
      responses:
        "200":
          description: "{unread, pending}"

  /api/webui/notifications/seen-all:
    post:
      tags: [WebUI]
      summary: Mark all seen
      responses:
        "200":
          description: "{status, changed}"

  /api/webui/notifications/{id}/seen:
    post:
      tags: [WebUI]
      summary: Mark one seen
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: "{status, changed}"

  /api/webui/notifications/{id}/answer:
    post:
      tags: [WebUI]
      summary: Answer a notification ({actionId}); 409 = already handled on another client
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [actionId], properties: { actionId: { type: string } } }
      responses:
        "200":
          description: "{status, answer}"
        "409":
          description: "{status: already_handled, answer}"

  /api/webui/admin/generate-token:
    servers:
      - url: http://localhost:19015
    post:
      tags: [WebUI]
      summary: Generate WebUI access token
      description: >
        Generates a new 256-bit access token. Invalidates previous token.
        NOT Hub-routed — called directly by Telegram on internal Docker network.
      parameters:
        - name: lifetimeHours
          in: query
          schema:
            type: number
            default: 72
      responses:
        "200":
          description: "{token, public_url, expires_in_seconds, lifetime_hours}"

  /api/webui/admin/revoke-token:
    servers:
      - url: http://localhost:19015
    post:
      tags: [WebUI]
      summary: Revoke WebUI access token
      description: Immediately invalidates the current active token.
      responses:
        "200":
          description: "{status: revoked}"

  /api/webui/admin/token-status:
    servers:
      - url: http://localhost:19015
    get:
      tags: [WebUI]
      summary: Get WebUI token status
      responses:
        "200":
          description: "{active, created_at, expires_at, remaining_seconds, remaining_hours}"

  /api/webui/admin/public-url:
    servers:
      - url: http://localhost:19015
    get:
      tags: [WebUI]
      summary: Get current public-facing Cloudflare URL
      responses:
        "200":
          description: "{public_url, detected}"

  /api/webui/transfer/modules:
    servers:
      - url: http://localhost:19015
    get:
      tags: [WebUI]
      summary: Modules with the transfer capability (Hub registry)
      responses:
        "200": {description: "{modules[{module, settings}]}"}
        "503": {description: "Hub unreachable"}

  /api/webui/transfer/{module}/describe:
    servers:
      - url: http://localhost:19015
    get:
      tags: [WebUI]
      summary: Forward to the module's /api/transfer/describe (only modules with the capability, else 404)
      parameters:
        - {name: module, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "see /api/transfer/describe"}

  /api/webui/transfer/{module}/files/{id}:
    servers:
      - url: http://localhost:19015
    get:
      tags: [WebUI]
      summary: Forward to the module's /api/transfer/files/{id}
      parameters:
        - {name: module, in: path, required: true, schema: {type: string}}
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "see /api/transfer/files/{blob_id}"}

  /api/webui/transfer/{module}/{op}:
    servers:
      - url: http://localhost:19015
    post:
      tags: [WebUI]
      summary: Forward items · export · import · files (upload) to the module's /api/transfer/{op}
      parameters:
        - {name: module, in: path, required: true, schema: {type: string}}
        - {name: op, in: path, required: true, schema: {type: string, enum: [items, export, import, files]}}
      responses:
        "200": {description: "the module's answer, status kept"}

  /api/webui/transfer/restore-points:
    servers:
      - url: http://localhost:19015
    get:
      tags: [WebUI]
      summary: Restore points saved before imports (Archive blobs of webui, newest webui.transfer.restore_points kept)
      responses:
        "200": {description: "{items[{id, created_at, size, label, modules}], keep}"}
    post:
      tags: [WebUI]
      summary: Save a restore point (gzip in Archive) and prune the oldest
      requestBody:
        content:
          application/json:
            schema: {type: object, required: [file], properties: {label: {type: string}, modules: {type: array, items: {type: string}}, file: {type: object, description: ".hestia JSON"}}}
      responses:
        "200": {description: "{id}"}

  /api/webui/transfer/restore-points/{id}:
    servers:
      - url: http://localhost:19015
    get:
      tags: [WebUI]
      summary: The restore point as .hestia JSON (imported with «Sostituisci»)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: ".hestia JSON"}
        "404": {description: "not a restore point"}
    delete:
      tags: [WebUI]
      summary: Delete a restore point
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200": {description: "deleted"}
        "404": {description: "not a restore point"}
