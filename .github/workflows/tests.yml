name: Hestia Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same PR cancels the run still going on the old commit (its result no longer matters).
# Runs on main are never cancelled: each merge keeps its own result.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung test or install stops here instead of holding the run for GitHub's 6-hour default.
    timeout-minutes: 20
    strategy:
      # One red service must not cancel the others: we want every result.
      fail-fast: false
      matrix:
        service:
          - Oracle
          - Athena
          - Archive
          - Argus
          - Atlas
          - Chronos
          - Dummy
          - Hecate
          - Hephaestus
          - Hermes
          - Hub
          - Iris
          - Scout
          - Telegram
          - Themis
          - Hercules
          - Hygieia
          - Wardrobe
          - Plutus
          - Echo
          - Apollo
          - Aphrodite
          - Lares
          - Hera
          - Demeter
          - Calliope
          - Kairos
          - Psyche
          - Metis
          - MCP

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache the downloaded wheels: fewer trips to PyPI, fewer network failures.
          cache: pip
          cache-dependency-path: |
            Hestia-${{ matrix.service }}/requirements.txt
            Hestia-Hephaestus/requirements-forge-tests.txt

      - name: Install dependencies
        env:
          # A PyPI hiccup is retried instead of failing the job.
          PIP_RETRIES: "5"
          PIP_TIMEOUT: "60"
        run: |
          # Service pins first, then the union of test deps (httpx for
          # TestClient, shared libs) used by Forge; pytest-cov for coverage.
          # httpx<0.28: services pinned to old Starlette (Archive, Hecate) pass
          # app= to httpx.Client, removed in 0.28.
          pip install -r Hestia-${{ matrix.service }}/requirements.txt
          pip install -r Hestia-Hephaestus/requirements-forge-tests.txt pytest-cov "httpx>=0.27,<0.28"

      - name: Run tests
        run: |
          python -m pytest Hestia-${{ matrix.service }}/tests \
            --junitxml=test-results.xml \
            --cov=Hestia-${{ matrix.service }}/app \
            --cov-report=term \
            --ignore=Hestia-${{ matrix.service }}/tests/test_live_formatting.py \
            --ignore=Hestia-${{ matrix.service }}/tests/test_live_tool_calling.py \
            --ignore=Hestia-${{ matrix.service }}/tests/test_live_tool_calling_comprehensive.py \
            --ignore=Hestia-${{ matrix.service }}/tests/test_live_all_tools.py \
            -m "not llm_live and not integration" \
            -v --tb=short

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: ${{ matrix.service }}
          path: test-results.xml
          reporter: java-junit
          # «Run tests» already turns the job red; the report only shows which tests, no second red step.
          fail-on-error: false

  summary:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "All services passed"
            exit 0
          else
            echo "Some services failed"
            exit 1
          fi
