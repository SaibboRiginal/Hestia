# Standalone run (the global stack is docker-compose.global.yml at repo root).
services:
  hestia_wardrobe:
    build:
      context: ..
      dockerfile: Hestia-Wardrobe/Dockerfile
    container_name: hestia_wardrobe
    ports:
      - "${WARDROBE_PORT:-19017}:19017"
    environment:
      - SERVICE_NAME=wardrobe
      - SERVICE_BASE_URL=http://hestia_wardrobe:19017
      - HUB_API_URL=http://hestia_hub:19001/api
      - TZ=${TZ:-Europe/Rome}
    networks:
      - hestia_net
    restart: unless-stopped

networks:
  hestia_net:
    external: true
